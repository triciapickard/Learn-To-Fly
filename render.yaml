# Render blueprint (plan.md Section 38.2). Apply it from the Render dashboard:
# New + → Blueprint → pick this repository. Secrets marked `sync: false` are entered
# in the dashboard and never committed.
services:
  - type: web
    name: learn-to-fly
    runtime: node
    plan: starter # no sleeping (D-11); use "free" for early testing
    region: oregon # keep close to the Atlas cluster region
    branch: main
    autoDeploy: true
    # --include=dev: the build needs Vite and TypeScript even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # Seeds validated content into Atlas before the new version goes live (Section 38.2).
    # Only verified (published) content is shown unless CONTENT_INCLUDE_DRAFTS is "true".
    preDeployCommand: npm run content:seed
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        sync: false
      - key: TRUST_PROXY
        value: '1'
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_ENABLED
        value: 'true'
      # Sentry DSN for client error reports, baked into the client at build time. Public by
      # nature, but entered in the dashboard so each service can use its own project.
      - key: VITE_SENTRY_DSN
        sync: false
      # Sentry DSN for API (server) error reports. Read at startup by server/src/instrument.ts.
      - key: SENTRY_DSN
        sync: false
      # Set to "true" only on a preview/staging service to show unverified drafts.
      - key: CONTENT_INCLUDE_DRAFTS
        value: 'false'
