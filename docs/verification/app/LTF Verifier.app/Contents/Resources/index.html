<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LTF Verifier</title>
    <style>
      /* Design system 2026 (src/styles/tokens.css): Day values on :root, Night overrides. */
      @font-face {
        font-family: 'Instrument Sans Variable';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('fonts/instrument-sans-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url('fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
      }
      :root {
        color-scheme: light;
        --canvas: #f7f5f3;
        --surface: #ffffff;
        --surface-raised: #ffffff;
        --surface-sunken: #efeeec;
        --line: #dfdedc;
        --line-strong: #81807e;
        --ink: #171614;
        --ink-2: #595856;
        --ink-3: #6a6967;
        --on-ink: #ffffff;
        --accent: #00757c;
        --accent-strong: #005c62;
        --accent-line: #009ca5;
        --accent-tint: #daf7f8;
        --on-accent: #ffffff;
        --go: #006c43;
        --go-tint: #d8f7e6;
        --on-go: #ffffff;
        --caution: #945a00;
        --caution-tint: #ffeecb;
        --warn: #b71824;
        --warn-tint: #ffe7e4;
        --on-warn: #ffffff;
        --tier-gold: #906200;
        --tier-silver: #5f6469;
        --tier-bronze: #8c5331;
        --shadow-1: 0 1px 2px rgba(23, 22, 20, 0.06), 0 1px 3px rgba(23, 22, 20, 0.08);
        --shadow-2: 0 4px 8px rgba(23, 22, 20, 0.06), 0 12px 28px rgba(23, 22, 20, 0.1);
        --shadow-press: inset 0 2px 0 rgba(23, 22, 20, 0.12);
        --font-sans: 'Instrument Sans Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-pill: 999px;
      }
      [data-theme='dark'] {
        color-scheme: dark;
        --canvas: #141412;
        --surface: #1f1e1c;
        --surface-raised: #2b2a28;
        --surface-sunken: #0f0e0d;
        --line: #393836;
        --line-strong: #878684;
        --ink: #ecebe9;
        --ink-2: #b2b1af;
        --ink-3: #939290;
        --on-ink: #141412;
        --accent: #56d3da;
        --accent-strong: #93e5e9;
        --accent-line: #00c3cb;
        --accent-tint: #023538;
        --on-accent: #141412;
        --go: #6bdeaa;
        --go-tint: #152f23;
        --on-go: #141412;
        --caution: #f8c655;
        --caution-tint: #3b2b0d;
        --warn: #ff8880;
        --warn-tint: #442321;
        --on-warn: #141412;
        --tier-gold: #f1c45e;
        --tier-silver: #b9bec4;
        --tier-bronze: #dea279;
        --shadow-1: 0 0 0 1px #393836;
        --shadow-2: 0 0 0 1px #393836, 0 12px 32px rgba(0, 0, 0, 0.5);
        --shadow-press: inset 0 2px 0 rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.5;
        background: var(--canvas);
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      code,
      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      code {
        font-size: 12px;
      }
      h1,
      h2,
      h3 {
        line-height: 1.25;
        margin: 0;
      }
      a {
        color: var(--accent);
      }

      /* Header: the site lockup, progress as a thin horizon line, actions. */
      .topbar {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 10px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .lockup {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.02em;
        white-space: nowrap;
        color: var(--ink);
      }
      .lockup svg {
        width: 28px;
        height: 28px;
        flex: none;
      }
      .lockup .fin {
        fill: currentColor;
      }
      .lockup .stripe {
        fill: var(--accent-line);
      }
      .lockup .app-name {
        font-weight: 500;
        letter-spacing: 0;
        color: var(--ink-2);
        font-size: 15px;
        margin-left: 2px;
        padding-left: 12px;
        border-left: 1px solid var(--line);
      }
      .lockup .app-name small {
        display: block;
        font-size: 11px;
        color: var(--ink-3);
        font-weight: 400;
        margin-top: 2px;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 200px;
      }
      .bar {
        flex: 1;
        height: 6px;
        background: var(--surface-sunken);
        border-radius: var(--radius-pill);
        overflow: hidden;
        display: flex;
      }
      .bar i {
        display: block;
        height: 100%;
      }
      .bar .ok {
        background: var(--go);
      }
      .bar .issue {
        background: var(--warn);
      }
      .bar .skip {
        background: var(--line-strong);
      }
      .progress span {
        color: var(--ink-2);
        white-space: nowrap;
        font-size: 13px;
      }
      .topbar label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-2);
        font-size: 13px;
      }
      .input {
        min-height: 32px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink);
      }
      .input:hover {
        border-color: var(--line-strong);
      }
      .topbar input.input {
        width: 104px;
      }
      .actions {
        display: flex;
        gap: 8px;
        position: relative;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--ink);
        font-weight: 500;
        font-size: 14px;
        line-height: 20px;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 150ms,
          color 150ms;
      }
      .btn:hover {
        background: var(--surface-sunken);
      }
      .btn:active {
        box-shadow: var(--shadow-press);
      }
      .btn.primary {
        background: var(--ink);
        border-color: transparent;
        color: var(--on-ink);
      }
      .btn.primary:hover {
        background: var(--ink-2);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--ink);
      }
      .btn.ghost:hover {
        background: var(--surface-sunken);
      }
      .menu {
        position: absolute;
        right: 0;
        top: 38px;
        background: var(--surface-raised);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-2);
        display: none;
        flex-direction: column;
        min-width: 240px;
        z-index: 5;
        padding: 4px;
      }
      .menu.open {
        display: flex;
      }
      .menu button {
        text-align: left;
        padding: 8px 10px;
        border: 0;
        background: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 14px;
      }
      .menu button:hover {
        background: var(--surface-sunken);
      }
      .menu button.danger {
        color: var(--warn);
      }

      /* Sidebar */
      .layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        width: 300px;
        background: var(--surface);
        border-right: 1px solid var(--line);
        overflow-y: auto;
        padding: 8px;
      }
      .sidebar h2 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-3);
        margin: 16px 10px 6px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 36px;
        padding: 4px 10px;
        border: 0;
        background: none;
        border-radius: var(--radius-sm);
        text-align: left;
        cursor: pointer;
        color: var(--ink);
      }
      .nav-item:hover {
        background: var(--surface-sunken);
      }
      .nav-item.active {
        background: var(--accent-tint);
        color: var(--ink);
        box-shadow: inset 3px 0 0 var(--accent-line);
      }
      .nav-item .code {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        width: 40px;
        flex: none;
      }
      .nav-item .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
      }
      .nav-item .count {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line);
        flex: none;
      }
      .dot.partial {
        background: var(--accent-line);
      }
      .dot.done {
        background: var(--go);
      }
      .dot.issue {
        background: var(--warn);
      }

      /* Item */
      main {
        flex: 1;
        overflow-y: auto;
        padding: 24px 32px 96px;
      }
      .item-head h1 {
        font-size: 28px;
        letter-spacing: -0.02em;
        font-weight: 700;
        margin: 0 0 6px;
      }
      .item-head h1 .code {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: 22px;
        color: var(--accent);
        margin-right: 8px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        padding: 5px 9px;
        border-radius: var(--radius-pill);
        background: var(--surface-sunken);
        color: var(--ink-2);
        margin-left: 8px;
        vertical-align: middle;
        letter-spacing: 0;
      }
      .chip.issue {
        background: var(--warn-tint);
        color: var(--warn);
      }
      .chip.done {
        background: var(--go-tint);
        color: var(--go);
      }
      .chip.partial {
        background: var(--accent-tint);
        color: var(--accent);
      }
      .filepath {
        color: var(--ink-3);
        margin-bottom: 12px;
      }
      .meta {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 16px;
        font-size: 14px;
        margin: 0 0 16px;
        max-width: 880px;
      }
      .meta dt {
        color: var(--ink-3);
      }
      .meta dd {
        margin: 0;
      }
      .card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-1);
        margin-bottom: 16px;
      }
      .record {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px 20px;
        align-items: flex-start;
      }
      .record label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .record .input {
        font-size: 14px;
      }
      .record label.wide {
        flex: 1 1 100%;
      }
      .record textarea {
        min-height: 56px;
        resize: vertical;
        font-size: 14px;
      }

      /* Groups: one card per section */
      .group {
        overflow: hidden;
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }
      .group-head h2 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        flex: 1;
      }
      .group-head .hint {
        display: block;
        font-size: 13px;
        color: var(--ink-3);
        font-weight: 400;
        margin-top: 2px;
      }
      .group-head .gcount {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-3);
      }
      .toggle {
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        padding: 4px 6px;
        border-radius: var(--radius-sm);
      }
      .toggle:hover {
        background: var(--accent-tint);
      }
      .reading {
        padding: 6px 24px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--canvas);
        font-size: 15px;
        line-height: 1.625;
      }
      .reading > * {
        max-width: 68ch;
      }
      .reading.hidden {
        display: none;
      }
      .reading p,
      .reading ul,
      .reading ol,
      .reading table {
        margin: 10px 0;
      }
      .reading h4,
      .reading h5 {
        margin: 14px 0 4px;
      }
      .reading table,
      .detail table {
        border-collapse: collapse;
        font-size: 13px;
        width: 100%;
      }
      .reading th,
      .reading td,
      .detail th,
      .detail td {
        border-bottom: 1px solid var(--line);
        padding: 5px 8px;
        text-align: left;
        vertical-align: top;
      }
      .reading th,
      .detail th {
        color: var(--ink-2);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      /* Callouts: the type's tint fill, the type color only on the title (no left stripe). */
      .callout,
      .quiz,
      .embed,
      .widget {
        border-radius: var(--radius-md);
        padding: 12px 16px;
        margin: 12px 0;
        background: var(--surface-sunken);
        border: 1px solid var(--line);
      }
      .callout {
        border-color: transparent;
      }
      .callout.sim {
        background: var(--accent-tint);
      }
      .callout.sim .tag {
        color: var(--accent);
      }
      .callout.tip {
        background: var(--go-tint);
      }
      .callout.tip .tag {
        color: var(--go);
      }
      .callout.classic {
        background: var(--caution-tint);
      }
      .callout.classic .tag {
        color: var(--caution);
      }
      .callout.safety {
        background: var(--warn-tint);
      }
      .callout.safety .tag {
        color: var(--warn);
      }
      .callout.verify {
        background: var(--caution-tint);
        border: 1px dashed var(--line-strong);
      }
      .callout.verify .tag {
        color: var(--caution);
      }
      .callout p:last-child,
      .quiz p:last-child,
      .embed p:last-child {
        margin-bottom: 0;
      }
      .tag {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--ink-2);
        margin-bottom: 2px;
      }
      .quiz .prompt {
        font-weight: 600;
      }
      .quiz .options {
        padding-left: 0;
        list-style: none;
      }
      .quiz .options li.correct {
        font-weight: 600;
        color: var(--go);
      }
      .quiz .explain {
        color: var(--ink-2);
        border-top: 1px dashed var(--line);
        margin-top: 8px;
        padding-top: 6px;
        font-size: 14px;
      }
      .quiz .answer {
        margin: 4px 0;
      }
      .widget {
        color: var(--ink-2);
        border-style: dashed;
      }
      .ilink {
        color: var(--accent);
        text-decoration: underline dotted;
      }
      .box.on {
        color: var(--go);
      }

      /* Checks */
      .check {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 16px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--line);
        align-items: start;
      }
      .check:last-child {
        border-bottom: 0;
      }
      .check.issue {
        background: var(--warn-tint);
      }
      .check .label {
        line-height: 1.45;
        padding-top: 4px;
      }
      .check .line {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-3);
        margin-left: 8px;
        white-space: nowrap;
      }
      .check .more {
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        padding: 0 2px;
        margin-left: 8px;
      }
      .check .more:hover {
        text-decoration: underline;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        overflow: hidden;
        background: var(--surface);
      }
      .seg button {
        border: 0;
        background: transparent;
        min-height: 32px;
        padding: 0 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        border-right: 1px solid var(--line);
        color: var(--ink-2);
        transition:
          background-color 150ms,
          color 150ms;
      }
      .seg button:hover {
        background: var(--surface-sunken);
        color: var(--ink);
      }
      .seg button:last-child {
        border-right: 0;
      }
      .seg button.on.ok {
        background: var(--go);
        color: var(--on-go);
      }
      .seg button.on.issue {
        background: var(--warn);
        color: var(--on-warn);
      }
      .seg button.on.skip {
        background: var(--line-strong);
        color: var(--on-ink);
      }
      .check .note {
        grid-column: 1 / -1;
      }
      .check .note textarea {
        width: 100%;
        min-height: 52px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface);
        resize: vertical;
        font-size: 14px;
      }
      .check .note textarea:focus {
        border-color: var(--accent);
      }
      .check .detail {
        grid-column: 1 / -1;
        font-size: 13px;
        color: var(--ink-2);
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface-sunken);
        display: none;
      }
      .check .detail.open {
        display: block;
      }
      .detail dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 14px;
        margin: 2px 0;
      }
      .detail dt {
        color: var(--ink-3);
      }
      .detail dd {
        margin: 0;
      }
      .footer-nav {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
      }
      .empty {
        color: var(--ink-3);
        padding: 48px;
        text-align: center;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--on-ink);
        padding: 10px 16px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-2);
        font-size: 14px;
        opacity: 0;
        transition: opacity 150ms;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
      @media (max-width: 760px) {
        .layout {
          flex-direction: column;
        }
        .sidebar {
          width: auto;
          max-height: 40vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        main {
          padding: 16px;
        }
        .lockup .app-name small {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="lockup">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <clipPath id="fin-clip">
              <path d="M3 37 C13 35 18 27 22 17 L28.5 4 L35.5 4 C37 4 38 5 38 6.5 L38 37 Z" />
            </clipPath>
            <mask id="fin-gap">
              <rect width="40" height="40" fill="#fff" />
              <path d="M6 32 C17 23 29 15.5 44 10.5 L44 12 C29 17 18 24.5 7.5 33.5 Z" fill="#000" />
            </mask>
          </defs>
          <g mask="url(#fin-gap)">
            <path
              class="fin"
              d="M3 37 C13 35 18 27 22 17 L28.5 4 L35.5 4 C37 4 38 5 38 6.5 L38 37 Z"
            />
            <path
              class="stripe"
              clip-path="url(#fin-clip)"
              d="M8 42 C18 30 29 22 44 16 L44 24.5 C31 29 23 35 17.5 42 Z"
            />
          </g>
        </svg>
        <span>Learn to Fly</span>
        <span class="app-name">Verifier<small id="brandSub"></small></span>
      </div>
      <div class="progress">
        <div class="bar" id="bar"></div>
        <span id="progressText" class="mono"></span>

    <script id="ltf-data" type="application/json">
      {"generatedAt":"2026-10-22","simVersion":"1.8.16.0","modules":[{"code":"M2","title":"Fundamentals of flight","summary":"Straight and level, climbs, descents and coordinated turns.","items":[{"id":"L2.1","type":"lesson","title":"Four forces and how a wing works","file":"content/lessons/m2-fundamentals/l2-1-four-forces-and-how-a-wing-works.md","priority":"P0","estimatedMinutes":15,"meta":[{"label":"Summary","value":"Lift, weight, thrust and drag, angle of attack, and why a wing stalls at an angle, not at a speed."},{"label":"Prerequisites","value":"L1.4 Speeds, limits and checklists"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L2.1:tracker:hd2fhj","label":"No sim instructions. Run 54.4: check the angle-of-attack widget and the Go deeper links"}]},{"id":"the-four-forces","title":"The four forces","reading":"<p>Four forces act on an airplane in flight:<\/p><ul><li><strong>Lift<\/strong> pulls the airplane up. The wings make it.<\/li><li><strong>Weight<\/strong> pulls it down toward the center of the Earth.<\/li><li><strong>Thrust<\/strong> pulls it forward. The propeller makes it.<\/li><li><strong>Drag<\/strong> holds it back. Every part of the airplane moving through the air makes some.<\/li><\/ul><p>In <strong>straight-and-level, unaccelerated flight<\/strong> (constant speed, constant altitude, constant heading), the forces balance: lift equals weight and thrust equals drag. Change one of them and the airplane changes what it's doing until they balance again. Add power and you gain speed until drag catches up. Raise the nose and you climb.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>In straight-and-level, unaccelerated flight, lift equals what?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Thrust<\/p><\/li><li class=\"correct\">☑ <p>Weight<\/p><\/li><li class=\"\">☐ <p>Drag<\/p><\/li><li class=\"\">☐ <p>Twice the weight<\/p><\/li><\/ul><div class=\"explain\"><p>Lift equals weight (and thrust equals drag). If lift were greater than weight, the airplane would climb.<\/p><\/div><\/div>","checks":[{"id":"L2.1:the-four-forces:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.1:the-four-forces:quiz:l2-1-q1","label":"Quiz l2-1-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>In straight-and-level, unaccelerated flight, lift equals what?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Thrust<\/p><\/li><li class=\"correct\">☑ <p>Weight<\/p><\/li><li class=\"\">☐ <p>Drag<\/p><\/li><li class=\"\">☐ <p>Twice the weight<\/p><\/li><\/ul><div class=\"explain\"><p>Lift equals weight (and thrust equals drag). If lift were greater than weight, the airplane would climb.<\/p><\/div><\/div>"}]},{"id":"relative-wind-and-angle-of-attack","title":"Relative wind and angle of attack","reading":"<p>These terms matter here:<\/p><ul><li>The <strong>chord line<\/strong> is an imaginary straight line from the wing's leading edge to its trailing edge.<\/li><li>The <strong>relative wind<\/strong> is the airflow the wing feels. It always blows opposite to the direction the airplane is moving, not the direction the nose points.<\/li><li>The <strong>angle of attack (AoA)<\/strong> is the angle between the chord line and the relative wind.<\/li><\/ul><p>Angle of attack is not the same as pitch attitude. In a steep descent with the nose on the horizon, the airplane is moving downward, so the relative wind comes from below and the angle of attack can be large even though the nose looks level.<\/p>","checks":[{"id":"L2.1:relative-wind-and-angle-of-attack:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"lift-and-the-critical-angle-of-attack","title":"Lift and the critical angle of attack","reading":"<p>As angle of attack increases, the wing makes more lift, up to a point. At the <strong>critical angle of attack<\/strong> (roughly 15–20° for a typical light-airplane wing) the air can no longer follow the curved top of the wing. The flow separates, lift drops sharply and drag climbs. That's a <strong>stall<\/strong>.<\/p><p>Drag the slider below and watch the streamlines and the lift curve. Try it with flaps down too.<\/p><div class=\"widget\">⚙ Widget W4 (angle-of-attack, mode=explore): open it on the site to check it.<\/div><div class=\"callout tip\"><span class=\"tag\">Pro tip<\/span><p>Angle of attack, not airspeed, decides when the wing stalls. You can stall at any speed and in any attitude if you exceed the critical angle.<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>A wing stalls when it exceeds what?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Its maximum speed<\/p><\/li><li class=\"correct\">☑ <p>The critical angle of attack<\/p><\/li><li class=\"\">☐ <p>A pitch attitude of 20° nose up<\/p><\/li><li class=\"\">☐ <p>Its maximum lift at cruise speed<\/p><\/li><\/ul><div class=\"explain\"><p>A stall happens when the wing exceeds its critical angle of attack. It can happen at any airspeed or attitude.<\/p><\/div><\/div>","checks":[{"id":"L2.1:lift-and-the-critical-angle-of-attack:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.1:lift-and-the-critical-angle-of-attack:widget:angle-of-attack:mode=explore","label":"Widget W4 (angle-of-attack, mode=explore): shows the right thing and matches the lesson text?"},{"id":"L2.1:lift-and-the-critical-angle-of-attack:callout:lo6cm9","label":"Pro tip: correct and useful?","detail":"<p>Angle of attack, not airspeed, decides when the wing stalls. You can stall at any speed and in any attitude if you exceed the critical angle.<\/p>"},{"id":"L2.1:lift-and-the-critical-angle-of-attack:quiz:l2-1-q2","label":"Quiz l2-1-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>A wing stalls when it exceeds what?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Its maximum speed<\/p><\/li><li class=\"correct\">☑ <p>The critical angle of attack<\/p><\/li><li class=\"\">☐ <p>A pitch attitude of 20° nose up<\/p><\/li><li class=\"\">☐ <p>Its maximum lift at cruise speed<\/p><\/li><\/ul><div class=\"explain\"><p>A stall happens when the wing exceeds its critical angle of attack. It can happen at any airspeed or attitude.<\/p><\/div><\/div>"}]},{"id":"the-lift-equation-in-plain-words","title":"The lift equation, in plain words","reading":"<p>Lift depends mainly on things you control:<\/p><ul><li><strong>Speed.<\/strong> More airflow makes more lift, and lift grows with the <em>square<\/em> of speed: twice as fast makes four times the lift.<\/li><li><strong>Angle of attack.<\/strong> A bigger angle makes more lift, up to the critical angle.<\/li><\/ul><p>So to keep the same lift (and hold altitude) at a lower speed, you need a higher angle of attack. So the nose comes up as you slow down in level flight.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>You slow down but want to keep your altitude. What must happen to the angle of attack?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>It must increase<\/p><\/li><li class=\"\">☐ <p>It must decrease<\/p><\/li><li class=\"\">☐ <p>It stays the same<\/p><\/li><\/ul><div class=\"explain\"><p>Less speed means less lift at the same angle of attack. To hold altitude you increase the angle of attack, raising the nose, to make up the difference.<\/p><\/div><\/div>","checks":[{"id":"L2.1:the-lift-equation-in-plain-words:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.1:the-lift-equation-in-plain-words:quiz:l2-1-q3","label":"Quiz l2-1-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>You slow down but want to keep your altitude. What must happen to the angle of attack?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>It must increase<\/p><\/li><li class=\"\">☐ <p>It must decrease<\/p><\/li><li class=\"\">☐ <p>It stays the same<\/p><\/li><\/ul><div class=\"explain\"><p>Less speed means less lift at the same angle of attack. To hold altitude you increase the angle of attack, raising the nose, to make up the difference.<\/p><\/div><\/div>"}]},{"id":"two-kinds-of-drag","title":"Two kinds of drag","reading":"<ul><li><strong>Parasite drag<\/strong> comes from pushing the airplane through the air: the shape of the fuselage, the wheels, the antennas. It grows quickly as you go faster.<\/li><li><strong>Induced drag<\/strong> comes from making lift. It is largest at low speed, where the wing works at a high angle of attack.<\/li><\/ul><p>Add them together and total drag is lowest somewhere in the middle. Slower than that, induced drag climbs so fast that you need more power to fly slower. You'll feel this in slow flight in Module 5.<\/p>","checks":[{"id":"L2.1:two-kinds-of-drag:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"stall-speed-changes","title":"Stall speed changes","reading":"<p>The stall speeds on the airspeed indicator, 48 KIAS flaps up and 40 KIAS with full flaps, are for straight-and-level flight at maximum weight, at 1 G.<\/p>","checks":[{"id":"L2.1:stall-speed-changes:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"overall","title":"Overall","checks":[{"id":"L2.1:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Name the four forces and how they balance in steady flight.<\/li><li>Define angle of attack and the critical angle of attack.<\/li><li>Explain why an airplane stalls at an angle of attack, not at a speed.<\/li><\/ul>"},{"id":"L2.1:overall:numbers","label":"Every number and V-speed matches the POH and what the sim shows","detail":"<dl><dt>vspeed.vs1<\/dt><dd>48 KIAS<\/dd><dt>vspeed.vso<\/dt><dd>40 KIAS<\/dd><\/dl>"},{"id":"L2.1:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak\" target=\"_blank\" rel=\"noopener\">PHAK Chapter 5 — Aerodynamics of Flight<\/a><\/li><li><a href=\"https://www.boldmethod.com/learn-to-fly/aerodynamics/how-induced-drag-works-with-lift-creation/\" target=\"_blank\" rel=\"noopener\">Boldmethod — how lift creates induced drag<\/a><\/li><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 4 — Energy Management: Mastering Altitude and Airspeed Control<\/a><\/li><\/ul>"},{"id":"L2.1:overall:minutes","label":"Estimated time (15 min) is realistic"}]}]},{"id":"L2.2","type":"lesson","title":"Attitude flying and trim","file":"content/lessons/m2-fundamentals/l2-2-attitude-flying-and-trim.md","priority":"P0","estimatedMinutes":15,"meta":[{"label":"Summary","value":"Set an attitude and a power setting, check the result, and trim the airplane so it holds that attitude hands-off."},{"label":"Prerequisites","value":"L2.1 Four forces and how a wing works"},{"label":"Challenges","value":"C2.1 Straight and level"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L2.2:marker:aqr7o0","label":"Sim check: add a screenshot of the level-cruise sight picture from the default cockpit view (Section 49.5). L0.3 (verified in 1.8.16.0) found about 100 knots at 2,300 RPM; confirm 100–105 KIAS at C2.1's weight and 3,500 ft and adjust the numbers here and in C2.1 if needed.","line":48},{"id":"L2.2:tracker:oub60v","label":"Add the level-cruise sight picture screenshot from the default cockpit camera (49.5)"},{"id":"L2.2:tracker:xvpe6e","label":"Confirm 2,300 RPM gives about 100-105 KIAS level at 3,500 ft at LOAD_SOLO"},{"id":"L2.2:tracker:orynya","label":"Check the trim buttons move in steps as the sim callout says"}]},{"id":"attitude-plus-power-equals-performance","title":"Attitude plus power equals performance","reading":"<p><strong>Attitude + power = performance<\/strong> is the most useful relationship in flying.<\/p><ul><li><strong>Attitude<\/strong> is where the nose points relative to the horizon (pitch) and how the wings are tilted (bank).<\/li><li><strong>Power<\/strong> is the engine setting, in RPM.<\/li><li><strong>Performance<\/strong> is what you get: airspeed, and whether you climb, hold altitude or descend.<\/li><\/ul><p>For a given weight, a particular attitude and power setting always give the same airspeed and vertical speed. So instead of chasing numbers, set a known attitude and power, let the airplane settle, then check the instruments and make small adjustments.<\/p>","checks":[{"id":"L2.2:attitude-plus-power-equals-performance:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"the-cruise-picture","title":"The cruise picture","reading":"<p>In level cruise at about 2,300 RPM, the Skyhawk's nose sits just about on the horizon. From the pilot's seat, the horizon crosses the windshield a few inches above the top of the glare shield. Learn this picture. It's your reference for level flight.<\/p><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: add a screenshot of the level-cruise sight picture from the default cockpit view (Section 49.5). L0.3 (verified in 1.8.16.0) found about 100 knots at 2,300 RPM; confirm 100–105 KIAS at C2.1's weight and 3,500 ft and adjust the numbers here and in C2.1 if needed.<\/p><\/div><div class=\"callout classic\"><span class=\"tag\">Classic panel<\/span><p>In the classic panel, the attitude indicator is the top middle instrument of the six-pack. It shows the same picture as the PFD's background: a small airplane symbol against the horizon.<\/p><\/div>","checks":[{"id":"L2.2:the-cruise-picture:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.2:the-cruise-picture:callout:1bwwumt","label":"Classic panel: matches the classic panel?","detail":"<p>In the classic panel, the attitude indicator is the top middle instrument of the six-pack. It shows the same picture as the PFD's background: a small airplane symbol against the horizon.<\/p>"}]},{"id":"the-scan","title":"The scan","reading":"<p>When you fly by looking outside (VFR), spend most of your time, about 80–90%, looking outside. Glance inside for the other 10–20%.<\/p><p>Inside, use a <strong>hub-and-spoke<\/strong> scan: the attitude indicator is the hub. Glance from the attitude to the airspeed and back, to the altitude and back, to the heading and back. The attitude tells you what the airplane is doing now. The other instruments confirm the result a moment later.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>When flying VFR, where should most of your attention be?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Outside the airplane<\/p><\/li><li class=\"\">☐ <p>On the attitude indicator<\/p><\/li><li class=\"\">☐ <p>On the vertical speed indicator<\/p><\/li><li class=\"\">☐ <p>On the moving map<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Outside.<\/strong> It's where the traffic is and where the real horizon is. Glance inside to confirm what you see.<\/p><\/div><\/div>","checks":[{"id":"L2.2:the-scan:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.2:the-scan:quiz:l2-2-q1","label":"Quiz l2-2-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>When flying VFR, where should most of your attention be?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Outside the airplane<\/p><\/li><li class=\"\">☐ <p>On the attitude indicator<\/p><\/li><li class=\"\">☐ <p>On the vertical speed indicator<\/p><\/li><li class=\"\">☐ <p>On the moving map<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Outside.<\/strong> It's where the traffic is and where the real horizon is. Glance inside to confirm what you see.<\/p><\/div><\/div>"}]},{"id":"try-it","title":"Try it","reading":"<p>Set the pitch and power below and watch what happens to airspeed and vertical speed. Try the scenarios: cruise, a Vy climb, a cruise descent and slow flight. Then press Trim and see the stick force go away.<\/p><div class=\"widget\">⚙ Widget W5 (pitch-power, mode=explore): open it on the site to check it.<\/div>","checks":[{"id":"L2.2:try-it:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.2:try-it:widget:pitch-power:mode=explore","label":"Widget W5 (pitch-power, mode=explore): shows the right thing and matches the lesson text?"}]},{"id":"trim-technique","title":"Trim technique","reading":"<p>Trim is the step that turns a tiring flight into an easy one:<\/p><ol><li><strong>Set the attitude<\/strong> you want, holding it with the yoke.<\/li><li><strong>Let it stabilize.<\/strong> Give the airspeed a few seconds to settle.<\/li><li><strong>Trim away the pressure.<\/strong> Roll the trim (or tap the trim button) in the direction you're pushing or pulling until you can relax your hand and the airplane stays put.<\/li><\/ol><p>If you're holding back pressure, trim nose up. If you're pushing forward, trim nose down.<\/p><div class=\"callout sim\"><span class=\"tag\">Sim vs reality<\/span><p>With a spring-centered joystick or gamepad, &quot;pressure&quot; means how far you're holding the stick from center. After you trim, you should be able to let the stick return to center and the airplane keeps its attitude. Trim buttons move in steps, so use several short presses rather than holding the button down.<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>Your altitude is slowly increasing with the stick centered. What do you do?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Reduce power a lot<\/p><\/li><li class=\"correct\">☑ <p>Trim nose down slightly<\/p><\/li><li class=\"\">☐ <p>Trim nose up slightly<\/p><\/li><li class=\"\">☐ <p>Hold forward pressure for the rest of the flight<\/p><\/li><\/ul><div class=\"explain\"><p>The airplane is trimmed slightly nose-up. Trim nose down a little, wait, and see if it holds altitude.<\/p><\/div><\/div>","checks":[{"id":"L2.2:trim-technique:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.2:trim-technique:callout:1mz6ije","label":"Sim vs reality: still true in the current sim?","detail":"<p>With a spring-centered joystick or gamepad, &quot;pressure&quot; means how far you're holding the stick from center. After you trim, you should be able to let the stick return to center and the airplane keeps its attitude. Trim buttons move in steps, so use several short presses rather than holding the button down.<\/p>"},{"id":"L2.2:trim-technique:quiz:l2-2-q2","label":"Quiz l2-2-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Your altitude is slowly increasing with the stick centered. What do you do?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Reduce power a lot<\/p><\/li><li class=\"correct\">☑ <p>Trim nose down slightly<\/p><\/li><li class=\"\">☐ <p>Trim nose up slightly<\/p><\/li><li class=\"\">☐ <p>Hold forward pressure for the rest of the flight<\/p><\/li><\/ul><div class=\"explain\"><p>The airplane is trimmed slightly nose-up. Trim nose down a little, wait, and see if it holds altitude.<\/p><\/div><\/div>"}]},{"id":"straight-and-level","title":"Straight and level","reading":"<p>To fly straight and level in cruise:<\/p><ol><li>Set about 2,300 RPM.<\/li><li>Put the nose in the cruise picture and wings level.<\/li><li>Pick a landmark on the horizon straight ahead. Keeping the nose on it holds your heading.<\/li><li>Let the speed settle around 100–105 KIAS, then trim.<\/li><li>Scan: outside, attitude, altitude, heading, back outside.<\/li><\/ol><div class=\"quiz\"><div class=\"prompt\"><p>You're changing from a climb to level flight. Which do you set first?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Attitude (and power); trim last<\/p><\/li><li class=\"\">☐ <p>Trim first, then attitude<\/p><\/li><li class=\"\">☐ <p>Power only; the attitude takes care of itself<\/p><\/li><li class=\"\">☐ <p>Trim, then power, then attitude<\/p><\/li><\/ul><div class=\"explain\"><p>Set the attitude (and power) first, let the airplane settle, and trim last. Trimming first makes the airplane wander while you're still setting up.<\/p><\/div><\/div>","checks":[{"id":"L2.2:straight-and-level:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.2:straight-and-level:quiz:l2-2-q3","label":"Quiz l2-2-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>You're changing from a climb to level flight. Which do you set first?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Attitude (and power); trim last<\/p><\/li><li class=\"\">☐ <p>Trim first, then attitude<\/p><\/li><li class=\"\">☐ <p>Power only; the attitude takes care of itself<\/p><\/li><li class=\"\">☐ <p>Trim, then power, then attitude<\/p><\/li><\/ul><div class=\"explain\"><p>Set the attitude (and power) first, let the airplane settle, and trim last. Trimming first makes the airplane wander while you're still setting up.<\/p><\/div><\/div>"}]},{"id":"common-errors","title":"Common errors","reading":"<ul><li><strong>Chasing the VSI.<\/strong> The vertical speed indicator lags. Fix the attitude, then wait for the VSI to agree.<\/li><li><strong>Forgetting to trim.<\/strong> If your arm is tired, you're flying out of trim.<\/li><li><strong>Staring at one instrument.<\/strong> Keep the scan moving, and keep looking outside.<\/li><\/ul><p>Ready? Fly <span class=\"ilink\" title=\"/challenges/c2-1-straight-and-level\">C2.1 Straight and level<\/span>.<\/p>","checks":[{"id":"L2.2:common-errors:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"overall","title":"Overall","checks":[{"id":"L2.2:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Use the &quot;attitude plus power equals performance&quot; relationship.<\/li><li>Scan outside first and the attitude indicator second, then the other instruments.<\/li><li>Trim the airplane for hands-off level flight.<\/li><\/ul>"},{"id":"L2.2:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 3 — Basic Flight Maneuvers<\/a><\/li><li><a href=\"https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/FAA-H-8083-15B.pdf\" target=\"_blank\" rel=\"noopener\">Instrument Flying Handbook — Airplane Attitude Instrument Flying<\/a><\/li><\/ul>"},{"id":"L2.2:overall:minutes","label":"Estimated time (15 min) is realistic"}]}]},{"id":"L2.3","type":"lesson","title":"Climbs and descents","file":"content/lessons/m2-fundamentals/l2-3-climbs-and-descents.md","priority":"P0","estimatedMinutes":15,"meta":[{"label":"Summary","value":"Enter climbs and descents with attitude, power and trim, and level off on your target altitude."},{"label":"Prerequisites","value":"L2.2 Attitude flying and trim"},{"label":"Challenges","value":"C2.2 Climbs and descents"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L2.3:marker:1343mdj","label":"Sim check: fly the descent settings in the sim and adjust the RPM ranges (Section 8.5) to match.","line":117},{"id":"L2.3:tracker:3ohod2","label":"Fly a 500 fpm descent at 90 KIAS and note the RPM"},{"id":"L2.3:tracker:u0ad37","label":"Adjust the 1,700-2,000 RPM range here and in C2.2 if it differs. Check the level-off lead (10% of VS) works in the sim"}]},{"id":"entering-a-climb","title":"Entering a climb","reading":"<p>The order is <strong>attitude, power, trim<\/strong>:<\/p><ol><li><strong>Attitude.<\/strong> Raise the nose smoothly to the climb attitude, roughly 7–10° nose up.<\/li><li><strong>Power.<\/strong> Add full power.<\/li><li><strong>Trim.<\/strong> As the speed settles on your target, trim away the back pressure.<\/li><\/ol><p>Then adjust the attitude to hold the speed: nose up a little if you're too fast, down a little if you're too slow. In a climb, pitch controls airspeed.<\/p>","checks":[{"id":"L2.3:entering-a-climb:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"which-climb-speed","title":"Which climb speed?","reading":"<table><tr><th>Speed<\/th><th>KIAS<\/th><th>Use it when<\/th><\/tr><tr><td>Vx, best angle<\/td><td>62 KIAS<\/td><td>You need the most height in the shortest distance.<\/td><\/tr><tr><td>Vy, best rate<\/td><td>74 KIAS<\/td><td>You want the most height per minute.<\/td><\/tr><tr><td>Cruise climb<\/td><td>75–85 KIAS<\/td><td>A long climb: better view and engine cooling.<\/td><\/tr><\/table><p>Cruise climb is a little slower to gain altitude, but the nose is lower, so you can see traffic ahead, and more air flows over the engine to keep it cool.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>Which speed gives the most altitude per unit of time?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Vx<\/p><\/li><li class=\"correct\">☑ <p>Vy<\/p><\/li><li class=\"\">☐ <p>Cruise climb<\/p><\/li><li class=\"\">☐ <p>Best glide<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Vy<\/strong> (74 KIAS) gives the best <em>rate<\/em>: the most altitude per minute. Vx gives the best <em>angle<\/em>: the most altitude per distance.<\/p><\/div><\/div>","checks":[{"id":"L2.3:which-climb-speed:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.3:which-climb-speed:quiz:l2-3-q1","label":"Quiz l2-3-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Which speed gives the most altitude per unit of time?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Vx<\/p><\/li><li class=\"correct\">☑ <p>Vy<\/p><\/li><li class=\"\">☐ <p>Cruise climb<\/p><\/li><li class=\"\">☐ <p>Best glide<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Vy<\/strong> (74 KIAS) gives the best <em>rate<\/em>: the most altitude per minute. Vx gives the best <em>angle<\/em>: the most altitude per distance.<\/p><\/div><\/div>"}]},{"id":"leveling-off-from-a-climb","title":"Leveling off from a climb","reading":"<p>Start the level-off before you reach the altitude, or you'll overshoot. Lead by about 10% of your vertical speed. If you're climbing at 500 fpm, start 50 ft early.<\/p><p>The order for the level-off is <strong>attitude, power, trim<\/strong>:<\/p><ol><li><strong>Attitude.<\/strong> Lower the nose to the level picture.<\/li><li>Let the speed build toward cruise.<\/li><li><strong>Power.<\/strong> Reduce to cruise power, about 2,300 RPM.<\/li><li><strong>Trim.<\/strong><\/li><\/ol><div class=\"callout tip\"><span class=\"tag\">Pro tip<\/span><p>Lead your level-off by 10% of your vertical speed.<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>You're climbing at 600 fpm to 3,000 ft. At what altitude should you start leveling off?<\/p><\/div><p class=\"answer\">Answer: <strong>2940 ft<\/strong> (±10)<\/p><div class=\"explain\"><p>10% of 600 fpm is 60 ft, so start the level-off at about <strong>2,940 ft<\/strong>.<\/p><\/div><\/div><div class=\"quiz\"><div class=\"prompt\"><p>Put the steps of a level-off from a climb in order.<\/p><\/div><ol class=\"options\"><li><p>Lower the nose to the level attitude<\/p><\/li><li><p>Let the speed build<\/p><\/li><li><p>Reduce to cruise power<\/p><\/li><li><p>Trim<\/p><\/li><\/ol><p class=\"answer\">Correct order: as listed.<\/p><div class=\"explain\"><p><strong>Attitude, let the speed build, power, trim.<\/strong> Reducing power before the speed builds leaves you slow and nose-high.<\/p><\/div><\/div>","checks":[{"id":"L2.3:leveling-off-from-a-climb:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.3:leveling-off-from-a-climb:callout:1tdruc0","label":"Pro tip: correct and useful?","detail":"<p>Lead your level-off by 10% of your vertical speed.<\/p>"},{"id":"L2.3:leveling-off-from-a-climb:quiz:l2-3-q2","label":"Quiz l2-3-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>You're climbing at 600 fpm to 3,000 ft. At what altitude should you start leveling off?<\/p><\/div><p class=\"answer\">Answer: <strong>2940 ft<\/strong> (±10)<\/p><div class=\"explain\"><p>10% of 600 fpm is 60 ft, so start the level-off at about <strong>2,940 ft<\/strong>.<\/p><\/div><\/div>"},{"id":"L2.3:leveling-off-from-a-climb:quiz:l2-3-q3","label":"Quiz l2-3-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Put the steps of a level-off from a climb in order.<\/p><\/div><ol class=\"options\"><li><p>Lower the nose to the level attitude<\/p><\/li><li><p>Let the speed build<\/p><\/li><li><p>Reduce to cruise power<\/p><\/li><li><p>Trim<\/p><\/li><\/ol><p class=\"answer\">Correct order: as listed.<\/p><div class=\"explain\"><p><strong>Attitude, let the speed build, power, trim.<\/strong> Reducing power before the speed builds leaves you slow and nose-high.<\/p><\/div><\/div>"}]},{"id":"descents","title":"Descents","reading":"<p>To descend at a chosen speed:<\/p><ol><li><strong>Power.<\/strong> Reduce to about 1,700–2,000 RPM.<\/li><li><strong>Attitude.<\/strong> Hold the attitude that gives your target speed. The nose goes a little below the horizon.<\/li><li><strong>Trim<\/strong> once it's stable.<\/li><\/ol><p>In a descent at constant speed, power controls the rate of descent. Less power gives a faster descent. Pitch still sets the airspeed.<\/p><p>Try it below: set up a 500 fpm descent at 90 knots.<\/p><div class=\"widget\">⚙ Widget W5 (pitch-power, mode=quiz): open it on the site to check it.<\/div><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: fly the descent settings in the sim and adjust the RPM ranges (Section 8.5) to match.<\/p><\/div>","checks":[{"id":"L2.3:descents:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.3:descents:widget:pitch-power:mode=quiz","label":"Widget W5 (pitch-power, mode=quiz): shows the right thing and matches the lesson text?"}]},{"id":"leveling-off-from-a-descent","title":"Leveling off from a descent","reading":"<p>Start adding power 50–100 ft before your target altitude, and raise the nose to the level picture as the power comes in. Then trim. If you raise the nose without adding power, you'll slow down.<\/p>","checks":[{"id":"L2.3:leveling-off-from-a-descent:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"look-before-you-climb","title":"Look before you climb","reading":"<p>The Skyhawk's nose blocks your view ahead and above in a climb, and the high wing hides the view above you in a descent. Before a long climb or descent, make a <strong>clearing turn<\/strong>: a gentle turn left or right of 90° or so, looking for traffic, then turn back.<\/p>","checks":[{"id":"L2.3:look-before-you-climb:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"overall","title":"Overall","checks":[{"id":"L2.3:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Enter a climb at Vy and a cruise climb, and level off at a target altitude.<\/li><li>Enter a descent at a target airspeed and rate, and level off.<\/li><li>Lead the level-off by about 10% of the vertical speed.<\/li><\/ul>"},{"id":"L2.3:overall:numbers","label":"Every number and V-speed matches the POH and what the sim shows","detail":"<dl><dt>vspeed.vx<\/dt><dd>62 KIAS<\/dd><dt>vspeed.vy<\/dt><dd>74 KIAS<\/dd><dt>vspeed.cruiseClimb<\/dt><dd>75–85 KIAS<\/dd><\/dl>"},{"id":"L2.3:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 3 — Basic Flight Maneuvers<\/a><\/li><\/ul>"},{"id":"L2.3:overall:minutes","label":"Estimated time (15 min) is realistic"}]}]},{"id":"L2.4","type":"lesson","title":"Turns and coordination","file":"content/lessons/m2-fundamentals/l2-4-turns-and-coordination.md","priority":"P0","estimatedMinutes":20,"meta":[{"label":"Summary","value":"Roll into and out of turns precisely, keep the ball centered with rudder, and roll out on your heading."},{"label":"Prerequisites","value":"L2.3 Climbs and descents"},{"label":"Challenges","value":"C2.3 Turns to headings, C2.4 The box"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L2.4:tracker:1r4tag3","label":"Confirm the PFD turn-rate arc has standard-rate marks and the trend line reaches them at about 17 degrees of bank at 100 KTAS"},{"id":"L2.4:tracker:21qpjx","label":"Check the slip/skid bar behaves as described with auto-rudder off"}]},{"id":"how-an-airplane-turns","title":"How an airplane turns","reading":"<p>An airplane doesn't turn with the rudder. It turns by <strong>banking<\/strong>.<\/p><p>When the wings are level, lift points straight up. When you bank, lift tilts with the wings. Part of it still points up and holds the airplane in the air. The other part points sideways, toward the inside of the turn. That sideways part pulls the airplane around the turn.<\/p><p>Pilots group turns by bank angle:<\/p><table><tr><th>Turn<\/th><th>Bank angle<\/th><\/tr><tr><td>Shallow<\/td><td>up to 20°<\/td><\/tr><tr><td>Medium<\/td><td>20–45°<\/td><\/tr><tr><td>Steep<\/td><td>over 45°<\/td><\/tr><\/table>","checks":[{"id":"L2.4:how-an-airplane-turns:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"back-pressure-in-a-turn","title":"Back pressure in a turn","reading":"<p>Because part of the lift is now pulling sideways, less of it holds the airplane up. If you do nothing, you start to descend. To hold altitude, add a little <strong>back pressure<\/strong> as you roll in. That raises the angle of attack and makes more lift. Release it as you roll out.<\/p><p>The steeper the bank, the more back pressure you need. You'll see why in Module 5, where steep turns double the load on the wings.<\/p>","checks":[{"id":"L2.4:back-pressure-in-a-turn:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"adverse-yaw-and-the-rudder","title":"Adverse yaw and the rudder","reading":"<p>When you roll into a turn, the aileron that goes down (on the rising wing) makes more lift, and also more drag. That drag pulls the rising wing back, so the nose swings away from the turn for a moment. This is <strong>adverse yaw<\/strong>.<\/p><p>To fix it, add rudder in the direction of the turn: left rudder with left aileron, right rudder with right aileron. When the turn is established, you need only a little rudder to keep it coordinated.<\/p><p>Try it below. Bank the airplane, then use the rudder to center the ball.<\/p><div class=\"widget\">⚙ Widget W6 (turn-coordinator, mode=explore): open it on the site to check it.<\/div><div class=\"quiz\"><div class=\"prompt\"><p>The ball is to the right in a right turn. Which rudder do you press?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Left rudder<\/p><\/li><li class=\"correct\">☑ <p>Right rudder<\/p><\/li><li class=\"\">☐ <p>No rudder; use aileron<\/p><\/li><\/ul><div class=\"explain\"><p>&quot;Step on the ball&quot;: press the rudder on the side the ball has moved to. The ball is on the right, so press right rudder.<\/p><\/div><\/div><div class=\"callout classic\"><span class=\"tag\">Classic panel<\/span><p>In the classic panel, the turn coordinator (bottom left of the six-pack) shows the rate of turn with a small airplane, and the ball below it shows coordination. On the G1000 the turn rate trend line and the slip/skid bar do the same jobs.<\/p><\/div>","checks":[{"id":"L2.4:adverse-yaw-and-the-rudder:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.4:adverse-yaw-and-the-rudder:widget:turn-coordinator:mode=explore","label":"Widget W6 (turn-coordinator, mode=explore): shows the right thing and matches the lesson text?"},{"id":"L2.4:adverse-yaw-and-the-rudder:quiz:l2-4-q1","label":"Quiz l2-4-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>The ball is to the right in a right turn. Which rudder do you press?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Left rudder<\/p><\/li><li class=\"correct\">☑ <p>Right rudder<\/p><\/li><li class=\"\">☐ <p>No rudder; use aileron<\/p><\/li><\/ul><div class=\"explain\"><p>&quot;Step on the ball&quot;: press the rudder on the side the ball has moved to. The ball is on the right, so press right rudder.<\/p><\/div><\/div>"},{"id":"L2.4:adverse-yaw-and-the-rudder:callout:1t6d4af","label":"Classic panel: matches the classic panel?","detail":"<p>In the classic panel, the turn coordinator (bottom left of the six-pack) shows the rate of turn with a small airplane, and the ball below it shows coordination. On the G1000 the turn rate trend line and the slip/skid bar do the same jobs.<\/p>"}]},{"id":"standard-rate-turns","title":"Standard-rate turns","reading":"<p>A <strong>standard-rate turn<\/strong> changes heading at 3° per second, so a full circle takes 2 minutes. The bank you need depends on your true airspeed:<\/p><p><strong>Bank ≈ (TAS ÷ 10) + 7<\/strong><\/p><p>At about 100 knots that's 100 ÷ 10 + 7 = <strong>17°<\/strong>. On the G1000, the outer marks on the turn rate arc show standard rate. Hold the magenta trend line on the mark.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>About how much bank do you need for a standard-rate turn at 100 knots true airspeed?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>10°<\/p><\/li><li class=\"correct\">☑ <p>17°<\/p><\/li><li class=\"\">☐ <p>30°<\/p><\/li><li class=\"\">☐ <p>45°<\/p><\/li><\/ul><div class=\"explain\"><p>100 ÷ 10 + 7 = <strong>17°<\/strong>. At 120 knots it would be about 19°.<\/p><\/div><\/div>","checks":[{"id":"L2.4:standard-rate-turns:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.4:standard-rate-turns:quiz:l2-4-q2","label":"Quiz l2-4-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>About how much bank do you need for a standard-rate turn at 100 knots true airspeed?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>10°<\/p><\/li><li class=\"correct\">☑ <p>17°<\/p><\/li><li class=\"\">☐ <p>30°<\/p><\/li><li class=\"\">☐ <p>45°<\/p><\/li><\/ul><div class=\"explain\"><p>100 ÷ 10 + 7 = <strong>17°<\/strong>. At 120 knots it would be about 19°.<\/p><\/div><\/div>"}]},{"id":"rolling-out-on-a-heading","title":"Rolling out on a heading","reading":"<p>The airplane keeps turning while you roll the wings level, so start the rollout before the target heading. Lead by about half your bank angle. In a 20° bank, start rolling out 10° early.<\/p><div class=\"callout tip\"><span class=\"tag\">Pro tip<\/span><p>Start the rollout about half your bank angle before the target heading.<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>You're turning left in a 20° bank toward heading 270. When do you start rolling out?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>At heading 270<\/p><\/li><li class=\"correct\">☑ <p>At about heading 280<\/p><\/li><li class=\"\">☐ <p>At about heading 260<\/p><\/li><li class=\"\">☐ <p>At about heading 300<\/p><\/li><\/ul><div class=\"explain\"><p>Half of 20° is 10°. You're turning left, so heading numbers are decreasing. Start the rollout at about <strong>280<\/strong>.<\/p><\/div><\/div>","checks":[{"id":"L2.4:rolling-out-on-a-heading:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.4:rolling-out-on-a-heading:callout:15g2qhs","label":"Pro tip: correct and useful?","detail":"<p>Start the rollout about half your bank angle before the target heading.<\/p>"},{"id":"L2.4:rolling-out-on-a-heading:quiz:l2-4-q3","label":"Quiz l2-4-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>You're turning left in a 20° bank toward heading 270. When do you start rolling out?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>At heading 270<\/p><\/li><li class=\"correct\">☑ <p>At about heading 280<\/p><\/li><li class=\"\">☐ <p>At about heading 260<\/p><\/li><li class=\"\">☐ <p>At about heading 300<\/p><\/li><\/ul><div class=\"explain\"><p>Half of 20° is 10°. You're turning left, so heading numbers are decreasing. Start the rollout at about <strong>280<\/strong>.<\/p><\/div><\/div>"}]},{"id":"look-before-you-turn","title":"Look before you turn","reading":"<p>Before every turn, look in the direction you're turning, and above and below. In the high-wing Skyhawk, your wing blocks the view in the direction of the turn once you bank, so look <em>before<\/em> you roll in. For a long or steep turn, lift the wing slightly first to check the sky.<\/p>","checks":[{"id":"L2.4:look-before-you-turn:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"when-auto-rudder-is-on","title":"When auto-rudder is on","reading":"<div class=\"callout sim\"><span class=\"tag\">Sim vs reality<\/span><p>With auto-rudder on, the sim adds the rudder for you and keeps the ball close to the center. It can't anticipate adverse yaw as well as a pilot's feet can, so you may still see a small slip as you roll in. The real Skyhawk has no auto-rudder, so every turn needs your feet.<\/p><\/div><p>Now fly <span class=\"ilink\" title=\"/challenges/c2-3-turns-to-headings\">C2.3 Turns to headings<\/span>, then put it all together in <span class=\"ilink\" title=\"/challenges/c2-4-the-box\">C2.4 The box<\/span>.<\/p>","checks":[{"id":"L2.4:when-auto-rudder-is-on:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L2.4:when-auto-rudder-is-on:callout:18os901","label":"Sim vs reality: still true in the current sim?","detail":"<p>With auto-rudder on, the sim adds the rudder for you and keeps the ball close to the center. It can't anticipate adverse yaw as well as a pilot's feet can, so you may still see a small slip as you roll in. The real Skyhawk has no auto-rudder, so every turn needs your feet.<\/p>"}]},{"id":"overall","title":"Overall","checks":[{"id":"L2.4:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Roll into and out of shallow, medium and standard-rate turns.<\/li><li>Keep turns coordinated using rudder.<\/li><li>Roll out on a target heading using a lead of about half the bank angle.<\/li><\/ul>"},{"id":"L2.4:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 3 — Basic Flight Maneuvers<\/a><\/li><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak\" target=\"_blank\" rel=\"noopener\">PHAK Chapter 5 — Aerodynamics of Flight<\/a><\/li><\/ul>"},{"id":"L2.4:overall:minutes","label":"Estimated time (20 min) is realistic"}]}]},{"id":"C2.1","type":"challenge","title":"Str
