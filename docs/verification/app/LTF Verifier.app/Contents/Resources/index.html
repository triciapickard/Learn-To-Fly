0 lb for a block fuel near 240 lb, then press LOAD. The default is only 10 lb.<\/dd><\/dl>"},{"id":"C2.3:setup:assistance","label":"Assistance: training","detail":"<dl><dt>label<\/dt><dd>Learn to Fly Training profile<\/dd><dt>description<\/dt><dd>Auto-Rudder, AI Auto-Trim and path aids off, whatever your controller (gamepads use the LT and RT triggers for rudder). Lesson 0.2 lists every setting.<\/dd><\/dl>"},{"id":"C2.3:setup:switches","label":"AI traffic off, ATC off, crash damage off"}]},{"id":"procedure","title":"Procedure: fly it exactly as written","hint":"Mark any step that is ambiguous, impossible or in the wrong order.","checks":[{"id":"C2.3:step:16lwxwj","label":"Step 1: Before each turn, look in the direction of the turn. Hold 3,500 ft MSL throughout."},{"id":"C2.3:step:14iyzu","label":"Step 2: Standard-rate left turn (about 17° of bank) to heading 270."},{"id":"C2.3:step:1wxo2ys","label":"Step 3: Standard-rate right turn to heading 360."},{"id":"C2.3:step:7xze4p","label":"Step 4: 30° bank right turn to heading 180."},{"id":"C2.3:step:1i3rpjm","label":"Step 5: 30° bank left turn to heading 090."},{"id":"C2.3:step:1hti9me","label":"Step 6: Start each rollout about half your bank angle before the target heading."}]},{"id":"criteria","title":"Criteria: measurable from inside the sim?","hint":"Each criterion must be checkable from the PFD, the clock, the replay or a map trail, and the tiers must make sense.","checks":[{"id":"C2.3:criterion:rollout-heading","label":"Rollout heading accuracy (worst of the four) (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 3<\/dd><dt>Gold<\/dt><dd>Within ±10°<\/dd><dt>Silver<\/dt><dd>Within ±15°<\/dd><dt>Bronze<\/dt><dd>Within ±20°<\/dd><dt>Review link<\/dt><dd>L2.4 Turns and coordination → rolling-out-on-a-heading<\/dd><\/dl>"},{"id":"C2.3:criterion:altitude","label":"Altitude during the turns (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 3<\/dd><dt>Gold<\/dt><dd>Within ±100 ft<\/dd><dt>Silver<\/dt><dd>Within ±150 ft<\/dd><dt>Bronze<\/dt><dd>Within ±200 ft<\/dd><dt>Review link<\/dt><dd>L2.4 Turns and coordination → back-pressure-in-a-turn<\/dd><\/dl>"},{"id":"C2.3:criterion:bank-angle","label":"Bank angle accuracy","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 2<\/dd><dt>Gold<\/dt><dd>Within ±5°<\/dd><dt>Silver<\/dt><dd>Within ±10°<\/dd><dt>Bronze<\/dt><dd>Within ±15°<\/dd><\/dl>"},{"id":"C2.3:criterion:coordination","label":"Coordination (slip/skid bar centered)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 1<\/dd><dt>Gold<\/dt><dd>Mostly centered<\/dd><dt>Silver<\/dt><dd>Occasional slips or skids<\/dd><dt>Bronze<\/dt><dd>Often uncoordinated<\/dd><dt>Review link<\/dt><dd>L2.4 Turns and coordination → adverse-yaw-and-the-rudder<\/dd><\/dl>"},{"id":"C2.3:criterion:look-first","label":"Looked in the direction of the turn before turning","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 1<\/dd><\/dl>"}]},{"id":"extras","title":"Goal, tips and debrief","checks":[{"id":"C2.3:goal","label":"Goal is clear and matches the criteria","detail":"<p>Fly coordinated turns to exact headings while holding a constant altitude.<\/p>"},{"id":"C2.3:mistakes","label":"Common mistakes are the ones you actually see","detail":"<ul><li>Losing altitude in the turns because of too little back pressure.<\/li><li>Overshooting headings by rolling out too late.<\/li><\/ul>"},{"id":"C2.3:tips","label":"Tips are correct and useful","detail":"<ul><li>Rollout lead is half the bank angle. In a 30° bank, start 15° early.<\/li><\/ul>"},{"id":"C2.3:debrief","label":"Debrief questions fit the flight","detail":"<ul><li>Did you lose or gain altitude in the turns? Why?<\/li><\/ul>"}]},{"id":"flight","title":"Flight record (protocol 54.3)","hint":"Record the tier and the minutes it took in the fields above, then tick these.","checks":[{"id":"C2.3:flight:fresh","label":"Flown from the brief only, after a fresh sim start"},{"id":"C2.3:flight:timed","label":"Timed it (estimate is 15 min)"},{"id":"C2.3:flight:badly","label":"Flown deliberately badly once: the rubric separates Bronze from Gold"},{"id":"C2.3:flight:screens","label":"Screenshots taken where the brief or lesson needs one (or none needed)"}]}]},{"id":"C2.4","type":"challenge","title":"The box","file":"content/challenges/c2-4-the-box.yaml","priority":"P0","estimatedMinutes":20,"meta":[{"label":"Goal","value":"Combine climbs, descents and turns in a timed box pattern of four 2-minute legs."},{"label":"Type","value":"manoeuvre, difficulty 3/5"},{"label":"Lessons","value":"L2.2 Attitude flying and trim, L2.3 Climbs and descents, L2.4 Turns and coordination"}],"groups":[{"id":"sim","title":"Open markers and tracker notes","hint":"Settle each one in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"C2.4:tracker:1u31tfb","label":"Confirm the air start and the WX_LIGHT_W winds aloft"},{"id":"C2.4:tracker:1if79qg","label":"Check four 2-minute legs fit the valley"},{"id":"C2.4:tracker:1jbdknh","label":"Time it"}]},{"id":"setup","title":"Setup: can every field be set exactly as written?","hint":"Start the sim fresh and set up only from the brief. Note any menu name that differs.","checks":[{"id":"C2.4:setup:start","label":"Start: AIR_START at KLVK","detail":"<dl><dt>label<\/dt><dd>In the air<\/dd><dt>description<\/dt><dd>In flight at the stated position, altitude, heading and speed. If your sim cannot start in the air, start on the runway at KLVK and fly to the start point. The timer starts there.<\/dd><\/dl>"},{"id":"C2.4:setup:position","label":"Position: Over the Livermore valley, 3 nm east of KLVK"},{"id":"C2.4:setup:altitudeFt","label":"Altitude 3,000 ft MSL"},{"id":"C2.4:setup:headingDeg","label":"Heading 090"},{"id":"C2.4:setup:speedKias","label":"Speed 100 KIAS"},{"id":"C2.4:setup:fallback","label":"Fallback: Start on the runway at KLVK, take off and climb to 3,000 ft MSL. Start the timer when you are level on heading 090."},{"id":"C2.4:setup:weather","label":"Weather: WX_LIGHT_W","detail":"<dl><dt>label<\/dt><dd>Light westerly<\/dd><dt>summary<\/dt><dd>Clear skies with a light westerly wind.<\/dd><dt>clouds<\/dt><dd>Clear<\/dd><dt>surfaceWind<\/dt><dd>250° at 8 kt<\/dd><dt>windsAloft<\/dt><dd>270° at 15 kt (3,000 ft), 280° at 20 kt (6,000 ft)<\/dd><dt>visibility<\/dt><dd>10 sm or more<\/dd><dt>temperatureC<\/dt><dd>18<\/dd><dt>altimeterInHg<\/dt><dd>30<\/dd><\/dl>"},{"id":"C2.4:setup:time","label":"Time 10:00 local, date late-spring","detail":"<dl><dt>label<\/dt><dd>Late spring<\/dd><dt>date<\/dt><dd>15 May<\/dd><\/dl>"},{"id":"C2.4:setup:load","label":"Load: LOAD_SOLO","detail":"<dl><dt>label<\/dt><dd>Solo<\/dd><dt>description<\/dt><dd>Pilot 170 lb, no passengers, 75% fuel (about 40 gal). Set it in the EFB (TAB) under Flight planner, on the Payload &amp; fuel page. Fuel is in pounds (6 lb a gallon), so set Extra fuel to about 230 lb for a block fuel near 240 lb, then press LOAD. The default is only 10 lb.<\/dd><\/dl>"},{"id":"C2.4:setup:assistance","label":"Assistance: training","detail":"<dl><dt>label<\/dt><dd>Learn to Fly Training profile<\/dd><dt>description<\/dt><dd>Auto-Rudder, AI Auto-Trim and path aids off, whatever your controller (gamepads use the LT and RT triggers for rudder). Lesson 0.2 lists every setting.<\/dd><\/dl>"},{"id":"C2.4:setup:switches","label":"AI traffic off, ATC off, crash damage off"}]},{"id":"procedure","title":"Procedure: fly it exactly as written","hint":"Mark any step that is ambiguous, impossible or in the wrong order.","checks":[{"id":"C2.4:step:1qho6i6","label":"Step 1: Start the timer. Leg 1 (2 minutes). Heading 090, climb at 80 KIAS to 3,500 ft MSL, then level off."},{"id":"C2.4:step:96ovh4","label":"Step 2: Leg 2 (2 minutes). Standard-rate left turn to heading 360, hold 3,500 ft."},{"id":"C2.4:step:1np649k","label":"Step 3: Leg 3 (2 minutes). Standard-rate left turn to heading 270, descend at 90 KIAS to 3,000 ft, then level off."},{"id":"C2.4:step:1tkmccr","label":"Step 4: Leg 4 (2 minutes). Standard-rate left turn to heading 180, hold 3,000 ft. Then turn left to 090 to close the box."},{"id":"C2.4:step:14w8o5i","label":"Step 5: Trim after every change. Plan the next leg while the airplane is stable."}]},{"id":"criteria","title":"Criteria: measurable from inside the sim?","hint":"Each criterion must be checkable from the PFD, the clock, the replay or a map trail, and the tiers must make sense.","checks":[{"id":"C2.4:criterion:altitudes","label":"Target altitudes held (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 3<\/dd><dt>Gold<\/dt><dd>Within ±100 ft<\/dd><dt>Silver<\/dt><dd>Within ±150 ft<\/dd><dt>Bronze<\/dt><dd>Within ±200 ft<\/dd><\/dl>"},{"id":"C2.4:criterion:headings","label":"Headings held and rolled out on (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 2<\/dd><dt>Gold<\/dt><dd>Within ±10°<\/dd><dt>Silver<\/dt><dd>Within ±15°<\/dd><dt>Bronze<\/dt><dd>Within ±20°<\/dd><dt>Review link<\/dt><dd>L2.4 Turns and coordination → rolling-out-on-a-heading<\/dd><\/dl>"},{"id":"C2.4:criterion:speeds","label":"Climb and descent airspeeds (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 2<\/dd><dt>Gold<\/dt><dd>Within ±5 kt<\/dd><dt>Silver<\/dt><dd>Within ±10 kt<\/dd><dt>Bronze<\/dt><dd>Within ±15 kt<\/dd><dt>Review link<\/dt><dd>L2.3 Climbs and descents → entering-a-climb<\/dd><\/dl>"},{"id":"C2.4:criterion:timing","label":"Leg timing","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 1<\/dd><dt>Gold<\/dt><dd>Within ±10 s<\/dd><dt>Silver<\/dt><dd>Within ±20 s<\/dd><dt>Bronze<\/dt><dd>Within ±30 s<\/dd><\/dl>"},{"id":"C2.4:criterion:trimmed","label":"Trimmed after each change","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 1<\/dd><dt>Review link<\/dt><dd>L2.2 Attitude flying and trim → trim-technique<\/dd><\/dl>"}]},{"id":"extras","title":"Goal, tips and debrief","checks":[{"id":"C2.4:goal","label":"Goal is clear and matches the criteria","detail":"<p>Combine climbs, descents and turns in a timed box pattern of four 2-minute legs.<\/p>"},{"id":"C2.4:mistakes","label":"Common mistakes are the ones you actually see","detail":"<ul><li>Doing too many things at once. Finish one change, trim, then start the next.<\/li><li>Forgetting to trim, then fighting the airplane for the whole leg.<\/li><\/ul>"},{"id":"C2.4:tips","label":"Tips are correct and useful","detail":"<ul><li>Plan the next leg while you are stable.<\/li><li>Pausing at the end of a leg is fine for Bronze or Silver. For Gold, fly it without pausing (tick &quot;I paused&quot; in the debrief if you did).<\/li><\/ul>"},{"id":"C2.4:debrief","label":"Debrief questions fit the flight","detail":"<ul><li>Did you pause? Where, and why?<\/li><li>Which leg felt busiest?<\/li><\/ul>"}]},{"id":"flight","title":"Flight record (protocol 54.3)","hint":"Record the tier and the minutes it took in the fields above, then tick these.","checks":[{"id":"C2.4:flight:fresh","label":"Flown from the brief only, after a fresh sim start"},{"id":"C2.4:flight:timed","label":"Timed it (estimate is 20 min)"},{"id":"C2.4:flight:badly","label":"Flown deliberately badly once: the rubric separates Bronze from Gold"},{"id":"C2.4:flight:screens","label":"Screenshots taken where the brief or lesson needs one (or none needed)"}]}]}]},{"code":"M3","title":"Ground operations","summary":"Preflight, engine start, taxiing and the run-up.","items":[{"id":"L3.1","type":"lesson","title":"Preflight and engine start","file":"content/lessons/m3-ground-operations/l3-1-preflight-and-engine-start.md","priority":"P0","estimatedMinutes":20,"meta":[{"label":"Summary","value":"What a preflight inspection is for, and how to start the Skyhawk from cold and dark with the checklists."},{"label":"Prerequisites","value":"L1.4 Speeds, limits and checklists"},{"label":"Challenges","value":"C3.1 Cold and dark to running"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L3.1:marker:17y347m","label":"Sim check: covers and chocks checked in the sim on 2026-10-14. Still to check: whether the walkaround models fuel sampling, the oil dipstick or tie-downs.","line":46},{"id":"L3.1:marker:1i5693","label":"Sim check: the sequence above is the POH's (Section 4, Starting Engine: throttle ¼ inch, mixture idle cut-off, prime with the pump, START, mixture to rich; oil pressure in the green within 30 to 60 seconds). Still open: does the sim's EFB checklist match it, does priming with the pump do anything, and does the sim engine fire with the mixture at idle cut-off?","line":81},{"id":"L3.1:tracker:zg49ct","label":"Describe the walkaround mode (which items are modeled: pitot cover, chocks, tie-downs, fuel sampling)"},{"id":"L3.1:tracker:8a2bu2","label":"Confirm the POH start sequence works (mixture idle cut-off, prime with the aux pump, START, mixture rich) and whether priming does anything"},{"id":"L3.1:tracker:12t7g48","label":"Confirm oil pressure rises within 30-60 s"}]},{"id":"the-walkaround","title":"The walkaround","reading":"<p>Before every real flight, the pilot walks around the airplane. The <strong>preflight inspection<\/strong> catches problems while the airplane is safely on the ground:<\/p><ul><li><strong>Fuel.<\/strong> Check the quantity in each tank by looking in, and drain a small sample from each tank to check for water and the right fuel (100LL is blue).<\/li><li><strong>Oil.<\/strong> Check the level on the dipstick.<\/li><li><strong>Control surfaces.<\/strong> Free to move, hinges secure, nothing damaged.<\/li><li><strong>Tires and brakes.<\/strong> Inflated, no damage.<\/li><li><strong>Covers and tie-downs.<\/strong> Remove the pitot cover, the chocks and the tie-down ropes.<\/li><\/ul><p>In MSFS 2024 a cold-and-dark start puts you outside the airplane. Before you can climb in, remove the three remove-before-flight covers (pitot tube, static port and engine) and the wheel chocks. It's a short walkaround, so use it to build the habit.<\/p><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: covers and chocks checked in the sim on 2026-10-14. Still to check: whether the walkaround models fuel sampling, the oil dipstick or tie-downs.<\/p><\/div>","checks":[{"id":"L3.1:the-walkaround:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"setting-up-the-cockpit","title":"Setting up the cockpit","reading":"<p>Before you touch the engine controls:<\/p><ol><li><strong>Seat and belts.<\/strong> Adjusted and fastened.<\/li><li><strong>Parking brake.<\/strong> Set.<\/li><li><strong>A cockpit flow.<\/strong> Work across the panel in one direction, left to right, touching each control in order. A flow is faster than reading every item, and the checklist afterwards catches anything you missed.<\/li><\/ol><p>Run the before-starting-engine checklist below. In this summary, each item has the action to take.<\/p><div class=\"embed\"><span class=\"tag\">Checklist: Before starting engine<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Preflight<\/td><td><strong>COMPLETE<\/strong><\/td><td><\/td><\/tr><tr><td>Seat and belts<\/td><td><strong>ADJUSTED and FASTENED<\/strong><\/td><td><\/td><\/tr><tr><td>Parking brake<\/td><td><strong>SET<\/strong><\/td><td><\/td><\/tr><tr><td>Circuit breakers<\/td><td><strong>CHECK IN<\/strong><\/td><td>If modeled.<\/td><\/tr><tr><td>Electrical equipment and avionics master<\/td><td><strong>OFF<\/strong><\/td><td>Both avionics switches (BUS 1 and BUS 2).<\/td><\/tr><tr><td>Fuel selector<\/td><td><strong>BOTH<\/strong><\/td><td><\/td><\/tr><tr><td>Fuel shutoff valve<\/td><td><strong>ON (pushed in)<\/strong><\/td><td>If modeled.<\/td><\/tr><tr><td>Master switch (ALT and BAT)<\/td><td><strong>ON<\/strong><\/td><td>Check fuel quantity and annunciators.<\/td><\/tr><\/table><\/div>","checks":[{"id":"L3.1:setting-up-the-cockpit:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.1:setting-up-the-cockpit:checklist:before-starting-engine","label":"Checklist \"Before starting engine\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Preflight<\/td><td><strong>COMPLETE<\/strong><\/td><td><\/td><\/tr><tr><td>Seat and belts<\/td><td><strong>ADJUSTED and FASTENED<\/strong><\/td><td><\/td><\/tr><tr><td>Parking brake<\/td><td><strong>SET<\/strong><\/td><td><\/td><\/tr><tr><td>Circuit breakers<\/td><td><strong>CHECK IN<\/strong><\/td><td>If modeled.<\/td><\/tr><tr><td>Electrical equipment and avionics master<\/td><td><strong>OFF<\/strong><\/td><td>Both avionics switches (BUS 1 and BUS 2).<\/td><\/tr><tr><td>Fuel selector<\/td><td><strong>BOTH<\/strong><\/td><td><\/td><\/tr><tr><td>Fuel shutoff valve<\/td><td><strong>ON (pushed in)<\/strong><\/td><td>If modeled.<\/td><\/tr><tr><td>Master switch (ALT and BAT)<\/td><td><strong>ON<\/strong><\/td><td>Check fuel quantity and annunciators.<\/td><\/tr><\/table>"}]},{"id":"starting-the-engine","title":"Starting the engine","reading":"<p>The starting sequence for the fuel-injected Skyhawk:<\/p><ol><li><strong>Throttle<\/strong> open about a quarter inch.<\/li><li><strong>Mixture<\/strong> at idle cut-off (pulled fully out).<\/li><li><strong>Prime.<\/strong> Auxiliary fuel pump on and mixture pushed to rich for a few seconds, until the fuel flow shows, then mixture back to idle cut-off and pump off. Skip this if the engine is warm.<\/li><li><strong>Beacon light<\/strong> on, so people outside know the engine is about to start.<\/li><li><strong>Look outside and shout &quot;CLEAR!&quot;<\/strong><\/li><li><strong>Key to START.<\/strong> Release it to BOTH as soon as the engine fires, and push the mixture smoothly to rich.<\/li><li><strong>Throttle<\/strong> to about 1,000 RPM.<\/li><li><strong>Oil pressure.<\/strong> Check that it rises into the green within 30 to 60 seconds. If it doesn't, shut the engine down.<\/li><\/ol><div class=\"callout safety\"><span class=\"tag\">Safety<\/span><p>Always shout &quot;CLEAR!&quot; before starting, even in the sim. A spinning propeller is almost invisible, and habits you build here transfer to the real airplane.<\/p><\/div><div class=\"embed\"><span class=\"tag\">Checklist: Starting engine<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Throttle<\/td><td><strong>OPEN about ¼ inch<\/strong><\/td><td>Or as the in-sim checklist says.<\/td><\/tr><tr><td>Mixture<\/td><td><strong>IDLE CUT-OFF (pulled fully out)<\/strong><\/td><td>The POH sequence for the fuel-injected 172S: prime (next item), start with the mixture at idle cut-off, then push it to rich as the engine fires. Verify the sim accepts this sequence.<\/td><\/tr><tr><td>Auxiliary fuel pump<\/td><td><strong>ON briefly to prime, then OFF<\/strong><\/td><td>POH: pump on, mixture full rich for about 3–5 seconds until fuel flow shows, mixture back to idle cut-off, pump off. Skip the prime if the engine is warm. Verify the sim models priming.<\/td><\/tr><tr><td>Beacon light<\/td><td><strong>ON<\/strong><\/td><td><\/td><\/tr><tr><td>Propeller area<\/td><td><strong>CLEAR<\/strong><\/td><td>Say &quot;Clear!&quot;<\/td><\/tr><tr><td>Ignition switch<\/td><td><strong>START<\/strong><\/td><td>Release to BOTH when the engine starts.<\/td><\/tr><tr><td>Mixture<\/td><td><strong>RICH<\/strong><\/td><td>Smoothly, as the engine starts, if started from cut-off.<\/td><\/tr><tr><td>Oil pressure<\/td><td><strong>CHECK rising into the green within 30 to 60 seconds<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>About 1,000 RPM<\/strong><\/td><td><\/td><\/tr><\/table><\/div><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: the sequence above is the POH's (Section 4, Starting Engine: throttle ¼ inch, mixture idle cut-off, prime with the pump, START, mixture to rich; oil pressure in the green within 30 to 60 seconds). Still open: does the sim's EFB checklist match it, does priming with the pump do anything, and does the sim engine fire with the mixture at idle cut-off?<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>What must rise into the green within 30 to 60 seconds after the engine starts?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Fuel flow<\/p><\/li><li class=\"correct\">☑ <p>Oil pressure<\/p><\/li><li class=\"\">☐ <p>Oil temperature<\/p><\/li><li class=\"\">☐ <p>Engine RPM<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Oil pressure.<\/strong> Without it, nothing lubricates the engine. If it doesn't rise within 60 seconds, shut down. Oil temperature takes much longer to rise.<\/p><\/div><\/div><div class=\"quiz\"><div class=\"prompt\"><p>Why do pilots shout &quot;CLEAR!&quot; before starting the engine?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>It's required by the radio rules<\/p><\/li><li class=\"correct\">☑ <p>To warn anyone near the propeller<\/p><\/li><li class=\"\">☐ <p>To tell the tower you're starting<\/p><\/li><li class=\"\">☐ <p>It helps the starter motor<\/p><\/li><\/ul><div class=\"explain\"><p>To warn anyone near the propeller, and to make yourself look outside before you turn the key.<\/p><\/div><\/div>","checks":[{"id":"L3.1:starting-the-engine:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.1:starting-the-engine:callout:1j1trow","label":"Safety: correct and complete?","detail":"<p>Always shout &quot;CLEAR!&quot; before starting, even in the sim. A spinning propeller is almost invisible, and habits you build here transfer to the real airplane.<\/p>"},{"id":"L3.1:starting-the-engine:checklist:starting-engine","label":"Checklist \"Starting engine\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Throttle<\/td><td><strong>OPEN about ¼ inch<\/strong><\/td><td>Or as the in-sim checklist says.<\/td><\/tr><tr><td>Mixture<\/td><td><strong>IDLE CUT-OFF (pulled fully out)<\/strong><\/td><td>The POH sequence for the fuel-injected 172S: prime (next item), start with the mixture at idle cut-off, then push it to rich as the engine fires. Verify the sim accepts this sequence.<\/td><\/tr><tr><td>Auxiliary fuel pump<\/td><td><strong>ON briefly to prime, then OFF<\/strong><\/td><td>POH: pump on, mixture full rich for about 3–5 seconds until fuel flow shows, mixture back to idle cut-off, pump off. Skip the prime if the engine is warm. Verify the sim models priming.<\/td><\/tr><tr><td>Beacon light<\/td><td><strong>ON<\/strong><\/td><td><\/td><\/tr><tr><td>Propeller area<\/td><td><strong>CLEAR<\/strong><\/td><td>Say &quot;Clear!&quot;<\/td><\/tr><tr><td>Ignition switch<\/td><td><strong>START<\/strong><\/td><td>Release to BOTH when the engine starts.<\/td><\/tr><tr><td>Mixture<\/td><td><strong>RICH<\/strong><\/td><td>Smoothly, as the engine starts, if started from cut-off.<\/td><\/tr><tr><td>Oil pressure<\/td><td><strong>CHECK rising into the green within 30 to 60 seconds<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>About 1,000 RPM<\/strong><\/td><td><\/td><\/tr><\/table>"},{"id":"L3.1:starting-the-engine:quiz:l3-1-q1","label":"Quiz l3-1-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>What must rise into the green within 30 to 60 seconds after the engine starts?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Fuel flow<\/p><\/li><li class=\"correct\">☑ <p>Oil pressure<\/p><\/li><li class=\"\">☐ <p>Oil temperature<\/p><\/li><li class=\"\">☐ <p>Engine RPM<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Oil pressure.<\/strong> Without it, nothing lubricates the engine. If it doesn't rise within 60 seconds, shut down. Oil temperature takes much longer to rise.<\/p><\/div><\/div>"},{"id":"L3.1:starting-the-engine:quiz:l3-1-q2","label":"Quiz l3-1-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Why do pilots shout &quot;CLEAR!&quot; before starting the engine?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>It's required by the radio rules<\/p><\/li><li class=\"correct\">☑ <p>To warn anyone near the propeller<\/p><\/li><li class=\"\">☐ <p>To tell the tower you're starting<\/p><\/li><li class=\"\">☐ <p>It helps the starter motor<\/p><\/li><\/ul><div class=\"explain\"><p>To warn anyone near the propeller, and to make yourself look outside before you turn the key.<\/p><\/div><\/div>"}]},{"id":"after-the-start","title":"After the start","reading":"<p>Once the engine is running smoothly:<\/p><ul><li><strong>Avionics master on.<\/strong> The G1000 screens turn on.<\/li><li><strong>Flaps<\/strong> up, and check they move.<\/li><li><strong>Lights<\/strong> as needed: navigation lights, taxi light.<\/li><li><strong>Altimeter<\/strong> set, and listen to the airport weather (ATIS or AWOS).<\/li><li><strong>Alternator.<\/strong> Check it's charging: the ammeter or voltage on the EIS shows a positive charge.<\/li><\/ul>","checks":[{"id":"L3.1:after-the-start:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"when-it-wont-start","title":"When it won't start","reading":"<p>In the sim, a failed start almost always comes from one of these:<\/p><ul><li><strong>Fuel selector<\/strong> not on BOTH, or the fuel shutoff valve pulled out.<\/li><li><strong>Mixture<\/strong> left at idle cut-off.<\/li><li><strong>Parking brake<\/strong> off, so the airplane starts rolling as soon as the engine runs.<\/li><\/ul><div class=\"quiz\"><div class=\"prompt\"><p>The engine won't start in the sim. What do you check first?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>The avionics master<\/p><\/li><li class=\"\">☐ <p>The COM frequency<\/p><\/li><li class=\"correct\">☑ <p>The mixture and the fuel selector<\/p><\/li><li class=\"\">☐ <p>The altimeter setting<\/p><\/li><\/ul><div class=\"explain\"><p>Check the mixture (not in idle cut-off once the engine should be running) and the fuel selector (on BOTH). Without fuel, there's nothing to burn.<\/p><\/div><\/div><p>Now try it in <span class=\"ilink\" title=\"/challenges/c3-1-cold-and-dark-to-running\">C3.1 Cold and dark to running<\/span>.<\/p>","checks":[{"id":"L3.1:when-it-wont-start:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.1:when-it-wont-start:quiz:l3-1-q3","label":"Quiz l3-1-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>The engine won't start in the sim. What do you check first?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>The avionics master<\/p><\/li><li class=\"\">☐ <p>The COM frequency<\/p><\/li><li class=\"correct\">☑ <p>The mixture and the fuel selector<\/p><\/li><li class=\"\">☐ <p>The altimeter setting<\/p><\/li><\/ul><div class=\"explain\"><p>Check the mixture (not in idle cut-off once the engine should be running) and the fuel selector (on BOTH). Without fuel, there's nothing to burn.<\/p><\/div><\/div>"}]},{"id":"overall","title":"Overall","checks":[{"id":"L3.1:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Describe the purpose of a preflight inspection and what the sim can and cannot simulate.<\/li><li>Complete the before-starting-engine and starting-engine checklists from cold and dark.<\/li><li>Recognize normal indications after start.<\/li><\/ul>"},{"id":"L3.1:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 2 — Ground Operations<\/a><\/li><li>MSFS 2024 in-sim checklist for the Cessna 172 (In the sim: the checklist section of the EFB (electronic flight bag). The location can change between sim updates.)<\/li><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak\" target=\"_blank\" rel=\"noopener\">PHAK Chapter 7 — Aircraft Systems<\/a><\/li><\/ul>"},{"id":"L3.1:overall:minutes","label":"Estimated time (20 min) is realistic"}]}]},{"id":"L3.2","type":"lesson","title":"Taxiing, signs and markings","file":"content/lessons/m3-ground-operations/l3-2-taxiing-signs-and-markings.md","priority":"P0","estimatedMinutes":20,"meta":[{"label":"Summary","value":"Taxi safely, hold the controls correctly for the wind, and read the signs and markings that keep you off the wrong runway."},{"label":"Prerequisites","value":"L3.1 Preflight and engine start"},{"label":"Challenges","value":"C3.2 Taxi to the runway at KLVK"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L3.2:marker:c4tyyi","label":"Sim check: desk-verified 2026-10-13 against the FAA airport diagram for LVK (AL-6075, 01 Oct 2026 cycle): FBO and terminal on the Northwest Apron, taxiway A along the north side of 7L/25R. Still open: that the sim's KLVK matches (parking spot name, taxiway A signs, a run-up pad at the 25R end); then write the exact taxiway sequence from that spot into this section and C3.2.","line":131},{"id":"L3.2:tracker:yl0kr","label":"Taxi from the FBO parking spot to the 25R run-up area via taxiway A and confirm the signs and markings match the FAA diagram (Oct 2026)"},{"id":"L3.2:tracker:ibibio","label":"Then write the exact taxiway sequence into the lesson and C3.2. Confirm the taxi ribbon option name and the groundspeed readout"}]},{"id":"steering-and-braking","title":"Steering and braking","reading":"<ul><li><strong>Steer with the rudder pedals.<\/strong> They turn the nose wheel. Push left to go left.<\/li><li><strong>Brake gently<\/strong> with the toe brakes, and only when you need to. Never ride the brakes. Use a little power and let the airplane roll.<\/li><li><strong>Tight turns.<\/strong> A little brake on the inside wheel helps in a tight corner.<\/li><\/ul><p>To start moving, release the parking brake, add a little power until the airplane rolls, then reduce power. Test the brakes as soon as you're moving.<\/p>","checks":[{"id":"L3.2:steering-and-braking:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"how-fast","title":"How fast?","reading":"<p>Taxi at about a brisk walking pace. In the sim, check your groundspeed on the PFD or the MFD. It should be about 10 knots or less on straight taxiways, and 5 knots or less in turns.<\/p><p>If you're going too fast, reduce power first, then brake. Taxiing too fast is how airplanes end up in the grass.<\/p>","checks":[{"id":"L3.2:how-fast:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"holding-the-controls-for-the-wind","title":"Holding the controls for the wind","reading":"<p>A strong wind can lift a high-wing airplane like the Skyhawk on the ground. Hold the controls so the wind pushes the airplane down, not up.<\/p><table><tr><th>Wind from<\/th><th>Yoke<\/th><\/tr><tr><td>Ahead, left<\/td><td>Turned left, elevator neutral<\/td><\/tr><tr><td>Ahead, right<\/td><td>Turned right, elevator neutral<\/td><\/tr><tr><td>Behind, left<\/td><td>Turned right, pushed forward<\/td><\/tr><tr><td>Behind, right<\/td><td>Turned left, pushed forward<\/td><\/tr><\/table><p>A memory aid: <strong>climb into a headwind, dive away from a tailwind.<\/strong> With a headwind, turn the yoke toward the wind (as if climbing into it). With a tailwind, turn away from the wind and push forward.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>You're taxiing with a quartering headwind from the left. Where should the yoke be?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Turned left (aileron into the wind), elevator neutral<\/p><\/li><li class=\"\">☐ <p>Turned right, pushed forward<\/p><\/li><li class=\"\">☐ <p>Turned right, elevator neutral<\/p><\/li><li class=\"\">☐ <p>Centered and pulled back<\/p><\/li><\/ul><div class=\"explain\"><p>With a headwind from the left, turn the yoke left, into the wind, with the elevator neutral. The left aileron goes up and the wind can't lift that wing.<\/p><\/div><\/div>","checks":[{"id":"L3.2:holding-the-controls-for-the-wind:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.2:holding-the-controls-for-the-wind:quiz:l3-2-q1","label":"Quiz l3-2-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>You're taxiing with a quartering headwind from the left. Where should the yoke be?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Turned left (aileron into the wind), elevator neutral<\/p><\/li><li class=\"\">☐ <p>Turned right, pushed forward<\/p><\/li><li class=\"\">☐ <p>Turned right, elevator neutral<\/p><\/li><li class=\"\">☐ <p>Centered and pulled back<\/p><\/li><\/ul><div class=\"explain\"><p>With a headwind from the left, turn the yoke left, into the wind, with the elevator neutral. The left aileron goes up and the wind can't lift that wing.<\/p><\/div><\/div>"}]},{"id":"airport-signs","title":"Airport signs","reading":"<p>Signs use colors to tell you what kind of information they give:<\/p><table><tr><th>Sign<\/th><th>Colors<\/th><th>Meaning<\/th><\/tr><tr><td>Location<\/td><td>Yellow text on black<\/td><td>The taxiway or runway you are on.<\/td><\/tr><tr><td>Direction<\/td><td>Black text on yellow, arrow<\/td><td>The taxiway in that direction.<\/td><\/tr><tr><td>Mandatory (runway hold)<\/td><td>White text on red<\/td><td>A runway ahead. At a towered airport, do not cross without clearance.<\/td><\/tr><tr><td>Runway distance remaining<\/td><td>White number on black<\/td><td>Thousands of feet of runway left.<\/td><\/tr><\/table><div class=\"quiz\"><div class=\"prompt\"><p>What colors is a runway holding position sign?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Black text on yellow<\/p><\/li><li class=\"\">☐ <p>Yellow text on black<\/p><\/li><li class=\"correct\">☑ <p>White text on red<\/p><\/li><li class=\"\">☐ <p>White text on green<\/p><\/li><\/ul><div class=\"explain\"><p>Mandatory signs, including runway holding position signs, are white text on red. They mark places you must not enter without permission.<\/p><\/div><\/div>","checks":[{"id":"L3.2:airport-signs:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.2:airport-signs:quiz:l3-2-q2","label":"Quiz l3-2-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>What colors is a runway holding position sign?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Black text on yellow<\/p><\/li><li class=\"\">☐ <p>Yellow text on black<\/p><\/li><li class=\"correct\">☑ <p>White text on red<\/p><\/li><li class=\"\">☐ <p>White text on green<\/p><\/li><\/ul><div class=\"explain\"><p>Mandatory signs, including runway holding position signs, are white text on red. They mark places you must not enter without permission.<\/p><\/div><\/div>"}]},{"id":"markings","title":"Markings","reading":"<ul><li><strong>Taxiway centerline.<\/strong> A solid yellow line. Keep the nose wheel on it.<\/li><li><strong>Runway holding position marking.<\/strong> Four yellow lines across the taxiway: two solid and two dashed. Stop on the solid side when you're approaching the runway. When leaving the runway, the whole airplane must cross to the solid side before you're clear.<\/li><li><strong>ILS critical area.<\/strong> A yellow ladder-like marking. At a towered airport, don't enter it without clearance when instrument approaches are in use.<\/li><\/ul><div class=\"quiz\"><div class=\"prompt\"><p>Taxiing toward a runway, which side of the hold short line do you stop on?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>The side with the solid lines<\/p><\/li><li class=\"\">☐ <p>The side with the dashed lines<\/p><\/li><li class=\"\">☐ <p>On top of the lines<\/p><\/li><li class=\"\">☐ <p>Either side is fine<\/p><\/li><\/ul><div class=\"explain\"><p>Stop on the side with the solid lines. The dashed lines face the runway. They let you cross when <em>leaving<\/em> the runway.<\/p><\/div><\/div>","checks":[{"id":"L3.2:markings:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.2:markings:quiz:l3-2-q3","label":"Quiz l3-2-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Taxiing toward a runway, which side of the hold short line do you stop on?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>The side with the solid lines<\/p><\/li><li class=\"\">☐ <p>The side with the dashed lines<\/p><\/li><li class=\"\">☐ <p>On top of the lines<\/p><\/li><li class=\"\">☐ <p>Either side is fine<\/p><\/li><\/ul><div class=\"explain\"><p>Stop on the side with the solid lines. The dashed lines face the runway. They let you cross when <em>leaving<\/em> the runway.<\/p><\/div><\/div>"}]},{"id":"the-livermore-airport-diagram","title":"The Livermore airport diagram","reading":"<p>Every airport has an <strong>airport diagram<\/strong>: a map of its runways, taxiways, ramps and run-up areas. The FAA publishes them free in the Terminal Procedures Publication.<\/p><p>Before you taxi at Livermore (KLVK), open the diagram and find:<\/p><ul><li>The main ramp where you park.<\/li><li>The taxiway that leads from the ramp to the end of runway 25R.<\/li><li>The run-up area near that end.<\/li><\/ul><p>On the current diagram, the FBO and terminal are on the northwest apron, and taxiway A runs along the north side of runway 7L/25R all the way to the run-up area at the 25R end. From there you never have to cross a runway.<\/p><p>Trace your route with your finger before you release the brake.<\/p><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: desk-verified 2026-10-13 against the FAA airport diagram for LVK (AL-6075, 01 Oct 2026 cycle): FBO and terminal on the Northwest Apron, taxiway A along the north side of 7L/25R. Still open: that the sim's KLVK matches (parking spot name, taxiway A signs, a run-up pad at the 25R end); then write the exact taxiway sequence from that spot into this section and C3.2.<\/p><\/div>","checks":[{"id":"L3.2:the-livermore-airport-diagram:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"runway-incursions","title":"Runway incursions","reading":"<p>A <strong>runway incursion<\/strong> is any airplane, vehicle or person on a runway where they shouldn't be. It's the biggest risk on the ground, and it usually starts with a pilot who's lost or rushing.<\/p><ul><li>Never cross a hold short line at a towered airport without a clearance.<\/li><li>At a non-towered airport, stop, look both ways and announce before crossing.<\/li><li>If you're unsure where you are, stop. Stopping on a taxiway is always OK.<\/li><\/ul><div class=\"callout sim\"><span class=\"tag\">Sim vs reality<\/span><p>MSFS 2024 can draw a taxi ribbon on the ground to show your route. It's useful the first time, but turn it off after this lesson. Reading signs and a diagram is the skill you need.<\/p><\/div><p>Now taxi to the runway in <span class=\"ilink\" title=\"/challenges/c3-2-taxi-to-the-runway-at-klvk\">C3.2 Taxi to the runway at KLVK<\/span>.<\/p>","checks":[{"id":"L3.2:runway-incursions:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.2:runway-incursions:callout:i5ax39","label":"Sim vs reality: still true in the current sim?","detail":"<p>MSFS 2024 can draw a taxi ribbon on the ground to show your route. It's useful the first time, but turn it off after this lesson. Reading signs and a diagram is the skill you need.<\/p>"}]},{"id":"overall","title":"Overall","checks":[{"id":"L3.2:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Taxi at a safe speed with the controls positioned for the wind.<\/li><li>Read airport signs and markings, including hold short lines.<\/li><li>Use an airport diagram to plan a taxi route.<\/li><\/ul>"},{"id":"L3.2:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/air_traffic/publications/atpubs/aim_html/chap2_section_3.html\" target=\"_blank\" rel=\"noopener\">AIM 2-3 — Airport Marking Aids and Signs<\/a><\/li><li><a href=\"https://www.faa.gov/air_traffic/flight_info/aeronav/digital_products/dtpp/\" target=\"_blank\" rel=\"noopener\">Digital Terminal Procedures (airport diagrams)<\/a><\/li><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 2 — Ground Operations<\/a><\/li><\/ul>"},{"id":"L3.2:overall:minutes","label":"Estimated time (20 min) is realistic"}]}]},{"id":"L3.3","type":"lesson","title":"Run-up, before takeoff, and after landing","file":"content/lessons/m3-ground-operations/l3-3-run-up-before-takeoff-and-after-landing.md","priority":"P0","estimatedMinutes":15,"meta":[{"label":"Summary","value":"Check the engine and controls before takeoff, brief the takeoff out loud, and clean up after landing."},{"label":"Prerequisites","value":"L3.2 Taxiing, signs and markings"},{"label":"Challenges","value":"C3.3 Run-up, C3.4 After landing and shutdown"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L3.3:tracker:9ywhg3","label":"Run-up at 1,800 RPM shows a magneto drop within POH limits (150/50)"},{"id":"L3.3:tracker:2v4bqe","label":"Confirm the XPDR softkey mode names after landing (real NXi: GND, STBY, ON, ALT)"}]},{"id":"where-to-do-the-run-up","title":"Where to do the run-up","reading":"<p>Stop in the <strong>run-up area<\/strong> near the end of the runway:<\/p><ul><li><strong>Into the wind<\/strong> if you can, which helps engine cooling.<\/li><li><strong>Clear of other airplanes<\/strong>, so your propeller blast doesn't hit them.<\/li><li><strong>Parking brake set<\/strong>, because you'll run the engine at high power.<\/li><\/ul>","checks":[{"id":"L3.3:where-to-do-the-run-up:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"the-engine-run-up","title":"The engine run-up","reading":"<p>With the parking brake set and your feet on the brakes:<\/p><ol><li><strong>Throttle to about 1,800 RPM.<\/strong><\/li><li><strong>Magneto check.<\/strong> Turn the key from BOTH to L and watch the RPM drop slightly. Turn it back to BOTH. Then turn it to R, and back to BOTH. A drop of up to 150 RPM on each magneto is normal, with no more than 50 RPM difference between the two. A bigger drop, no drop at all, or a big difference between them means a problem.<\/li><li><strong>Engine instruments.<\/strong> Oil pressure and temperature, and the electrical system, all in the green.<\/li><li><strong>Throttle to idle.<\/strong> Check the engine keeps running smoothly, then set about 1,000 RPM.<\/li><\/ol><div class=\"callout safety\"><span class=\"tag\">Safety<\/span><p>Always finish the magneto check with the key back on BOTH. Taking off on one magneto costs power and removes your backup.<\/p><\/div>","checks":[{"id":"L3.3:the-engine-run-up:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.3:the-engine-run-up:callout:ubfusd","label":"Safety: correct and complete?","detail":"<p>Always finish the magneto check with the key back on BOTH. Taking off on one magneto costs power and removes your backup.<\/p>"}]},{"id":"controls-free-and-correct","title":"Controls free and correct","reading":"<p>Move the yoke fully left, right, forward and back, and the rudder pedals both ways. Look out at each surface (or switch to an outside view in the sim) and check it moves freely and in the correct direction. When you turn the yoke left, the left aileron goes up.<\/p>","checks":[{"id":"L3.3:controls-free-and-correct:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"before-takeoff-items","title":"Before-takeoff items","reading":"<ul><li><strong>Flaps<\/strong> set for takeoff (0–10°).<\/li><li><strong>Trim<\/strong> set to the takeoff position.<\/li><li><strong>Fuel selector<\/strong> on BOTH.<\/li><li><strong>Mixture<\/strong> rich (at Bay Area airports).<\/li><li><strong>Transponder<\/strong> on ALT.<\/li><li><strong>Lights<\/strong> on: strobes and landing light.<\/li><li><strong>Doors<\/strong> closed and latched.<\/li><\/ul><p>Run the before-takeoff checklist below.<\/p><div class=\"embed\"><span class=\"tag\">Checklist: Before takeoff (run-up)<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Parking brake<\/td><td><strong>SET<\/strong><\/td><td>Position into wind, clear of other aircraft.<\/td><\/tr><tr><td>Cabin doors<\/td><td><strong>CLOSED and LATCHED<\/strong><\/td><td><\/td><\/tr><tr><td>Flight controls<\/td><td><strong>FREE and CORRECT<\/strong><\/td><td><\/td><\/tr><tr><td>Flight instruments<\/td><td><strong>CHECK<\/strong><\/td><td>PFD, standby instruments, no red flags.<\/td><\/tr><tr><td>Fuel selector<\/td><td><strong>BOTH<\/strong><\/td><td><\/td><\/tr><tr><td>Mixture<\/td><td><strong>RICH<\/strong><\/td><td>Lean for smoothness only at high-elevation airports.<\/td><\/tr><tr><td>Elevator trim<\/td><td><strong>SET for takeoff<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>1,800 RPM<\/strong><\/td><td><\/td><\/tr><tr><td>Magnetos<\/td><td><strong>CHECK L, BOTH, R, BOTH<\/strong><\/td><td>POH limits: no more than a 150 RPM drop on either magneto, and no more than 50 RPM difference between them.<\/td><\/tr><tr><td>Engine instruments and ammeter or voltage<\/td><td><strong>CHECK in the green<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>IDLE<\/strong><\/td><td>Check the engine idles smoothly, then about 1,000 RPM.<\/td><\/tr><tr><td>Flaps<\/td><td><strong>SET 0°–10°<\/strong><\/td><td><\/td><\/tr><tr><td>Strobe and landing lights<\/td><td><strong>ON<\/strong><\/td><td><\/td><\/tr><tr><td>Transponder<\/td><td><strong>ALT<\/strong><\/td><td>Or as required for the sim's ATC.<\/td><\/tr><tr><td>Takeoff briefing<\/td><td><strong>COMPLETE<\/strong><\/td><td><\/td><\/tr><\/table><\/div>","checks":[{"id":"L3.3:before-takeoff-items:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.3:before-takeoff-items:checklist:before-takeoff","label":"Checklist \"Before takeoff (run-up)\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Parking brake<\/td><td><strong>SET<\/strong><\/td><td>Position into wind, clear of other aircraft.<\/td><\/tr><tr><td>Cabin doors<\/td><td><strong>CLOSED and LATCHED<\/strong><\/td><td><\/td><\/tr><tr><td>Flight controls<\/td><td><strong>FREE and CORRECT<\/strong><\/td><td><\/td><\/tr><tr><td>Flight instruments<\/td><td><strong>CHECK<\/strong><\/td><td>PFD, standby instruments, no red flags.<\/td><\/tr><tr><td>Fuel selector<\/td><td><strong>BOTH<\/strong><\/td><td><\/td><\/tr><tr><td>Mixture<\/td><td><strong>RICH<\/strong><\/td><td>Lean for smoothness only at high-elevation airports.<\/td><\/tr><tr><td>Elevator trim<\/td><td><strong>SET for takeoff<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>1,800 RPM<\/strong><\/td><td><\/td><\/tr><tr><td>Magnetos<\/td><td><strong>CHECK L, BOTH, R, BOTH<\/strong><\/td><td>POH limits: no more than a 150 RPM drop on either magneto, and no more than 50 RPM difference between them.<\/td><\/tr><tr><td>Engine instruments and ammeter or voltage<\/td><td><strong>CHECK in the green<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>IDLE<\/strong><\/td><td>Check the engine idles smoothly, then about 1,000 RPM.<\/td><\/tr><tr><td>Flaps<\/td><td><strong>SET 0°–10°<\/strong><\/td><td><\/td><\/tr><tr><td>Strobe and landing lights<\/td><td><strong>ON<\/strong><\/td><td><\/td><\/tr><tr><td>Transponder<\/td><td><strong>ALT<\/strong><\/td><td>Or as required for the sim's ATC.<\/td><\/tr><tr><td>Takeoff briefing<\/td><td><strong>COMPLETE<\/strong><\/td><td><\/td><\/tr><\/table>"}]},{"id":"the-takeoff-briefing","title":"The takeoff briefing","reading":"<p>Say it out loud, every time. If you decide what you'll do before something goes wrong, you already have a plan when it happens. For example:<\/p><blockquote><p>&quot;This will be a normal takeoff from runway 25R. Rotate at 55, climb at 74. If the engine fails on the runway, I'll close the throttle and brake. If it fails after takeoff with runway left, I'll land straight ahead. If it fails with no runway left, I'll lower the nose to glide at 68 and land in the best spot within 30° of straight ahead. No turning back below 1,000 ft.&quot;<\/p><\/blockquote><div class=\"quiz\"><div class=\"prompt\"><p>Your engine fails at 300 ft after takeoff, with no runway left. What does your takeoff briefing say to do?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Turn back to the runway<\/p><\/li><li class=\"correct\">☑ <p>Lower the nose to best glide and land more or less straight ahead<\/p><\/li><li class=\"\">☐ <p>Keep the nose up and try to restart the engine<\/p><\/li><li class=\"\">☐ <p>Climb to 1,000 ft first<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Lower the nose to best glide (68 KIAS) and land more or less straight ahead.<\/strong> Turning back at low altitude is one of the most common ways pilots lose control. You'll practice this in Module 5.<\/p><\/div><\/div>","checks":[{"id":"L3.3:the-takeoff-briefing:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.3:the-takeoff-briefing:quiz:l3-3-q1","label":"Quiz l3-3-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Your engine fails at 300 ft after takeoff, with no runway left. What does your takeoff briefing say to do?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Turn back to the runway<\/p><\/li><li class=\"correct\">☑ <p>Lower the nose to best glide and land more or less straight ahead<\/p><\/li><li class=\"\">☐ <p>Keep the nose up and try to restart the engine<\/p><\/li><li class=\"\">☐ <p>Climb to 1,000 ft first<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Lower the nose to best glide (68 KIAS) and land more or less straight ahead.<\/strong> Turning back at low altitude is one of the most common ways pilots lose control. You'll practice this in Module 5.<\/p><\/div><\/div>"}]},{"id":"after-landing","title":"After landing","reading":"<p>Once you've landed and slowed to taxi speed:<\/p><ol><li><strong>Clear the runway.<\/strong> Turn off at a taxiway and keep going until the whole airplane is past the hold short line. Then stop.<\/li><li><strong>Flaps up.<\/strong><\/li><li><strong>Transponder.<\/strong> Leave it in ALT. ATC's ground surveillance should see you all the way to the ramp. Switch to standby only once you're parked.<\/li><li><strong>Lights<\/strong> as needed: strobes and landing light off, taxi light on.<\/li><\/ol><div class=\"embed\"><span class=\"tag\">Checklist: After landing<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Runway<\/td><td><strong>CLEAR completely<\/strong><\/td><td>Past the hold short line.<\/td><\/tr><tr><td>Flaps<\/td><td><strong>UP<\/strong><\/td><td><\/td><\/tr><tr><td>Transponder<\/td><td><strong>LEAVE IN ALT until parked, then STANDBY<\/strong><\/td><td>AIM 4-1-20 keeps the transponder in ALT on the whole movement area. The G1000 NXi has no ground mode. Sim check: confirm the sim's XPDR softkeys.<\/td><\/tr><tr><td>Landing and strobe lights<\/td><td><strong>OFF<\/strong><\/td><td>Taxi light on as required.<\/td><\/tr><\/table><\/div><div class=\"quiz\"><div class=\"prompt\"><p>After landing, when is it safe to stop on the taxiway?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>As soon as the nose wheel reaches the taxiway<\/p><\/li><li class=\"\">☐ <p>As soon as you're off the runway pavement<\/p><\/li><li class=\"correct\">☑ <p>Once the whole airplane is past the hold short line<\/p><\/li><li class=\"\">☐ <p>Only when you reach the ramp<\/p><\/li><\/ul><div class=\"explain\"><p>Stop only once the whole airplane is past the hold short line (on the solid side). Until then, you're still in the runway's protected area.<\/p><\/div><\/div>","checks":[{"id":"L3.3:after-landing:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.3:after-landing:checklist:after-landing","label":"Checklist \"After landing\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Runway<\/td><td><strong>CLEAR completely<\/strong><\/td><td>Past the hold short line.<\/td><\/tr><tr><td>Flaps<\/td><td><strong>UP<\/strong><\/td><td><\/td><\/tr><tr><td>Transponder<\/td><td><strong>LEAVE IN ALT until parked, then STANDBY<\/strong><\/td><td>AIM 4-1-20 keeps the transponder in ALT on the whole movement area. The G1000 NXi has no ground mode. Sim check: confirm the sim's XPDR softkeys.<\/td><\/tr><tr><td>Landing and strobe lights<\/td><td><strong>OFF<\/strong><\/td><td>Taxi light on as required.<\/td><\/tr><\/table>"},{"id":"L3.3:after-landing:quiz:l3-3-q2","label":"Quiz l3-3-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>After landing, when is it safe to stop on the taxiway?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>As soon as the nose wheel reaches the taxiway<\/p><\/li><li class=\"\">☐ <p>As soon as you're off the runway pavement<\/p><\/li><li class=\"correct\">☑ <p>Once the whole airplane is past the hold short line<\/p><\/li><li class=\"\">☐ <p>Only when you reach the ramp<\/p><\/li><\/ul><div class=\"explain\"><p>Stop only once the whole airplane is past the hold short line (on the solid side). Until then, you're still in the runway's protected area.<\/p><\/div><\/div>"}]},{"id":"shutdown","title":"Shutdown","reading":"<p>At parking:<\/p><ol><li><strong>Parking brake<\/strong> set.<\/li><li><strong>Avionics master<\/strong> off.<\/li><li><strong>Mixture<\/strong> to idle cut-off. The engine stops.<\/li><li><strong>Magnetos<\/strong> off, key out.<\/li><li><strong>Master switch<\/strong> off.<\/li><\/ol><div class=\"embed\"><span class=\"tag\">Checklist: Securing the airplane (shutdown)<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Parking brake<\/td><td><strong>SET<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>IDLE (about 1,000 RPM)<\/strong><\/td><td><\/td><\/tr><tr><td>Electrical equipment and avionics master<\/td><td><strong>OFF<\/strong><\/td><td><\/td><\/tr><tr><td>Mixture<\/td><td><strong>IDLE CUT-OFF (pulled fully out)<\/strong><\/td><td><\/td><\/tr><tr><td>Ignition switch<\/td><td><strong>OFF<\/strong><\/td><td>After the engine stops.<\/td><\/tr><tr><td>Master switch<\/td><td><strong>OFF<\/strong><\/td><td><\/td><\/tr><tr><td>Fuel selector<\/td><td><strong>LEFT or RIGHT<\/strong><\/td><td>To prevent fuel cross-feeding between the tanks while parked (POH).<\/td><\/tr><tr><td>Control lock and tie-downs<\/td><td><strong>INSTALL<\/strong><\/td><td>If modeled.<\/td><\/tr><\/table><\/div><p>Practice both ends of a flight in <span class=\"ilink\" title=\"/challenges/c3-3-run-up\">C3.3 Run-up<\/span> and <span class=\"ilink\" title=\"/challenges/c3-4-after-landing-and-shutdown\">C3.4 After landing and shutdown<\/span>.<\/p>","checks":[{"id":"L3.3:shutdown:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L3.3:shutdown:checklist:securing-airplane","label":"Checklist \"Securing the airplane (shutdown)\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Parking brake<\/td><td><strong>SET<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>IDLE (about 1,000 RPM)<\/strong><\/td><td><\/td><\/tr><tr><td>Electrical equipment and avionics master<\/td><td><strong>OFF<\/strong><\/td><td><\/td><\/tr><tr><td>Mixture<\/td><td><strong>IDLE CUT-OFF (pulled fully out)<\/strong><\/td><td><\/td><\/tr><tr><td>Ignition switch<\/td><td><strong>OFF<\/strong><\/td><td>After the engine stops.<\/td><\/tr><tr><td>Master switch<\/td><td><strong>OFF<\/strong><\/td><td><\/td><\/tr><tr><td>Fuel selector<\/td><td><strong>LEFT or RIGHT<\/strong><\/td><td>To prevent fuel cross-feeding between the tanks while parked (POH).<\/td><\/tr><tr><td>Control lock and tie-downs<\/td><td><strong>INSTALL<\/strong><\/td><td>If modeled.<\/td><\/tr><\/table>"}]},{"id":"overall","title":"Overall","checks":[{"id":"L3.3:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Complete a run-up, including the magneto check, controls, trim, flaps and fuel.<\/li><li>Give a takeoff briefing that covers what you'll do if something goes wrong.<\/li><li>Complete the after-landing and shutdown checklists.<\/li><\/ul>"},{"id":"L3.3:overall:numbers","label":"Every number and V-speed matches the POH and what the sim shows","detail":"<dl><dt>vspeed.vg<\/dt><dd>68 KIAS<\/dd><\/dl>"},{"id":"L3.3:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 2 — Ground Operations<\/a><\/li><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 5 — Maintaining Aircraft Control: Upset Prevention and Recovery Training<\/a><\/li><li>MSFS 2024 in-sim checklist for the Cessna 172 (In the sim: the checklist section of the EFB (electronic flight bag). The location can change between sim updates.)<\/li><\/ul>"},{"id":"L3.3:overall:minutes","label":"Estimated time (15 min) is realistic"}]}]},{"id":"C3.1","type":"challenge","title":"Cold and dark to running","file":"content/challenges/c3-1-cold-and-dark-to-running.yaml","priority":"P0","estimatedMinutes":15,"meta":[{"label":"Goal","value":"Start the engine from cold and dark using the checklists, with checklist assistance off."},{"label":"Type","value":"procedure, difficulty 2/5"},{"label":"Lessons","value":"L3.1 Preflight and engine start"}],"groups":[{"id":"sim","title":"Open markers and tracker notes","hint":"Settle each one in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"C3.1:tracker:17py0o8","label":"Parking spot name for the northwest apron"},{"id":"C3.1:tracker:1s4k6jv","label":"Name of the checklist auto-complete setting"},{"id":"C3.1:tracker:p155jm","label":"The engine starts with the POH sequence"},{"id":"C3.1:tracker:1jbdknh","label":"Time it"}]},{"id":"setup","title":"Setup: can every field be set exactly as written?","hint":"Start the sim fresh and set up only from the brief. Note any menu name that differs.","checks":[{"id":"C3.1:setup:start","label":"Start: COLD_DARK at KLVK","detail":"<dl><dt>label<\/dt><dd>Cold and dark<\/dd><dt>description<\/dt><dd>At a parking spot with all systems off. On the world map, pick a parking spot (one of the small dots). The airport's large circle starts you on the runway with the engine running. You start outside the airplane, so remove the pitot, static port and engine covers and the wheel chocks, then climb in.<\/dd><\/dl>"},{"id":"C3.1:setup:parking","label":"Parking: Parking 6 - Ramp GA Small"},{"id":"C3.1:setup:weather","label":"Weather: WX_CALM","detail":"<dl><dt>label<\/dt><dd>Calm and clear<\/dd><dt>summary<\/dt><dd>Clear skies, calm wind, unlimited visibility.<\/dd><dt>clouds<\/dt><dd>Clear<\/dd><dt>surfaceWind<\/dt><dd>Calm<\/dd><dt>visibility<\/dt><dd>10 sm or more<\/dd><dt>temperatureC<\/dt><dd>15<\/dd><dt>altimeterInHg<\/dt><dd>29.92<\/dd><\/dl>"},{"id":"C3.1:setup:time","label":"Time 10:00 local, date late-spring","detail":"<dl><dt>label<\/dt><dd>Late spring<\/dd><dt>date<\/dt><dd>15 May<\/dd><\/dl>"},{"id":"C3.1:setup:load","label":"Load: LOAD_SOLO","detail":"<dl><dt>label<\/dt><dd>Solo<\/dd><dt>description<\/dt><dd>Pilot 170 lb, no passengers, 75% fuel (about 40 gal). Set it in the EFB (TAB) under Flight planner, on the Payload &amp; fuel page. Fuel is in pounds (6 lb a gallon), so set Extra fuel to about 230 lb for a block fuel near 240 lb, then press LOAD. The default is only 10 lb.<\/dd><\/dl>"},{"id":"C3.1:setup:assistance","label":"Assistance: training","detail":"<dl><dt>label<\/dt><dd>Learn to Fly Training profile<\/dd><dt>description<\/dt><dd>Auto-Rudder, AI Auto-Trim and path aids off, whatever your controller (gamepads use the LT and RT triggers for rudder). Lesson 0.2 lists every setting.<\/dd><\/dl>"},{"id":"C3.1:setup:switches","label":"AI traffic off, ATC off, crash damage off"}]},{"id":"procedure","title":"Procedure: fly it exactly as written","hint":"Mark any step that is ambiguous, impossible or in the wrong order.","checks":[{"id":"C3.1:step:1gmv8gc","label":"Step 1: Make sure checklist assistance (auto-complete) is off in the sim."},{"id":"C3.1:step:xbwyar","label":"Step 2: Open the Learn to Fly checklists on a second screen (Reference → Checklists) or the in-sim checklist."},{"id":"C3.1:step:wyqfwe","label":"Step 3: Complete \"Before starting engine\" with a left-to-right flow, then check it against the checklist."},{"id":"C3.1:step:1xg83xe","label":"Step 4: Complete \"Starting engine\". Look outside and say \"CLEAR!\" before turning the key."},{"id":"C3.1:step:1jlltfg","label":"Step 5: Check oil pressure rises into the green within 30 to 60 seconds and set about 1,000 RPM."},{"id":"C3.1:step:1qd9qt5","label":"Step 6: Complete the after-start items (avionics master on, flaps checked, lights, altimeter set)."}]},{"id":"criteria","title":"Criteria: measurable from inside the sim?","hint":"Each criterion must be checkable from the PFD, the clock, the replay or a map trail, and the tiers must make sense.","checks":[{"id":"C3.1:criterion:running","label":"Engine started and running at about 1,000 RPM (required)","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 3<\/dd><dt>Review link<\/dt><dd>L3.1 Preflight and engine start → starting-the-engine<\/dd><\/dl>"},{"id":"C3.1:criterion:checklist-order","label":"Checklists followed in order, no items skipped (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 3<\/dd><dt>Gold<\/dt><dd>0 skipped<\/dd><dt>Silver<\/dt><dd>1–2 skipped<\/dd><dt>Bronze<\/dt><dd>3–4 skipped<\/dd><\/dl>"},{"id":"C3.1:criterion:avionics-off","label":"Avionics master off during the start (required)","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 2<\/dd><dt>Review link<\/dt><dd>L1.3 Engine, fuel and electrical systems → the-electrical-system<\/dd><\/dl>"},{"id":"C3.1:criterion:clear","label":"Said \"CLEAR!\" before the start","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 1<\/dd><\/dl>"},{"id":"C3.1:criterion:oil-pressure","label":"Oil pressure checked rising within 60 seconds (required)","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 2<\/dd><\/dl>"},{"id":"C3.1:criterion:time","label":"Time from cold and dark to running","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 1<\/dd><dt>Gold<\/dt><dd>5 minutes or less<\/dd><dt>Silver<\/dt><dd>8 minutes or less<\/dd><dt>Bronze<\/dt><dd>12 minutes or less<\/dd><\/dl>"}]},{"id":"extras","title":
