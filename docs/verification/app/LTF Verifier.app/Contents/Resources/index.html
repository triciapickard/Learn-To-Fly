; ⚠ verify — Sim check: the NXi's XPDR softkeys are Standby, On, ALT, VFR, Code and Ident, with no GND mode, per the Garmin NXi Pilot's Guide; confirm the sim's softkeys match), lights as needed.\"","line":49},{"id":"C3.4:tracker:6k4rms","label":"Runway name"},{"id":"C3.4:tracker:piczyt","label":"XPDR softkey mode names"},{"id":"C3.4:tracker:1jbdknh","label":"Time it"}]},{"id":"setup","title":"Setup: can every field be set exactly as written?","hint":"Start the sim fresh and set up only from the brief. Note any menu name that differs.","checks":[{"id":"C3.4:setup:start","label":"Start: RUNWAY at KLVK","detail":"<dl><dt>label<\/dt><dd>On the runway<\/dd><dt>description<\/dt><dd>Lined up on the named runway, engine running, ready for takeoff. On the world map, pick the airport's large circle, or the named runway.<\/dd><\/dl>"},{"id":"C3.4:setup:runway","label":"Runway 25R"},{"id":"C3.4:setup:fallback","label":"Fallback: The sim can't start you just after landing. Either take off, fly a quick unscored pattern and land, or fly this straight after C4.3."},{"id":"C3.4:setup:weather","label":"Weather: WX_CALM","detail":"<dl><dt>label<\/dt><dd>Calm and clear<\/dd><dt>summary<\/dt><dd>Clear skies, calm wind, unlimited visibility.<\/dd><dt>clouds<\/dt><dd>Clear<\/dd><dt>surfaceWind<\/dt><dd>Calm<\/dd><dt>visibility<\/dt><dd>10 sm or more<\/dd><dt>temperatureC<\/dt><dd>15<\/dd><dt>altimeterInHg<\/dt><dd>29.92<\/dd><\/dl>"},{"id":"C3.4:setup:time","label":"Time 10:00 local, date late-spring","detail":"<dl><dt>label<\/dt><dd>Late spring<\/dd><dt>date<\/dt><dd>15 May<\/dd><\/dl>"},{"id":"C3.4:setup:load","label":"Load: LOAD_SOLO","detail":"<dl><dt>label<\/dt><dd>Solo<\/dd><dt>description<\/dt><dd>Pilot 170 lb, no passengers, 75% fuel (about 40 gal). Set it in the EFB (TAB) under Flight planner, on the Payload &amp; fuel page. Fuel is in pounds (6 lb a gallon), so set Extra fuel to about 230 lb for a block fuel near 240 lb, then press LOAD. The default is only 10 lb.<\/dd><\/dl>"},{"id":"C3.4:setup:assistance","label":"Assistance: training","detail":"<dl><dt>label<\/dt><dd>Learn to Fly Training profile<\/dd><dt>description<\/dt><dd>Auto-Rudder, AI Auto-Trim and path aids off, whatever your controller (gamepads use the LT and RT triggers for rudder). Lesson 0.2 lists every setting.<\/dd><\/dl>"},{"id":"C3.4:setup:switches","label":"AI traffic off, ATC off, crash damage off"}]},{"id":"procedure","title":"Procedure: fly it exactly as written","hint":"Mark any step that is ambiguous, impossible or in the wrong order.","checks":[{"id":"C3.4:step:yu3ptu","label":"Step 1: Take off, fly a quick unscored pattern and land (or continue straight after C4.3)."},{"id":"C3.4:step:1lfitv0","label":"Step 2: Slow to taxi speed and turn off at a taxiway. Keep going until the whole airplane is past the hold short line, then stop."},{"id":"C3.4:step:1yvpa48","label":"Step 3: After-landing items. Flaps up, transponder left in ALT until you're parked (AIM 4-1-20;"},{"id":"C3.4:step:1ekz517","label":"Step 4: Taxi to parking and set the parking brake."},{"id":"C3.4:step:pixs9h","label":"Step 5: Shut down. Avionics master off, mixture to idle cut-off, magnetos off, master off."}]},{"id":"criteria","title":"Criteria: measurable from inside the sim?","hint":"Each criterion must be checkable from the PFD, the clock, the replay or a map trail, and the tiers must make sense.","checks":[{"id":"C3.4:criterion:cleared-runway","label":"Cleared the runway completely before stopping (required)","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 3<\/dd><dt>Review link<\/dt><dd>L3.3 Run-up, before takeoff, and after landing → after-landing<\/dd><\/dl>"},{"id":"C3.4:criterion:after-landing-items","label":"After-landing items completed (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 2<\/dd><dt>Gold<\/dt><dd>All done<\/dd><dt>Silver<\/dt><dd>1 missed<\/dd><dt>Bronze<\/dt><dd>2 missed<\/dd><\/dl>"},{"id":"C3.4:criterion:mixture-shutdown","label":"Shut down with the mixture (not the magnetos) (required)","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 2<\/dd><dt>Review link<\/dt><dd>L3.3 Run-up, before takeoff, and after landing → shutdown<\/dd><\/dl>"},{"id":"C3.4:criterion:final-switches","label":"Final switches (magnetos off, master off, parking brake set) (required)","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 2<\/dd><\/dl>"}]},{"id":"extras","title":"Goal, tips and debrief","checks":[{"id":"C3.4:goal","label":"Goal is clear and matches the criteria","detail":"<p>Clear the runway, run the after-landing checklist, taxi to parking and shut down properly.<\/p>"},{"id":"C3.4:mistakes","label":"Common mistakes are the ones you actually see","detail":"<ul><li>Stopping with the tail still over the hold short line.<\/li><li>Shutting down with the magnetos instead of the mixture.<\/li><\/ul>"},{"id":"C3.4:tips","label":"Tips are correct and useful","detail":"<ul><li>Don't start the after-landing checklist until you're clear of the runway and stopped.<\/li><\/ul>"},{"id":"C3.4:debrief","label":"Debrief questions fit the flight","detail":"<ul><li>Why do you stop only after the whole airplane has crossed the hold short line?<\/li><\/ul>"}]},{"id":"flight","title":"Flight record (protocol 54.3)","hint":"Record the tier and the minutes it took in the fields above, then tick these.","checks":[{"id":"C3.4:flight:fresh","label":"Flown from the brief only, after a fresh sim start"},{"id":"C3.4:flight:timed","label":"Timed it (estimate is 10 min)"},{"id":"C3.4:flight:badly","label":"Flown deliberately badly once: the rubric separates Bronze from Gold"},{"id":"C3.4:flight:screens","label":"Screenshots taken where the brief or lesson needs one (or none needed)"}]}]}]},{"code":"M4","title":"Takeoffs, patterns and landings","summary":"Take off, fly the traffic pattern, land and go around.","items":[{"id":"L4.1","type":"lesson","title":"Normal takeoff and climb","file":"content/lessons/m4-takeoffs-patterns-landings/l4-1-normal-takeoff-and-climb.md","priority":"P0","estimatedMinutes":15,"meta":[{"label":"Summary","value":"Line up, add power smoothly, hold the centerline, rotate at the right speed and climb out of the pattern."},{"label":"Prerequisites","value":"L3.3 Run-up, before takeoff, and after landing, L2.3 Climbs and descents"},{"label":"Challenges","value":"C4.1 Normal takeoff and departure"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L4.1:marker:1v014eq","label":"Sim check: check the lined-up sight picture from the MSFS 2024 default cockpit camera and add a screenshot (Section 49.5).","line":40},{"id":"L4.1:tracker:1k2u7ad","label":"Lined-up sight picture screenshot from the default cockpit camera (49.5)"},{"id":"L4.1:tracker:1zlaxd","label":"Confirm the takeoff roll needs right rudder with auto-rudder off"}]},{"id":"lining-up","title":"Lining up","reading":"<p>Taxi onto the runway and line up on the centerline. Use the whole runway and start from the very end, because runway behind you can't help you.<\/p><p>From the left seat, the centerline runs under the airplane's nose, a little to the right of where you're sitting. In the sim, find the view where the centerline disappears under the middle of the nose and remember it.<\/p><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: check the lined-up sight picture from the MSFS 2024 default cockpit camera and add a screenshot (Section 49.5).<\/p><\/div>","checks":[{"id":"L4.1:lining-up:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"full-power-smoothly","title":"Full power, smoothly","reading":"<ol><li><strong>Throttle to full, smoothly<\/strong>, over about 2–3 seconds. Slamming it in makes the airplane swerve.<\/li><li><strong>&quot;Airspeed alive.&quot;<\/strong> Call it when the airspeed tape starts moving.<\/li><li><strong>Engine gauges green.<\/strong> A quick glance at RPM and oil pressure.<\/li><li><strong>Eyes outside<\/strong>, far down the runway.<\/li><\/ol>","checks":[{"id":"L4.1:full-power-smoothly:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"right-rudder","title":"Right rudder","reading":"<p>As the airplane accelerates at full power, it tends to turn left. The engine's torque, the spiraling propeller slipstream and P-factor all push the nose left (the Go deeper links explain why). Hold the centerline with right rudder, adding more as the speed builds.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>Which rudder do you usually need during the takeoff roll?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Left rudder<\/p><\/li><li class=\"correct\">☑ <p>Right rudder<\/p><\/li><li class=\"\">☐ <p>None, the airplane tracks straight<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Right rudder.<\/strong> At full power and low speed the airplane pulls left, so you hold the centerline with right rudder.<\/p><\/div><\/div>","checks":[{"id":"L4.1:right-rudder:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.1:right-rudder:quiz:l4-1-q1","label":"Quiz l4-1-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Which rudder do you usually need during the takeoff roll?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Left rudder<\/p><\/li><li class=\"correct\">☑ <p>Right rudder<\/p><\/li><li class=\"\">☐ <p>None, the airplane tracks straight<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Right rudder.<\/strong> At full power and low speed the airplane pulls left, so you hold the centerline with right rudder.<\/p><\/div><\/div>"}]},{"id":"rotate-and-climb","title":"Rotate and climb","reading":"<p>At 55 KIAS, apply gentle back pressure to raise the nose to the takeoff attitude, about 10° nose up. Don't pull it off the ground. Hold the attitude and let the airplane fly off when it reaches flying speed.<\/p><p>After liftoff, let the speed settle at 74 KIAS (Vy). Trim for it. Above about 500 ft above the ground, you can lower the nose to a cruise climb (75–85 KIAS) for a better view and cooler engine.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>At what speed do you rotate?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>62 KIAS<\/p><\/li><li class=\"\">☐ <p>74 KIAS<\/p><\/li><li class=\"correct\">☑ <p>55 KIAS<\/p><\/li><li class=\"\">☐ <p>40 KIAS<\/p><\/li><\/ul><div class=\"explain\"><p>Rotate at 55 KIAS, then climb at 74 KIAS.<\/p><\/div><\/div><div class=\"embed\"><span class=\"tag\">Checklist: Normal takeoff<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Flaps<\/td><td><strong>0°–10°<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>FULL smoothly<\/strong><\/td><td>Mixture RICH.<\/td><\/tr><tr><td>Engine gauges and airspeed<\/td><td><strong>CHECK<\/strong><\/td><td>Call &quot;airspeed alive&quot;.<\/td><\/tr><tr><td>Rotate<\/td><td><strong>Lift the nose wheel at 55 KIAS<\/strong><\/td><td><\/td><\/tr><tr><td>Climb speed<\/td><td><strong>70–80 KIAS initially, then Vy 74 KIAS<\/strong><\/td><td><\/td><\/tr><tr><td>Flaps<\/td><td><strong>RETRACT if extended<\/strong><\/td><td>At a safe altitude and speed.<\/td><\/tr><\/table><\/div><div class=\"callout sim\"><span class=\"tag\">Sim vs reality<\/span><p>In a real airplane you feel the acceleration and the wheels leaving the ground. In the sim you don't, so watch the airspeed tape and the view out the front. Call the speeds out loud to keep your attention on them.<\/p><\/div>","checks":[{"id":"L4.1:rotate-and-climb:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.1:rotate-and-climb:quiz:l4-1-q2","label":"Quiz l4-1-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>At what speed do you rotate?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>62 KIAS<\/p><\/li><li class=\"\">☐ <p>74 KIAS<\/p><\/li><li class=\"correct\">☑ <p>55 KIAS<\/p><\/li><li class=\"\">☐ <p>40 KIAS<\/p><\/li><\/ul><div class=\"explain\"><p>Rotate at 55 KIAS, then climb at 74 KIAS.<\/p><\/div><\/div>"},{"id":"L4.1:rotate-and-climb:checklist:normal-takeoff","label":"Checklist \"Normal takeoff\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Flaps<\/td><td><strong>0°–10°<\/strong><\/td><td><\/td><\/tr><tr><td>Throttle<\/td><td><strong>FULL smoothly<\/strong><\/td><td>Mixture RICH.<\/td><\/tr><tr><td>Engine gauges and airspeed<\/td><td><strong>CHECK<\/strong><\/td><td>Call &quot;airspeed alive&quot;.<\/td><\/tr><tr><td>Rotate<\/td><td><strong>Lift the nose wheel at 55 KIAS<\/strong><\/td><td><\/td><\/tr><tr><td>Climb speed<\/td><td><strong>70–80 KIAS initially, then Vy 74 KIAS<\/strong><\/td><td><\/td><\/tr><tr><td>Flaps<\/td><td><strong>RETRACT if extended<\/strong><\/td><td>At a safe altitude and speed.<\/td><\/tr><\/table>"},{"id":"L4.1:rotate-and-climb:callout:vhssmo","label":"Sim vs reality: still true in the current sim?","detail":"<p>In a real airplane you feel the acceleration and the wheels leaving the ground. In the sim you don't, so watch the airspeed tape and the view out the front. Call the speeds out loud to keep your attention on them.<\/p>"}]},{"id":"leaving-the-pattern","title":"Leaving the pattern","reading":"<p>At a non-towered airport, the AIM recommends departing one of two ways:<\/p><ul><li><strong>Straight out<\/strong>, continuing on the runway heading, or<\/li><li><strong>A 45° turn<\/strong> in the direction of the traffic pattern (to the left for a left pattern), after you reach pattern altitude.<\/li><\/ul><p>At a towered airport, fly what the tower tells you.<\/p>","checks":[{"id":"L4.1:leaving-the-pattern:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"when-to-abort","title":"When to abort","reading":"<p>The best time to find a problem is on the runway, when you can stop. <strong>Reject the takeoff<\/strong> if, before liftoff:<\/p><ul><li>The airspeed isn't increasing.<\/li><li>The engine runs rough or loses power.<\/li><li>The airplane drifts toward the edge and you can't correct it.<\/li><li>A door pops open, or anything else doesn't feel right.<\/li><\/ul><p>To abort, <strong>throttle to idle, keep straight with rudder, brake firmly<\/strong> and stop.<\/p><div class=\"callout safety\"><span class=\"tag\">Safety<\/span><p>If in doubt on the ground, abort. You have runway. Once you're airborne with little runway left, your options shrink fast.<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>When should you reject a takeoff?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Only if the engine stops completely<\/p><\/li><li class=\"correct\">☑ <p>At any abnormal indication before liftoff, such as airspeed not increasing or a rough engine<\/p><\/li><li class=\"\">☐ <p>Never; once you add full power you're committed<\/p><\/li><li class=\"\">☐ <p>Only after liftoff<\/p><\/li><\/ul><div class=\"explain\"><p>Reject the takeoff at any abnormal indication before liftoff. Close the throttle, keep straight and brake.<\/p><\/div><\/div>","checks":[{"id":"L4.1:when-to-abort:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.1:when-to-abort:callout:sxpbf2","label":"Safety: correct and complete?","detail":"<p>If in doubt on the ground, abort. You have runway. Once you're airborne with little runway left, your options shrink fast.<\/p>"},{"id":"L4.1:when-to-abort:quiz:l4-1-q3","label":"Quiz l4-1-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>When should you reject a takeoff?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Only if the engine stops completely<\/p><\/li><li class=\"correct\">☑ <p>At any abnormal indication before liftoff, such as airspeed not increasing or a rough engine<\/p><\/li><li class=\"\">☐ <p>Never; once you add full power you're committed<\/p><\/li><li class=\"\">☐ <p>Only after liftoff<\/p><\/li><\/ul><div class=\"explain\"><p>Reject the takeoff at any abnormal indication before liftoff. Close the throttle, keep straight and brake.<\/p><\/div><\/div>"}]},{"id":"common-errors","title":"Common errors","reading":"<ul><li><strong>Over-rotating.<\/strong> Yanking the nose up too high makes the airspeed drop and the stall horn sound. Hold about 10°.<\/li><li><strong>Pulling it off early.<\/strong> Rotating below 55 KIAS leaves the airplane barely flying.<\/li><li><strong>Drifting left.<\/strong> You're not holding enough right rudder.<\/li><li><strong>Forgetting to trim<\/strong> in the climb, then fighting the back pressure.<\/li><\/ul><p>Fly it in <span class=\"ilink\" title=\"/challenges/c4-1-normal-takeoff-and-departure\">C4.1 Normal takeoff and departure<\/span>.<\/p>","checks":[{"id":"L4.1:common-errors:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"overall","title":"Overall","checks":[{"id":"L4.1:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Line up on the centerline and apply full power smoothly.<\/li><li>Hold the centerline with rudder, rotate at Vr and climb at Vy.<\/li><li>Depart the pattern and transition to a cruise climb.<\/li><\/ul>"},{"id":"L4.1:overall:numbers","label":"Every number and V-speed matches the POH and what the sim shows","detail":"<dl><dt>vspeed.vr<\/dt><dd>55 KIAS<\/dd><dt>vspeed.vy<\/dt><dd>74 KIAS<\/dd><dt>vspeed.cruiseClimb<\/dt><dd>75–85 KIAS<\/dd><dt>vspeed.vx<\/dt><dd>62 KIAS<\/dd><dt>vspeed.vso<\/dt><dd>40 KIAS<\/dd><\/dl>"},{"id":"L4.1:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 6 — Takeoffs and Departure Climbs<\/a><\/li><li><a href=\"https://www.boldmethod.com/learn-to-fly/aerodynamics/4-left-turning-tendencies/\" target=\"_blank\" rel=\"noopener\">Boldmethod — why you need right rudder on takeoff (the four left-turning tendencies)<\/a><\/li><\/ul>"},{"id":"L4.1:overall:minutes","label":"Estimated time (15 min) is realistic"}]}]},{"id":"L4.2","type":"lesson","title":"The traffic pattern","file":"content/lessons/m4-takeoffs-patterns-landings/l4-2-the-traffic-pattern.md","priority":"P0","estimatedMinutes":20,"meta":[{"label":"Summary","value":"The rectangular circuit around every airport: the legs, speeds, configuration and how to join and leave it."},{"label":"Prerequisites","value":"L4.1 Normal takeoff and climb"},{"label":"Challenges","value":"C4.2 Fly the pattern"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L4.2:marker:ng22pz","label":"Sim check: fly these settings in the sim at C4.2's weight and adjust (Section 8.5).","line":84},{"id":"L4.2:tracker:1kjzcol","label":"Fly the downwind/base/final table settings at C4.2's weight and adjust (8.5)"},{"id":"L4.2:tracker:g5lzfe","label":"Confirm the sim's ATC and AI traffic use right traffic for KLVK 25R and left traffic at Tracy"},{"id":"L4.2:tracker:14luj8e","label":"Check the traffic-pattern widget"}]},{"id":"why-patterns-exist","title":"Why patterns exist","reading":"<p>Near an airport, airplanes are taking off, landing and arriving from every direction. The <strong>traffic pattern<\/strong> is a standard rectangle around the runway that everyone flies. It makes traffic predictable: you know where to look for other airplanes, and they know where to look for you.<\/p>","checks":[{"id":"L4.2:why-patterns-exist:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"the-legs","title":"The legs","reading":"<p>The pattern has five legs, named by the direction you fly relative to the landing runway:<\/p><ol><li><strong>Departure (upwind).<\/strong> Climbing straight out after takeoff.<\/li><li><strong>Crosswind.<\/strong> A 90° turn, flying across the runway direction.<\/li><li><strong>Downwind.<\/strong> Parallel to the runway, in the opposite direction to landing.<\/li><li><strong>Base.<\/strong> A 90° turn toward the runway.<\/li><li><strong>Final.<\/strong> Lined up with the runway, descending to land.<\/li><\/ol><p>Play the animation below. Turn on the configuration and radio calls, change the wind to see the airplane crab on each leg, and switch between left and right traffic.<\/p><div class=\"widget\">⚙ Widget W7 (traffic-pattern, config=true): open it on the site to check it.<\/div>","checks":[{"id":"L4.2:the-legs:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.2:the-legs:widget:traffic-pattern:config=true","label":"Widget W7 (traffic-pattern, config=true): shows the right thing and matches the lesson text?"}]},{"id":"direction-and-altitude","title":"Direction and altitude","reading":"<ul><li><strong>Left turns<\/strong> are standard. Every turn in the pattern is to the left, so the runway stays on your side of the airplane (you sit on the left). Some runways use <strong>right traffic<\/strong> instead. The sectional chart and the Chart Supplement show it as &quot;RP&quot; for that runway.<\/li><li><strong>Pattern altitude<\/strong> is typically 1,000 ft above the airport, unless the Chart Supplement publishes a different one. Livermore has no published pattern altitude, and its field elevation is about 400 ft, so its pattern is around 1,400 ft MSL. Tracy publishes 800 ft above the field, so fly about 1,000 ft MSL there.<\/li><li><strong>Livermore's patterns.<\/strong> The long runway, 7L/25R, keeps its pattern on the north side of the field: left traffic on 7L, right traffic on 25R. The short runway, 7R/25L, uses the south side. The Reference section's airport cards list the pattern for every runway.<\/li><\/ul><div class=\"quiz\"><div class=\"prompt\"><p>What is the standard traffic pattern direction?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Left turns<\/p><\/li><li class=\"\">☐ <p>Right turns<\/p><\/li><li class=\"\">☐ <p>Whichever way the wind blows<\/p><\/li><li class=\"\">☐ <p>It depends on the time of day<\/p><\/li><\/ul><div class=\"explain\"><p>Left turns are standard, unless the runway is marked for right traffic (RP).<\/p><\/div><\/div>","checks":[{"id":"L4.2:direction-and-altitude:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.2:direction-and-altitude:quiz:l4-2-q1","label":"Quiz l4-2-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>What is the standard traffic pattern direction?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Left turns<\/p><\/li><li class=\"\">☐ <p>Right turns<\/p><\/li><li class=\"\">☐ <p>Whichever way the wind blows<\/p><\/li><li class=\"\">☐ <p>It depends on the time of day<\/p><\/li><\/ul><div class=\"explain\"><p>Left turns are standard, unless the runway is marked for right traffic (RP).<\/p><\/div><\/div>"}]},{"id":"configuration-and-speed-on-each-leg","title":"Configuration and speed on each leg","reading":"<p>These are starting points. Adjust the power to hold the speed.<\/p><table><tr><th>Point in the pattern<\/th><th>Power<\/th><th>Flaps<\/th><th>Speed (KIAS)<\/th><\/tr><tr><td>Downwind<\/td><td>~2,000–2,100<\/td><td>0°<\/td><td>85–90<\/td><\/tr><tr><td>Abeam the touchdown point<\/td><td>~1,700<\/td><td>10°<\/td><td>80<\/td><\/tr><tr><td>Base<\/td><td>~1,700<\/td><td>20°<\/td><td>70<\/td><\/tr><tr><td>Final<\/td><td>as needed<\/td><td>30°<\/td><td>65<\/td><\/tr><\/table><p>Flaps have speed limits: 10° only below 110 KIAS, and more than 10° only below 85 KIAS.<\/p><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: fly these settings in the sim at C4.2's weight and adjust (Section 8.5).<\/p><\/div>","checks":[{"id":"L4.2:configuration-and-speed-on-each-leg:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"key-points","title":"Key points","reading":"<ul><li><strong>Abeam the numbers.<\/strong> When the touchdown point is straight off your left wingtip on downwind, reduce power, set flaps 10 and start down.<\/li><li><strong>Turn base<\/strong> when the touchdown point is about 45° behind the wing.<\/li><li><strong>Turn final<\/strong> so you roll out lined up with the runway without overshooting. If you do overshoot, correct gently. Don't steepen the bank near the ground.<\/li><li><strong>Spacing.<\/strong> On downwind, the runway should be about half to one mile away, just outside the wingtip.<\/li><\/ul><div class=\"quiz\"><div class=\"prompt\"><p>On downwind, when do you reduce power to start the descent?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>At the start of downwind<\/p><\/li><li class=\"correct\">☑ <p>Abeam the touchdown point (the numbers)<\/p><\/li><li class=\"\">☐ <p>After turning base<\/p><\/li><li class=\"\">☐ <p>On final<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Abeam the touchdown point.<\/strong> It gives you a consistent starting point for every approach.<\/p><\/div><\/div><div class=\"callout tip\"><span class=\"tag\">Pro tip<\/span><p>At your home airport, pick a visual point on the ground for each turn: a road, a building or a field corner. Consistent turn points give consistent approaches.<\/p><\/div>","checks":[{"id":"L4.2:key-points:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.2:key-points:quiz:l4-2-q2","label":"Quiz l4-2-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>On downwind, when do you reduce power to start the descent?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>At the start of downwind<\/p><\/li><li class=\"correct\">☑ <p>Abeam the touchdown point (the numbers)<\/p><\/li><li class=\"\">☐ <p>After turning base<\/p><\/li><li class=\"\">☐ <p>On final<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Abeam the touchdown point.<\/strong> It gives you a consistent starting point for every approach.<\/p><\/div><\/div>"},{"id":"L4.2:key-points:callout:6nn86b","label":"Pro tip: correct and useful?","detail":"<p>At your home airport, pick a visual point on the ground for each turn: a road, a building or a field corner. Consistent turn points give consistent approaches.<\/p>"}]},{"id":"wind-on-each-leg","title":"Wind on each leg","reading":"<p>A crosswind blows you sideways. On each leg, point the nose slightly into the wind (crab) so your path over the ground stays rectangular. In the animation, set a wind and watch the airplane's nose point off the ground track.<\/p>","checks":[{"id":"L4.2:wind-on-each-leg:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"entering-and-leaving","title":"Entering and leaving","reading":"<p>At a non-towered airport, the standard entry is on a 45° angle to the downwind leg, at pattern altitude, aiming to join about midfield. Leave by flying straight out or with a 45° turn after reaching pattern altitude.<\/p><div class=\"quiz\"><div class=\"prompt\"><p>What is the standard pattern entry at a non-towered airport?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Straight in on final<\/p><\/li><li class=\"correct\">☑ <p>On a 45° angle to the downwind leg, at pattern altitude<\/p><\/li><li class=\"\">☐ <p>Overhead the runway at 2,000 ft<\/p><\/li><li class=\"\">☐ <p>On the base leg<\/p><\/li><\/ul><div class=\"explain\"><p>A 45° entry to downwind at pattern altitude, joining about midfield. It lets you see traffic already in the pattern.<\/p><\/div><\/div>","checks":[{"id":"L4.2:entering-and-leaving:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.2:entering-and-leaving:quiz:l4-2-q3","label":"Quiz l4-2-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>What is the standard pattern entry at a non-towered airport?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Straight in on final<\/p><\/li><li class=\"correct\">☑ <p>On a 45° angle to the downwind leg, at pattern altitude<\/p><\/li><li class=\"\">☐ <p>Overhead the runway at 2,000 ft<\/p><\/li><li class=\"\">☐ <p>On the base leg<\/p><\/li><\/ul><div class=\"explain\"><p>A 45° entry to downwind at pattern altitude, joining about midfield. It lets you see traffic already in the pattern.<\/p><\/div><\/div>"}]},{"id":"where-to-look","title":"Where to look","reading":"<p>The pattern is where airplanes are most concentrated. Keep looking outside, especially before each turn and on final (someone might be on a long straight-in approach). Turn on your landing light in the pattern so others can see you.<\/p>","checks":[{"id":"L4.2:where-to-look:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"overall","title":"Overall","checks":[{"id":"L4.2:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Name the legs of the traffic pattern.<\/li><li>Fly a rectangular pattern at pattern altitude with correct speeds and configuration.<\/li><li>Enter the pattern correctly at a non-towered airport.<\/li><\/ul>"},{"id":"L4.2:overall:numbers","label":"Every number and V-speed matches the POH and what the sim shows","detail":"<dl><dt>vspeed.vfe10<\/dt><dd>110 KIAS<\/dd><dt>vspeed.vfe<\/dt><dd>85 KIAS<\/dd><\/dl>"},{"id":"L4.2:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/air_traffic/publications/atpubs/aim_html/chap4_section_3.html\" target=\"_blank\" rel=\"noopener\">AIM 4-3 — Airport Operations<\/a><\/li><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 8 — Airport Traffic Patterns<\/a><\/li><li><a href=\"https://www.boldmethod.com/learn-to-fly/maneuvers/how-to-fly-a-traffic-pattern-at-a-non-towered-airport-pattern-from-entry-to-landing/\" target=\"_blank\" rel=\"noopener\">Boldmethod — flying the pattern at a non-towered airport<\/a><\/li><\/ul>"},{"id":"L4.2:overall:minutes","label":"Estimated time (20 min) is realistic"}]}]},{"id":"L4.3","type":"lesson","title":"Normal approach and landing","file":"content/lessons/m4-takeoffs-patterns-landings/l4-3-normal-approach-and-landing.md","priority":"P0","estimatedMinutes":25,"meta":[{"label":"Summary","value":"Fly a stabilized approach, judge the glide path, and flare to a gentle touchdown on the centerline."},{"label":"Prerequisites","value":"L4.2 The traffic pattern"},{"label":"Challenges","value":"C4.3 Full-stop landing, C4.7 Three-circuit session"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L4.3:marker:a2zmjy","label":"Sim check: desk-verified 2026-10-13 against AirNav (FAA data effective 2026-10-01): Livermore has a four-light PAPI on 7L (4.0° path) and 25R (3.0°) only; Tracy has a two-light PAPI on all four ends (8 at 3.4°, 26, 12 and 30 at 3.0°). Still open: that the sim shows them in the same places, with the same number of lights, and that they read on-path at those angles.","line":85},{"id":"L4.3:tracker:leqpv8","label":"Check PAPIs are shown at KLVK 7L and 25R and all four Tracy ends and read correctly on a 3 degree path"},{"id":"L4.3:tracker:1u9ztyb","label":"Check the flare camera advice"},{"id":"L4.3:tracker:19i4qhm","label":"Add a screenshot if useful"}]},{"id":"the-stabilized-approach","title":"The stabilized approach","reading":"<p>A good landing starts with a good approach. By 300 ft above the ground on final, the approach must be <strong>stabilized<\/strong>:<\/p><ul><li><strong>Configured.<\/strong> Full flaps (30°), before-landing checklist done.<\/li><li><strong>On speed.<\/strong> 65 KIAS, within about ±5 knots.<\/li><li><strong>On the glide path.<\/strong> Neither high nor low.<\/li><li><strong>On the centerline.<\/strong> Lined up with the runway.<\/li><li><strong>Power set.<\/strong> Small adjustments only.<\/li><\/ul><p>If any of these isn't true at 300 ft, <strong>go around<\/strong>. It's the rule professional pilots use, and it prevents most landing accidents.<\/p><div class=\"embed\"><span class=\"tag\">Checklist: Before landing<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Seat and belts<\/td><td><strong>SECURE<\/strong><\/td><td><\/td><\/tr><tr><td>Fuel selector<\/td><td><strong>BOTH<\/strong><\/td><td><\/td><\/tr><tr><td>Mixture<\/td><td><strong>RICH<\/strong><\/td><td><\/td><\/tr><tr><td>Landing and taxi lights<\/td><td><strong>ON<\/strong><\/td><td><\/td><\/tr><tr><td>Autopilot<\/td><td><strong>OFF<\/strong><\/td><td><\/td><\/tr><\/table><\/div><div class=\"quiz\"><div class=\"prompt\"><p>You're not stabilized at 300 ft AGL on final. What do you do?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Push the nose down to catch up<\/p><\/li><li class=\"\">☐ <p>Land anyway and brake hard<\/p><\/li><li class=\"correct\">☑ <p>Go around<\/p><\/li><li class=\"\">☐ <p>Add flaps<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Go around.<\/strong> An unstabilized approach leads to a bad landing. A go-around is a normal maneuver and a good decision.<\/p><\/div><\/div>","checks":[{"id":"L4.3:the-stabilized-approach:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.3:the-stabilized-approach:checklist:before-landing","label":"Checklist \"Before landing\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Seat and belts<\/td><td><strong>SECURE<\/strong><\/td><td><\/td><\/tr><tr><td>Fuel selector<\/td><td><strong>BOTH<\/strong><\/td><td><\/td><\/tr><tr><td>Mixture<\/td><td><strong>RICH<\/strong><\/td><td><\/td><\/tr><tr><td>Landing and taxi lights<\/td><td><strong>ON<\/strong><\/td><td><\/td><\/tr><tr><td>Autopilot<\/td><td><strong>OFF<\/strong><\/td><td><\/td><\/tr><\/table>"},{"id":"L4.3:the-stabilized-approach:quiz:l4-3-q1","label":"Quiz l4-3-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>You're not stabilized at 300 ft AGL on final. What do you do?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Push the nose down to catch up<\/p><\/li><li class=\"\">☐ <p>Land anyway and brake hard<\/p><\/li><li class=\"correct\">☑ <p>Go around<\/p><\/li><li class=\"\">☐ <p>Add flaps<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Go around.<\/strong> An unstabilized approach leads to a bad landing. A go-around is a normal maneuver and a good decision.<\/p><\/div><\/div>"}]},{"id":"the-aiming-point","title":"The aiming point","reading":"<p>Pick a spot on the runway where you want the approach to end, a little before your planned touchdown point. Watch it in the windshield:<\/p><ul><li>If it stays still, you're on the right path.<\/li><li>If it moves up, you're going to land short (you're too low).<\/li><li>If it moves down, you'll land long (you're too high).<\/li><\/ul>","checks":[{"id":"L4.3:the-aiming-point:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"the-papi","title":"The PAPI","reading":"<p>Many runways have a <strong>PAPI<\/strong>: four lights beside the runway that show your glide path.<\/p><table><tr><th>Lights<\/th><th>Meaning<\/th><\/tr><tr><td>4 white<\/td><td>Too high<\/td><\/tr><tr><td>3 white, 1 red<\/td><td>Slightly high<\/td><\/tr><tr><td>2 white, 2 red<\/td><td>On the glide path<\/td><\/tr><tr><td>1 white, 3 red<\/td><td>Slightly low<\/td><\/tr><tr><td>4 red<\/td><td>Too low<\/td><\/tr><\/table><p>Some airports have an older two-bar <strong>VASI<\/strong> instead: red over white means on path. A memory aid: &quot;red over white, you're all right&quot;.<\/p><p>Smaller airports often have a <strong>two-light PAPI<\/strong> instead of four: one white and one red means on the glide path, two white is high, two red is low.<\/p><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: desk-verified 2026-10-13 against AirNav (FAA data effective 2026-10-01): Livermore has a four-light PAPI on 7L (4.0° path) and 25R (3.0°) only; Tracy has a two-light PAPI on all four ends (8 at 3.4°, 26, 12 and 30 at 3.0°). Still open: that the sim shows them in the same places, with the same number of lights, and that they read on-path at those angles.<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>Two white lights and two red lights on the PAPI mean what?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Too high<\/p><\/li><li class=\"correct\">☑ <p>On the glide path<\/p><\/li><li class=\"\">☐ <p>Too low<\/p><\/li><li class=\"\">☐ <p>The runway is closed<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Two white, two red: on the glide path.<\/strong> More white means high, more red means low.<\/p><\/div><\/div>","checks":[{"id":"L4.3:the-papi:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.3:the-papi:quiz:l4-3-q2","label":"Quiz l4-3-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Two white lights and two red lights on the PAPI mean what?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Too high<\/p><\/li><li class=\"correct\">☑ <p>On the glide path<\/p><\/li><li class=\"\">☐ <p>Too low<\/p><\/li><li class=\"\">☐ <p>The runway is closed<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Two white, two red: on the glide path.<\/strong> More white means high, more red means low.<\/p><\/div><\/div>"}]},{"id":"pitch-and-power-on-final","title":"Pitch and power on final","reading":"<p>A useful simplification for final approach:<\/p><ul><li><strong>Pitch controls airspeed.<\/strong> If you're too fast, raise the nose slightly. If you're too slow, lower it.<\/li><li><strong>Power controls the glide path.<\/strong> If you're too low, add a little power. If you're too high, reduce it.<\/li><\/ul><p>Make small corrections, and make them early.<\/p>","checks":[{"id":"L4.3:pitch-and-power-on-final:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"the-round-out-and-flare","title":"The round-out and flare","reading":"<ol><li>At about 10–20 ft above the runway, start the <strong>round-out<\/strong>: gently raise the nose to stop the descent.<\/li><li><strong>Look down the runway<\/strong>, toward the far end, not over the nose. The runway's edges and how fast they're converging tell you your height.<\/li><li><strong>Flare.<\/strong> As the airplane slows, keep raising the nose to hold it just off the runway. The airplane should settle gently.<\/li><li><strong>Main wheels first<\/strong>, with the nose held up. Then let the nose wheel down gently.<\/li><\/ol><div class=\"callout sim\"><span class=\"tag\">Sim vs reality<\/span><p>A flat screen gives no depth perception, which makes judging the flare harder than in real life. Watch the runway edges spread apart as you get lower, and look far down the runway. Find a camera height that shows enough runway over the nose.<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>Where should you look during the flare?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Straight over the nose at the runway just ahead<\/p><\/li><li class=\"\">☐ <p>At the airspeed tape<\/p><\/li><li class=\"correct\">☑ <p>Toward the far end of the runway<\/p><\/li><li class=\"\">☐ <p>Out the side window<\/p><\/li><\/ul><div class=\"explain\"><p>Look toward the far end of the runway. Looking just ahead of the nose makes the ground rush past and hides your height.<\/p><\/div><\/div>","checks":[{"id":"L4.3:the-round-out-and-flare:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.3:the-round-out-and-flare:callout:1snobdd","label":"Sim vs reality: still true in the current sim?","detail":"<p>A flat screen gives no depth perception, which makes judging the flare harder than in real life. Watch the runway edges spread apart as you get lower, and look far down the runway. Find a camera height that shows enough runway over the nose.<\/p>"},{"id":"L4.3:the-round-out-and-flare:quiz:l4-3-q3","label":"Quiz l4-3-q3: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Where should you look during the flare?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>Straight over the nose at the runway just ahead<\/p><\/li><li class=\"\">☐ <p>At the airspeed tape<\/p><\/li><li class=\"correct\">☑ <p>Toward the far end of the runway<\/p><\/li><li class=\"\">☐ <p>Out the side window<\/p><\/li><\/ul><div class=\"explain\"><p>Look toward the far end of the runway. Looking just ahead of the nose makes the ground rush past and hides your height.<\/p><\/div><\/div>"}]},{"id":"after-touchdown","title":"After touchdown","reading":"<ul><li><strong>Keep straight<\/strong> with the rudder.<\/li><li><strong>Brake gently<\/strong> once the nose wheel is down.<\/li><li><strong>Slow to taxi speed<\/strong>, then clear the runway at a taxiway.<\/li><\/ul><div class=\"embed\"><span class=\"tag\">Checklist: Normal landing<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Airspeed<\/td><td><strong>65–75 KIAS flaps up, 60–70 KIAS flaps 30°<\/strong><\/td><td><\/td><\/tr><tr><td>Flaps<\/td><td><strong>AS REQUIRED<\/strong><\/td><td>10° below 110 KIAS; more than 10° only below 85 KIAS.<\/td><\/tr><tr><td>Stabilized approach<\/td><td><strong>BY 300 ft AGL<\/strong><\/td><td>The Learn to Fly standard. If not stabilized, go around.<\/td><\/tr><tr><td>Touchdown<\/td><td><strong>Main wheels first<\/strong><\/td><td><\/td><\/tr><tr><td>Landing roll<\/td><td><strong>Lower the nose wheel gently<\/strong><\/td><td><\/td><\/tr><tr><td>Braking<\/td><td><strong>AS REQUIRED<\/strong><\/td><td><\/td><\/tr><\/table><\/div>","checks":[{"id":"L4.3:after-touchdown:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.3:after-touchdown:checklist:normal-landing","label":"Checklist \"Normal landing\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Airspeed<\/td><td><strong>65–75 KIAS flaps up, 60–70 KIAS flaps 30°<\/strong><\/td><td><\/td><\/tr><tr><td>Flaps<\/td><td><strong>AS REQUIRED<\/strong><\/td><td>10° below 110 KIAS; more than 10° only below 85 KIAS.<\/td><\/tr><tr><td>Stabilized approach<\/td><td><strong>BY 300 ft AGL<\/strong><\/td><td>The Learn to Fly standard. If not stabilized, go around.<\/td><\/tr><tr><td>Touchdown<\/td><td><strong>Main wheels first<\/strong><\/td><td><\/td><\/tr><tr><td>Landing roll<\/td><td><strong>Lower the nose wheel gently<\/strong><\/td><td><\/td><\/tr><tr><td>Braking<\/td><td><strong>AS REQUIRED<\/strong><\/td><td><\/td><\/tr><\/table>"}]},{"id":"common-errors","title":"Common errors","reading":"<table><tr><th>Error<\/th><th>Result<\/th><th>Fix<\/th><\/tr><tr><td>Approach too fast<\/td><td>Floats down the runway<\/td><td>Hold 65 KIAS on final<\/td><\/tr><tr><td>Flare too high<\/td><td>Drops onto the runway<\/td><td>Round out lower. Go around if it's a big drop<\/td><\/tr><tr><td>Flare too late or too little<\/td><td>Bounces<\/td><td>Start the round-out earlier<\/td><\/tr><tr><td>Looking over the nose<\/td><td>Misjudged height<\/td><td>Look at the far end<\/td><\/tr><\/table><p>If you bounce, don't push the nose down. Add full power and go around. The next lesson covers go-arounds.<\/p>","checks":[{"id":"L4.3:common-errors:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"overall","title":"Overall","checks":[{"id":"L4.3:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Fly a stabilized approach, configured, on speed and on the glide path by 300 ft AGL.<\/li><li>Use the aiming point and the PAPI to judge the glide path.<\/li><li>Round out, flare and touch down on the main wheels near the touchdown zone.<\/li><\/ul>"},{"id":"L4.3:overall:numbers","label":"Every number and V-speed matches the POH and what the sim shows","detail":"<dl><dt>vspeed.approach<\/dt><dd>65 KIAS<\/dd><\/dl>"},{"id":"L4.3:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 9 — Approaches and Landings<\/a><\/li><li><a href=\"https://www.boldmethod.com/learn-to-fly/maneuvers/how-to-perfectly-time-your-flare-and-touchdown/\" target=\"_blank\" rel=\"noopener\">Boldmethod — timing your flare and touchdown<\/a><\/li><\/ul>"},{"id":"L4.3:overall:minutes","label":"Estimated time (25 min) is realistic"}]}]},{"id":"L4.4","type":"lesson","title":"Go-arounds","file":"content/lessons/m4-takeoffs-patterns-landings/l4-4-go-arounds.md","priority":"P0","estimatedMinutes":10,"meta":[{"label":"Summary","value":"When a landing isn't working, go around: early, confidently and in the right order."},{"label":"Prerequisites","value":"L4.3 Normal approach and landing"},{"label":"Challenges","value":"C4.4 Go-around"}],"groups":[{"id":"sim","title":"Sim checks and open markers","hint":"Things that can only be settled in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"L4.4:marker:uwsd3x","label":"Sim check: the sequence matches the POH balked-landing checklist (full throttle, flaps 20°, climb at 60 KIAS, flaps 10° when clear of obstacles, up after a safe altitude and 65 KIAS). Still open: does the sim's EFB checklist say the same, and does the sim Skyhawk climb at 60 KIAS with flaps 20°?","line":57},{"id":"L4.4:tracker:nm23xw","label":"Compare the EFB balked-landing checklist with the POH sequence in the lesson"},{"id":"L4.4:tracker:wj9tdo","label":"Check the sim climbs at 60 KIAS with flaps 20"}]},{"id":"a-normal-maneuver","title":"A normal maneuver","reading":"<p>A <strong>go-around<\/strong> means abandoning a landing and climbing away to try again. It's a good decision. Airline pilots do them routinely, and the pilots who have accidents are usually the ones who tried to save a bad approach instead of going around.<\/p><p>Decide early. The later you decide, the less room you have.<\/p>","checks":[{"id":"L4.4:a-normal-maneuver:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"when-to-go-around","title":"When to go around","reading":"<ul><li>The approach isn't stabilized at 300 ft.<\/li><li>The runway is occupied by another airplane or a vehicle.<\/li><li>You bounce on landing.<\/li><li>The tower tells you to.<\/li><li>Anything doesn't feel right.<\/li><\/ul>","checks":[{"id":"L4.4:when-to-go-around:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"the-sequence-power-attitude-clean-up","title":"The sequence: power, attitude, clean-up","reading":"<ol><li><strong>Power.<\/strong> Full power, immediately. Add right rudder.<\/li><li><strong>Attitude.<\/strong> Raise the nose to the climb attitude. Speed should be around 60 KIAS to begin with.<\/li><li><strong>Flaps to 20°<\/strong> right away, to reduce drag.<\/li><li><strong>Positive climb.<\/strong> Once you're climbing and the speed is increasing, flaps to 10°.<\/li><li><strong>Flaps up<\/strong> once you're clear of obstacles, at a safe altitude and at least 65 KIAS.<\/li><\/ol><div class=\"embed\"><span class=\"tag\">Checklist: Balked landing (go-around)<\/span><table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Throttle<\/td><td><strong>FULL<\/strong><\/td><td><\/td><\/tr><tr><td>Flaps<\/td><td><strong>RETRACT to 20° immediately<\/strong><\/td><td><\/td><\/tr><tr><td>Climb speed<\/td><td><strong>60 KIAS<\/strong><\/td><td><\/td><\/tr><tr><td>Flaps<\/td><td><strong>RETRACT to 10°, then 0°<\/strong><\/td><td>10° once clear of obstacles, then up after reaching a safe altitude and 65 KIAS (POH).<\/td><\/tr><\/table><\/div><div class=\"callout verify\"><span class=\"tag\">Verify (author note)<\/span><p>Sim check: the sequence matches the POH balked-landing checklist (full throttle, flaps 20°, climb at 60 KIAS, flaps 10° when clear of obstacles, up after a safe altitude and 65 KIAS). Still open: does the sim's EFB checklist say the same, and does the sim Skyhawk climb at 60 KIAS with flaps 20°?<\/p><\/div><div class=\"quiz\"><div class=\"prompt\"><p>What's the first action in a go-around?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Full power<\/p><\/li><li class=\"\">☐ <p>Flaps up<\/p><\/li><li class=\"\">☐ <p>Raise the nose<\/p><\/li><li class=\"\">☐ <p>Radio call<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Full power<\/strong> first. Everything else depends on having the power to climb.<\/p><\/div><\/div><div class=\"quiz\"><div class=\"prompt\"><p>Why not raise the flaps from 30° to 0° all at once?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>It would damage the flaps<\/p><\/li><li class=\"correct\">☑ <p>The sudden loss of lift makes the airplane sink<\/p><\/li><li class=\"\">☐ <p>The flap motor is too slow<\/p><\/li><li class=\"\">☐ <p>The stall horn would sound<\/p><\/li><\/ul><div class=\"explain\"><p>Raising all the flaps at once takes away a lot of lift close to the ground, and the airplane sinks. Raise them in stages as the speed builds.<\/p><\/div><\/div>","checks":[{"id":"L4.4:the-sequence-power-attitude-clean-up:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.4:the-sequence-power-attitude-clean-up:checklist:go-around","label":"Checklist \"Balked landing (go-around)\": items and order match the sim's EFB checklist and the POH?","detail":"<table class=\"checklist\"><tr><th>Item<\/th><th>Action<\/th><th>Note<\/th><\/tr><tr><td>Throttle<\/td><td><strong>FULL<\/strong><\/td><td><\/td><\/tr><tr><td>Flaps<\/td><td><strong>RETRACT to 20° immediately<\/strong><\/td><td><\/td><\/tr><tr><td>Climb speed<\/td><td><strong>60 KIAS<\/strong><\/td><td><\/td><\/tr><tr><td>Flaps<\/td><td><strong>RETRACT to 10°, then 0°<\/strong><\/td><td>10° once clear of obstacles, then up after reaching a safe altitude and 65 KIAS (POH).<\/td><\/tr><\/table>"},{"id":"L4.4:the-sequence-power-attitude-clean-up:quiz:l4-4-q1","label":"Quiz l4-4-q1: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>What's the first action in a go-around?<\/p><\/div><ul class=\"options\"><li class=\"correct\">☑ <p>Full power<\/p><\/li><li class=\"\">☐ <p>Flaps up<\/p><\/li><li class=\"\">☐ <p>Raise the nose<\/p><\/li><li class=\"\">☐ <p>Radio call<\/p><\/li><\/ul><div class=\"explain\"><p><strong>Full power<\/strong> first. Everything else depends on having the power to climb.<\/p><\/div><\/div>"},{"id":"L4.4:the-sequence-power-attitude-clean-up:quiz:l4-4-q2","label":"Quiz l4-4-q2: question, answer and explanation correct?","detail":"<div class=\"quiz\"><div class=\"prompt\"><p>Why not raise the flaps from 30° to 0° all at once?<\/p><\/div><ul class=\"options\"><li class=\"\">☐ <p>It would damage the flaps<\/p><\/li><li class=\"correct\">☑ <p>The sudden loss of lift makes the airplane sink<\/p><\/li><li class=\"\">☐ <p>The flap motor is too slow<\/p><\/li><li class=\"\">☐ <p>The stall horn would sound<\/p><\/li><\/ul><div class=\"explain\"><p>Raising all the flaps at once takes away a lot of lift close to the ground, and the airplane sinks. Raise them in stages as the speed builds.<\/p><\/div><\/div>"}]},{"id":"where-to-fly","title":"Where to fly","reading":"<p>At a non-towered airport, <strong>side-step<\/strong> slightly to the side of the runway (usually the right side for a left pattern) as you climb. That lets you see any airplane departing below you. Then rejoin the pattern on crosswind.<\/p><p>To watch the go-around in the traffic pattern animation below, press <strong>Go around<\/strong>.<\/p><div class=\"widget\">⚙ Widget W7 (traffic-pattern, calls=true): open it on the site to check it.<\/div>","checks":[{"id":"L4.4:where-to-fly:text","label":"Text, numbers and procedure in this section are correct and clear"},{"id":"L4.4:where-to-fly:widget:traffic-pattern:calls=true","label":"Widget W7 (traffic-pattern, calls=true): shows the right thing and matches the lesson text?"}]},{"id":"the-radio-call","title":"The radio call","reading":"<p>At a non-towered airport, tell everyone:<\/p><blockquote><p>&quot;Livermore traffic, Skyhawk 123, going around, runway 25 Right.&quot;<\/p><\/blockquote><p>At a towered airport, the tower may tell you to go around, or you tell them: &quot;Livermore Tower, Skyhawk 123, going around.&quot;<\/p>","checks":[{"id":"L4.4:the-radio-call:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"common-errors","title":"Common errors","reading":"<ul><li><strong>Forgetting right rudder<\/strong> as full power comes in.<\/li><li><strong>Pitching too high<\/strong> with full flaps still out, so the airspeed drops and the stall horn sounds.<\/li><li><strong>Retracting all the flaps at once<\/strong>, so the airplane sinks.<\/li><\/ul><p>Practice it in <span class=\"ilink\" title=\"/challenges/c4-4-go-around\">C4.4 Go-around<\/span>.<\/p>","checks":[{"id":"L4.4:common-errors:text","label":"Text, numbers and procedure in this section are correct and clear"}]},{"id":"overall","title":"Overall","checks":[{"id":"L4.4:overall:objectives","label":"The lesson actually teaches its stated objectives","detail":"<ul><li>Decide early and fly a go-around without hesitation.<\/li><li>Apply the go-around sequence of power, attitude and clean-up.<\/li><\/ul>"},{"id":"L4.4:overall:numbers","label":"Every number and V-speed matches the POH and what the sim shows","detail":"<dl><dt>vspeed.goAround<\/dt><dd>60 KIAS<\/dd><\/dl>"},{"id":"L4.4:overall:resources","label":"Go deeper links open and still say what we claim","detail":"<ul><li><a href=\"https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/airplane_handbook\" target=\"_blank\" rel=\"noopener\">AFH Chapter 9 — Approaches and Landings<\/a><\/li><\/ul>"},{"id":"L4.4:overall:minutes","label":"Estimated time (10 min) is realistic"}]}]},{"id":"C4.1","type":"challenge","title":"Normal takeoff and departure","file":"content/challenges/c4-1-normal-takeoff-and-departure.yaml","priority":"P0","estimatedMinutes":15,"meta":[{"label":"Goal","value":"Take off on the centerline, rotate at 55 KIAS, climb at Vy and depart the pattern."},{"label":"Type","value":"manoeuvre, difficulty 2/5"},{"label":"Lessons","value":"L4.1 Normal takeoff and climb"}],"groups":[{"id":"sim","title":"Open markers and tracker notes","hint":"Settle each one in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"C4.1:marker:10ag173","label":"runway: 25R — ⚠ verify — Sim check: real-world 7L/25R (AirNav 2026-10-13); confirm the sim lists it as 25R","line":33},{"id":"C4.1:tracker:6k4rms","label":"Runway name"},{"id":"C4.1:tracker:towdkv","label":"With ATC off, confirm a 45 degree right turn from the 25R upwind at 1,400 ft is sensible"},{"id":"C4.1:tracker:1jbdknh","label":"Time it"}]},{"id":"setup","title":"Setup: can every field be set exactly as written?","hint":"Start the sim fresh and set up only from the brief. Note any menu name that differs.","checks":[{"id":"C4.1:setup:start","label":"Start: RUNWAY at KLVK","detail":"<dl><dt>label<\/dt><dd>On the runway<\/dd><dt>description<\/dt><dd>Lined up on the named runway, engine running, ready for takeoff. On the world map, pick the airport's large circle, or the named runway.<\/dd><\/dl>"},{"id":"C4.1:setup:runway","label":"Runway 25R"},{"id":"C4.1:setup:fallback","label":"Fallback: If the sim starts you on a different runway, use it and depart with a 45° turn in the direction of that runway's pattern."},{"id":"C4.1:setup:weather","label":"Weather: WX_LIGHT_W","detail":"<dl><dt>label<\/dt><dd>Light westerly<\/dd><dt>summary<\/dt><dd>Clear skies with a light westerly wind.<\/dd><dt>clouds<\/dt><dd>Clear<\/dd><dt>surfaceWind<\/dt><dd>250° at 8 kt<\/dd><dt>windsAloft<\/dt><dd>270° at 15 kt (3,000 ft), 280° at 20 kt (6,000 ft)<\/dd><dt>visibility<\/dt><dd>10 sm or more<\/dd><dt>temperatureC<\/dt><dd>18<\/dd><dt>altimeterInHg<\/dt><dd>30<\/dd><\/dl>"},{"id":"C4.1:setup:time","label":"Time 10:00 local, date late-spring","detail":"<dl><dt>label<\/dt><dd>Late spring<\/dd><dt>date<\/dt><dd>15 May<\/dd><\/dl>"},{"id":"C4.1:setup:load","label":"Load: LOAD_SOLO","detail":"<dl><dt>label<\/dt><dd>Solo<\/dd><dt>description<\/dt><dd>Pilot 170 lb, no passengers, 75% fuel (about 40 gal). Set it in the EFB (TAB) under Flight planner, on the Payload &amp; fuel page. Fuel is in pounds (6 lb a gallon), so set Extra fuel to about 230 lb for a block fuel near 240 lb, then press LOAD. The default is only 10 lb.<\/dd><\/dl>"},{"id":"C4.1:setup:assistance","label":"Assistance: training","detail":"<dl><dt>label<\/dt><dd>Learn to Fly Training profile<\/dd><dt>description<\/dt><dd>Auto-Rudder, AI Auto-Trim and path aids off, whatever your controller (gamepads use the LT and RT triggers for rudder). Lesson 0.2 lists every setting.<\/dd><\/dl>"},{"id":"C4.1:setup:switches","label":"AI traffic off, ATC off, crash damage on"}]},{"id":"procedure","title":"Procedure: fly it exactly as written","hint":"Mark any step that is ambiguous, impossible or in the wrong order.","checks":[{"id":"C4.1:step:1cjndt2","label":"Step 1: Quick re-check of the before-takeoff checklist."},{"id":"C4.1:step:1lcv1lv","label":"Step 2: Full power smoothly. Call \"airspeed alive\" and check the engine gauges are green."},{"id":"C4.1:step:55ccd3","label":"Step 3: Rotate at 55 KIAS and climb at 74 KIAS. Use right rudder as needed."},{"id":"C4.1:step:1fmkw3d","label":"Step 4: Climb straight out to pattern altitude (about 1,400 ft MSL at Livermore), then make a 45° right turn to depart, because runway 25R has right traffic. Continue the climb to 3,000 ft MSL at 80 KIAS."}]},{"id":"criteria","title":"Criteria: measurable from inside the sim?","hint":"Each criterion must be checkable from the PFD, the clock, the replay or a map trail, and the tiers must make sense.","checks":[{"id":"C4.1:criterion:centerline-roll","label":"Centerline tracking on the takeoff roll (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 3<\/dd><dt>Gold<\/dt><dd>Within ½ wingspan<\/dd><dt>Silver<\/dt><dd>Within 1 wingspan<\/dd><dt>Bronze<\/dt><dd>Stayed on the runway<\/dd><dt>Review link<\/dt><dd>L4.1 Normal takeoff and climb → right-rudder<\/dd><\/dl>"},{"id":"C4.1:criterion:rotation-speed","label":"Rotation speed (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 2<\/dd><dt>Gold<\/dt><dd>55 ±3 KIAS<\/dd><dt>Silver<\/dt><dd>55 ±5 KIAS<\/dd><dt>Bronze<\/dt><dd>55 ±10 KIAS<\/dd><dt>Review link<\/dt><dd>L4.1 Normal takeoff and climb → rotate-and-climb<\/dd><\/dl>"},{"id":"C4.1:criterion:climb-speed","label":"Climb airspeed (Vy) (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 3<\/dd><dt>Gold<\/dt><dd>74 ±5 KIAS<\/dd><dt>Silver<\/dt><dd>74 ±10 KIAS<\/dd><dt>Bronze<\/dt><dd>74 ±15 KIAS<\/dd><dt>Review link<\/dt><dd>L4.1 Normal takeoff and climb → rotate-and-climb<\/dd><\/dl>"},{"id":"C4.1:criterion:runway-heading","label":"Runway heading held on the initial climb (wind corrected)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 1<\/dd><dt>Gold<\/dt><dd>±5°<\/dd><dt>Silver<\/dt><dd>±10°<\/dd><dt>Bronze<\/dt><dd>±15°<\/dd><\/dl>"},{"id":"C4.1:criterion:departure-turn","label":"Departure turn at the correct altitude and point","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 1<\/dd><dt>Review link<\/dt><dd>L4.1 Normal takeoff and climb → leaving-the-pattern<\/dd><\/dl>"},{"id":"C4.1:criterion:callouts","label":"Callouts spoken (\"airspeed alive\", \"55, rotate\")","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 1<\/dd><\/dl>"}]},{"id":"extras","title":"Goal, tips and debrief","checks":[{"id":"C4.1:goal","label":"Goal is clear and matches the criteria","detail":"<p>Take off on the centerline, rotate at 55 KIAS, climb at Vy and depart the pattern.<\/p>"},{"id":"C4.1:mistakes","label":"Common mistakes are the ones you actually see","detail":"<ul><li>Yanking the nose up at rotation.<\/li><li>Drifting left on the takeoff roll.<\/li><li>Forgetting to trim in the climb.<\/li><\/ul>"},{"id":"C4.1:tips","label":"Tips are correct and useful","detail":"<ul><li>Say the callouts out loud. It keeps your eyes moving between the runway and the airspeed tape.<\/li><\/ul>"},{"id":"C4.1:debrief","label":"Debrief questions fit the flight","detail":"<ul><li>Where was the nose pointing at rotation?<\/li><li>Did you need right rudder? How much?<\/li><\/ul>"}]},{"id":"flight","title":"Flight record (protocol 54.3)","hint":"Record the tier and the minutes it took in the fields above, then tick these.","checks":[{"id":"C4.1:flight:fresh","label":"Flown from the brief only, after a fresh sim start"},{"id":"C4.1:flight:timed","label":"Timed it (estimate is 15 min)"},{"id":"C4.1:flight:badly","label":"Flown deliberately badly once: the rubric separates Bronze from Gold"},{"id":"C4.1:flight:screens","label":"Screenshots taken where the brief or lesson needs one (or none needed)"}]}]},{"id":"C4.2","type":"challenge","title":"Fly the pattern","file":"content/challenges/c4-2-fly-the-pattern.yaml","priority":"P0","estimatedMinutes":20,"meta":[{"label":"Goal","value":"Fly a complete rectangular pattern at Tracy with the correct altitudes, speeds and configuration, ending in a low approach. No landing required."},{"label":"Type","value":"pattern, difficulty 3/5"},{"label":"Lessons","value":"L4.2 The traffic pattern"}],"groups":[{"id":"sim","title":"Open markers and tracker notes","hint":"Settle each one in the sim. Tick OK when confirmed, or Issue and write what you found.","checks":[{"id":"C4.2:marker:1qvgwv0","label":"runway: '26' — ⚠ verify — Sim check: 26 (255° magnetic) faces the preset's 250°/8 kt wind (AirNav 2026-10-13); confirm the sim offers it as a start","line":34},{"id":"C4.2:tracker:je1gt3","label":"Runway in use for the WX_LIGHT_W wind"},{"id":"C4.2:tracker:2t01b1","label":"Pattern altitude about 1,000 ft MSL"},{"id":"C4.2:tracker:1jbdknh","label":"Time it"}]},{"id":"setup","title":"Setup: can every field be set exactly as written?","hint":"Start the sim fresh and set up only from the brief. Note any menu name that differs.","checks":[{"id":"C4.2:setup:start","label":"Start: RUNWAY at KTCY","detail":"<dl><dt>label<\/dt><dd>On the runway<\/dd><dt>description<\/dt><dd>Lined up on the named runway, engine running, ready for takeoff. On the world map, pick the airport's large circle, or the named runway.<\/dd><\/dl>"},{"id":"C4.2:setup:runway","label":"Runway 26"},{"id":"C4.2:setup:fallback","label":"Fallback: If the sim starts you on a different runway, fly the pattern for that runway instead."},{"id":"C4.2:setup:weather","label":"Weather: WX_LIGHT_W","detail":"<dl><dt>label<\/dt><dd>Light westerly<\/dd><dt>summary<\/dt><dd>Clear skies with a light westerly wind.<\/dd><dt>clouds<\/dt><dd>Clear<\/dd><dt>surfaceWind<\/dt><dd>250° at 8 kt<\/dd><dt>windsAloft<\/dt><dd>270° at 15 kt (3,000 ft), 280° at 20 kt (6,000 ft)<\/dd><dt>visibility<\/dt><dd>10 sm or more<\/dd><dt>t
