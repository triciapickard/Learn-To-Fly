at KTCY","detail":"<dl><dt>label<\/dt><dd>On the runway<\/dd><dt>description<\/dt><dd>Lined up on the named runway, engine running, ready for takeoff. On the world map, pick the airport's large circle, or the named runway.<\/dd><\/dl>"},{"id":"C4.7:setup:runway","label":"Runway 26"},{"id":"C4.7:setup:fallback","label":"Fallback: If the sim starts you on a different runway, fly the pattern for that runway instead."},{"id":"C4.7:setup:weather","label":"Weather: WX_LIGHT_W","detail":"<dl><dt>label<\/dt><dd>Light westerly<\/dd><dt>summary<\/dt><dd>Clear skies with a light westerly wind.<\/dd><dt>clouds<\/dt><dd>Clear<\/dd><dt>surfaceWind<\/dt><dd>250° at 8 kt<\/dd><dt>windsAloft<\/dt><dd>270° at 15 kt (3,000 ft), 280° at 20 kt (6,000 ft)<\/dd><dt>visibility<\/dt><dd>10 sm or more<\/dd><dt>temperatureC<\/dt><dd>18<\/dd><dt>altimeterInHg<\/dt><dd>30<\/dd><\/dl>"},{"id":"C4.7:setup:time","label":"Time 10:00 local, date late-spring","detail":"<dl><dt>label<\/dt><dd>Late spring<\/dd><dt>date<\/dt><dd>15 May<\/dd><\/dl>"},{"id":"C4.7:setup:load","label":"Load: LOAD_SOLO","detail":"<dl><dt>label<\/dt><dd>Solo<\/dd><dt>description<\/dt><dd>Pilot 170 lb, no passengers, 75% fuel (about 40 gal). Set it in the EFB (TAB) under Flight planner, on the Payload &amp; fuel page. Fuel is in pounds (6 lb a gallon), so set Extra fuel to about 230 lb for a block fuel near 240 lb, then press LOAD. The default is only 10 lb.<\/dd><\/dl>"},{"id":"C4.7:setup:assistance","label":"Assistance: training","detail":"<dl><dt>label<\/dt><dd>Learn to Fly Training profile<\/dd><dt>description<\/dt><dd>Auto-Rudder, AI Auto-Trim and path aids off, whatever your controller (gamepads use the LT and RT triggers for rudder). Lesson 0.2 lists every setting.<\/dd><\/dl>"},{"id":"C4.7:setup:switches","label":"AI traffic off, ATC off, crash damage on"}]},{"id":"procedure","title":"Procedure: fly it exactly as written","hint":"Mark any step that is ambiguous, impossible or in the wrong order.","checks":[{"id":"C4.7:step:oqj0mn","label":"Step 1: Take off and fly the pattern for runway 26."},{"id":"C4.7:step:51erd2","label":"Step 2: Land. For a touch-and-go, keep rolling on the centerline, raise the flaps, add full power and take off again."},{"id":"C4.7:step:qu5k8k","label":"Step 3: Fly the second pattern and do another touch-and-go."},{"id":"C4.7:step:hyobsz","label":"Step 4: Fly the third pattern and make a full-stop landing."},{"id":"C4.7:step:hy47ak","label":"Step 5: Some instructors prefer a full stop and taxi back instead of a touch-and-go. Either is fine here. The touch-and-go criterion is optional."}]},{"id":"criteria","title":"Criteria: measurable from inside the sim?","hint":"Each criterion must be checkable from the PFD, the clock, the replay or a map trail, and the tiers must make sense.","checks":[{"id":"C4.7:criterion:pattern-altitude","label":"Pattern altitude on each downwind (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 2<\/dd><dt>Gold<\/dt><dd>±100 ft<\/dd><dt>Silver<\/dt><dd>±150 ft<\/dd><dt>Bronze<\/dt><dd>±200 ft<\/dd><dt>Review link<\/dt><dd>L4.2 The traffic pattern → direction-and-altitude<\/dd><\/dl>"},{"id":"C4.7:criterion:stabilized","label":"Stabilized on each final (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 3<\/dd><dt>Gold<\/dt><dd>3 of 3<\/dd><dt>Silver<\/dt><dd>2 of 3<\/dd><dt>Bronze<\/dt><dd>1 of 3 (went around on the others)<\/dd><dt>Review link<\/dt><dd>L4.3 Normal approach and landing → the-stabilized-approach<\/dd><\/dl>"},{"id":"C4.7:criterion:landing-quality","label":"Landing quality on each landing (C4.3 touchdown point, centerline and no bounce) (required)","detail":"<dl><dt>Kind<\/dt><dd>tiered, weight 3<\/dd><dt>Gold<\/dt><dd>All three Gold<\/dd><dt>Silver<\/dt><dd>All Silver or better<\/dd><dt>Bronze<\/dt><dd>All Bronze or better<\/dd><dt>Review link<\/dt><dd>L4.3 Normal approach and landing → the-round-out-and-flare<\/dd><\/dl>"},{"id":"C4.7:criterion:touch-and-go","label":"Touch-and-go sequence correct","detail":"<dl><dt>Kind<\/dt><dd>binary, weight 2<\/dd><\/dl>"}]},{"id":"extras","title":"Goal, tips and debrief","checks":[{"id":"C4.7:goal","label":"Goal is clear and matches the criteria","detail":"<p>Fly three patterns in a row (touch-and-go, touch-and-go, full stop) with consistent quality.<\/p>"},{"id":"C4.7:mistakes","label":"Common mistakes are the ones you actually see","detail":"<ul><li>Adding power before the flaps are up on a touch-and-go.<\/li><li>Letting the pattern get bigger with each circuit.<\/li><\/ul>"},{"id":"C4.7:tips","label":"Tips are correct and useful","detail":"<ul><li>Use the same ground references for your turns on every circuit.<\/li><\/ul>"},{"id":"C4.7:debrief","label":"Debrief questions fit the flight","detail":"<ul><li>Which circuit was best, and what was different about it?<\/li><\/ul>"}]},{"id":"flight","title":"Flight record (protocol 54.3)","hint":"Record the tier and the minutes it took in the fields above, then tick these.","checks":[{"id":"C4.7:flight:fresh","label":"Flown from the brief only, after a fresh sim start"},{"id":"C4.7:flight:timed","label":"Timed it (estimate is 30 min)"},{"id":"C4.7:flight:badly","label":"Flown deliberately badly once: the rubric separates Bronze from Gold"},{"id":"C4.7:flight:screens","label":"Screenshots taken where the brief or lesson needs one (or none needed)"}]}]}]}]}
    </script>
    <script>
      (function () {
        'use strict';
        var DATA = JSON.parse(document.getElementById('ltf-data').textContent);
        var MODULES = DATA.modules;
        var ITEMS = [];
        MODULES.forEach(function (m) {
          m.items.forEach(function (it) {
            it.module = m.code;
            ITEMS.push(it);
          });
        });
        var KEY =
          'ltf-verifier:' +
          MODULES.map(function (m) {
            return m.code;
          }).join('-');
        var VERDICTS = ['ok', 'issue', 'skip'];
        var LABELS = { ok: 'OK', issue: 'Issue', skip: 'Skip' };
        var MARKS = { ok: '[OK]', issue: '[ISSUE]', skip: '[SKIP]' };

        /* ---------------- state ---------------- */
        var state = load();
        function blank() {
          return {
            simVersion: DATA.simVersion,
            checks: {},
            items: {},
            ui: { selected: ITEMS[0] ? ITEMS[0].id : null, hidden: {} },
          };
        }
        function load() {
          try {
            var raw = localStorage.getItem(KEY);
            if (raw) {
              var s = JSON.parse(raw);
              if (s && s.checks && s.items) {
                s.ui = s.ui || {};
                s.ui.hidden = s.ui.hidden || {};
                if (!s.ui.selected) s.ui.selected = ITEMS[0] ? ITEMS[0].id : null;
                if (!s.simVersion) s.simVersion = DATA.simVersion;
                return s;
              }
            }
          } catch (e) {
            /* storage unavailable: work in memory */
          }
          return blank();
        }
        var saveTimer = null;
        function save() {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(function () {
            try {
              localStorage.setItem(KEY, JSON.stringify(state));
            } catch (e) {
              toast('Could not save to this browser. Use "Save progress to a file".');
            }
          }, 150);
        }
        function check(id) {
          return state.checks[id] || { v: null, n: '' };
        }
        function setCheck(id, patch) {
          var c = state.checks[id] || { v: null, n: '' };
          Object.keys(patch).forEach(function (k) {
            c[k] = patch[k];
          });
          if (!c.v && !c.n) delete state.checks[id];
          else state.checks[id] = c;
          touchItemDate(id.split(':')[0]);
          save();
        }
        function rec(itemId) {
          return (
            state.items[itemId] ||
            (state.items[itemId] = { date: '', tier: '', minutes: '', notes: '' })
          );
        }
        function touchItemDate(itemId) {
          var r = rec(itemId);
          if (!r.date) r.date = today();
        }
        function today() {
          var d = new Date();
          return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }
        function pad(n) {
          return (n < 10 ? '0' : '') + n;
        }

        /* ---------------- stats ---------------- */
        function itemChecks(it) {
          var out = [];
          it.groups.forEach(function (g) {
            g.checks.forEach(function (c) {
              out.push(c);
            });
          });
          return out;
        }
        function stats(checks) {
          var s = { total: checks.length, ok: 0, issue: 0, skip: 0, open: 0 };
          checks.forEach(function (c) {
            var v = check(c.id).v;
            if (v) s[v]++;
            else s.open++;
          });
          return s;
        }
        function itemStatus(it) {
          var s = stats(itemChecks(it));
          if (s.issue) return 'issue';
          if (s.open === 0 && s.total > 0) return 'done';
          if (s.open < s.total) return 'partial';
          return 'none';
        }
        function statusWord(it) {
          return {
            issue: 'Needs changes',
            done: 'Verified',
            partial: 'In progress',
            none: 'Not started',
          }[itemStatus(it)];
        }

        /* ---------------- rendering ---------------- */
        var $ = function (id) {
          return document.getElementById(id);
        };
        function el(tag, attrs, children) {
          var e = document.createElement(tag);
          if (attrs)
            Object.keys(attrs).forEach(function (k) {
              if (k === 'class') e.className = attrs[k];
              else if (k === 'html') e.innerHTML = attrs[k];
              else if (k === 'text') e.textContent = attrs[k];
              else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
              else e.setAttribute(k, attrs[k]);
            });
          (children || []).forEach(function (c) {
            if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
          });
          return e;
        }

        function renderTop() {
          $('brandSub').textContent =
            MODULES.map(function (m) {
              return m.code;
            }).join(' · ') +
            ' · built ' +
            DATA.generatedAt;
          var all = [];
          ITEMS.forEach(function (it) {
            all = all.concat(itemChecks(it));
          });
          var s = stats(all);
          var bar = $('bar');
          bar.innerHTML = '';
          ['ok', 'issue', 'skip'].forEach(function (v) {
            var i = document.createElement('i');
            i.className = v;
            i.style.width = (s.total ? (100 * s[v]) / s.total : 0) + '%';
            bar.appendChild(i);
          });
          $('progressText').textContent =
            s.total -
            s.open +
            ' / ' +
            s.total +
            ' checked · ' +
            s.issue +
            ' issue' +
            (s.issue === 1 ? '' : 's');
        }

        function renderSidebar() {
          var nav = $('sidebar');
          nav.innerHTML = '';
          MODULES.forEach(function (m) {
            nav.appendChild(el('h2', { text: m.code + ' · ' + m.title }));
            m.items.forEach(function (it) {
              var s = stats(itemChecks(it));
              var b = el(
                'button',
                {
                  class: 'nav-item' + (state.ui.selected === it.id ? ' active' : ''),
                  onclick: function () {
                    select(it.id);
                  },
                },
                [
                  el('span', { class: 'dot ' + itemStatus(it) }),
                  el('span', { class: 'code', text: it.id }),
                  el('span', { class: 'name', text: it.title, title: it.title }),
                  el('span', { class: 'count', text: s.total - s.open + '/' + s.total }),
                ],
              );
              nav.appendChild(b);
            });
          });
        }

        function select(id) {
          state.ui.selected = id;
          save();
          renderSidebar();
          renderMain();
          $('main').scrollTop = 0;
        }

        function renderMain() {
          var main = $('main');
          main.innerHTML = '';
          var it = ITEMS.filter(function (x) {
            return x.id === state.ui.selected;
          })[0];
          if (!it) {
            main.appendChild(
              el('div', { class: 'empty', text: 'Pick a lesson or challenge on the left.' }),
            );
            return;
          }
          var r = rec(it.id);

          var head = el('div', { class: 'item-head' });
          head.appendChild(
            el('h1', {}, [
              el('span', { class: 'code', text: it.id }),
              it.title,
              el('span', { class: 'chip', text: it.type }),
              el('span', {
                class: 'chip',
                text: it.priority + ' · ' + it.estimatedMinutes + ' min',
              }),
              el('span', { class: 'chip ' + itemStatus(it), text: statusWord(it) }),
            ]),
          );
          head.appendChild(el('div', { class: 'filepath' }, [el('code', { text: it.file })]));
          var dl = el('dl', { class: 'meta' });
          it.meta.forEach(function (m) {
            dl.appendChild(el('dt', { text: m.label }));
            dl.appendChild(el('dd', { text: m.value }));
          });
          head.appendChild(dl);
          main.appendChild(head);

          var record = el('div', { class: 'card record' });
          record.appendChild(
            el('label', {}, [
              'Date checked',
              el('input', {
                class: 'input mono',
                type: 'date',
                value: r.date,
                onchange: function (e) {
                  r.date = e.target.value;
                  save();
                },
              }),
            ]),
          );
          if (it.type === 'challenge') {
            var sel = el('select', {
              class: 'input',
              onchange: function (e) {
                r.tier = e.target.value;
                touchItemDate(it.id);
                save();
              },
            });
            ['', 'Gold', 'Silver', 'Bronze', 'Fail', 'Not flown'].forEach(function (t) {
              var o = el('option', { value: t, text: t || '—' });
              if (r.tier === t) o.selected = true;
              sel.appendChild(o);
            });
            record.appendChild(el('label', {}, ['Tier flown', sel]));
            record.appendChild(
              el('label', {}, [
                'Minutes taken (est. ' + it.estimatedMinutes + ')',
                el('input', {
                  class: 'input mono',
                  type: 'number',
                  min: '0',
                  style: 'width:90px',
                  value: r.minutes,
                  oninput: function (e) {
                    r.minutes = e.target.value;
                    touchItemDate(it.id);
                    save();
                  },
                }),
              ]),
            );
          }
          record.appendChild(
            el('label', { class: 'wide' }, [
              'General notes for ' + it.id + ' (anything that does not fit a single check)',
              el('textarea', {
                class: 'input',
                oninput: function (e) {
                  r.notes = e.target.value;
                  touchItemDate(it.id);
                  save();
                },
                text: r.notes,
              }),
            ]),
          );
          main.appendChild(record);

          it.groups.forEach(function (g) {
            main.appendChild(renderGroup(it, g));
          });

          var idx = ITEMS.indexOf(it);
          var nav = el('div', { class: 'footer-nav' });
          nav.appendChild(
            idx > 0
              ? el('button', {
                  class: 'btn',
                  text: '← ' + ITEMS[idx - 1].id,
                  onclick: function () {
                    select(ITEMS[idx - 1].id);
                  },
                })
              : el('span'),
          );
          nav.appendChild(
            idx < ITEMS.length - 1
              ? el('button', {
                  class: 'btn',
                  text: ITEMS[idx + 1].id + ' →',
                  onclick: function () {
                    select(ITEMS[idx + 1].id);
                  },
                })
              : el('span'),
          );
          main.appendChild(nav);
        }

        function renderGroup(it, g) {
          var key = it.id + ':' + g.id;
          var s = stats(g.checks);
          var box = el('section', { class: 'card group' });
          var h = el('div', { class: 'group-head' });
          var title = el('h2', { text: g.title });
          if (g.hint) title.appendChild(el('span', { class: 'hint', text: g.hint }));
          h.appendChild(title);
          h.appendChild(el('span', { class: 'gcount', text: s.total - s.open + '/' + s.total }));
          if (g.reading) {
            var hidden = !!state.ui.hidden[key];
            var t = el('button', { class: 'toggle', text: hidden ? 'Show text' : 'Hide text' });
            t.addEventListener('click', function () {
              state.ui.hidden[key] = !state.ui.hidden[key];
              save();
              reading.classList.toggle('hidden', !!state.ui.hidden[key]);
              t.textContent = state.ui.hidden[key] ? 'Show text' : 'Hide text';
            });
            h.appendChild(t);
          }
          h.appendChild(
            el('button', {
              class: 'toggle',
              text: 'All OK',
              title: 'Mark every unchecked item in this group OK',
              onclick: function () {
                g.checks.forEach(function (c) {
                  if (!check(c.id).v) setCheck(c.id, { v: 'ok' });
                });
                refresh();
              },
            }),
          );
          box.appendChild(h);
          var reading = null;
          if (g.reading) {
            reading = el('div', {
              class: 'reading' + (state.ui.hidden[key] ? ' hidden' : ''),
              html: g.reading,
            });
            box.appendChild(reading);
          }
          g.checks.forEach(function (c) {
            box.appendChild(renderCheck(c));
          });
          return box;
        }

        function renderCheck(c) {
          var cur = check(c.id);
          var row = el('div', { class: 'check' + (cur.v === 'issue' ? ' issue' : '') });
          var label = el('div', { class: 'label' }, [c.label]);
          if (c.line) label.appendChild(el('span', { class: 'line', text: 'line ' + c.line }));
          var detail = null;
          if (c.detail) {
            detail = el('div', { class: 'detail', html: c.detail });
            label.appendChild(
              el('button', {
                class: 'more',
                text: 'Show',
                onclick: function (e) {
                  detail.classList.toggle('open');
                  e.target.textContent = detail.classList.contains('open') ? 'Hide' : 'Show';
                },
              }),
            );
          }
          var noteWrap = el('div', { class: 'note' });
          var ta = el('textarea', {
            placeholder: 'What is different, wrong or unclear? What should it say instead?',
            text: cur.n,
          });
          ta.addEventListener('input', function () {
            setCheck(c.id, { n: ta.value });
            renderTop();
            renderSidebar();
          });
          noteWrap.appendChild(ta);
          noteWrap.style.display = cur.v === 'issue' || cur.n ? 'block' : 'none';
          if (cur.v !== 'issue' && !cur.n) {
            label.appendChild(
              el('button', {
                class: 'more',
                text: 'Note',
                onclick: function () {
                  noteWrap.style.display = 'block';
                  ta.focus();
                },
              }),
            );
          }
          var seg = el('div', { class: 'seg' });
          VERDICTS.forEach(function (v) {
            var b = el('button', { class: v + (cur.v === v ? ' on' : ''), text: LABELS[v] });
            b.addEventListener('click', function () {
              setCheck(c.id, { v: cur.v === v ? null : v });
              var fresh = renderCheck(c);
              row.replaceWith(fresh);
              if (check(c.id).v === 'issue') fresh.querySelector('textarea').focus();
              renderTop();
              renderSidebar();
            });
            seg.appendChild(b);
          });
          row.appendChild(label);
          row.appendChild(seg);
          if (detail) row.appendChild(detail);
          row.appendChild(noteWrap);
          return row;
        }

        function refresh() {
          renderTop();
          renderSidebar();
          renderMain();
        }

        /* ---------------- report ---------------- */
        function wrap(text, width, indent) {
          var words = String(text).replace(/\s+/g, ' ').trim().split(' ');
          var lines = [],
            line = '';
          words.forEach(function (w) {
            if ((line + ' ' + w).trim().length > width && line) {
              lines.push(line);
              line = w;
            } else line = (line ? line + ' ' : '') + w;
          });
          if (line) lines.push(line);
          return lines
            .map(function (l, i) {
              return (i === 0 ? '' : indent) + l;
            })
            .join('\n');
        }
        function padEnd(s, n) {
          s = String(s);
          while (s.length < n) s += ' ';
          return s;
        }
        function rule(ch) {
          return new Array(81).join(ch);
        }
        function groupTitle(it, c) {
          var found = '';
          it.groups.forEach(function (g) {
            if (g.checks.indexOf(c) >= 0) found = g.title;
          });
          return found;
        }
        function report(issuesOnly) {
          var out = [];
          var now = new Date();
          var all = [];
          ITEMS.forEach(function (it) {
            all = all.concat(itemChecks(it));
          });
          var s = stats(all);
          out.push('LEARN TO FLY — VERIFICATION REPORT');
          out.push(
            'Modules: ' +
              MODULES.map(function (m) {
                return m.code + ' ' + m.title;
              }).join(' · '),
          );
          out.push(
            'Sim: MSFS 2024 ' +
              (state.simVersion || '?') +
              ' · Exported: ' +
              today() +
              ' ' +
              pad(now.getHours()) +
              ':' +
              pad(now.getMinutes()) +
              ' · Checklist built: ' +
              DATA.generatedAt,
          );
          out.push(
            'Progress: ' +
              (s.total - s.open) +
              ' of ' +
              s.total +
              ' checks done · ' +
              s.ok +
              ' OK · ' +
              s.issue +
              ' issues · ' +
              s.skip +
              ' skipped · ' +
              s.open +
              ' not yet checked',
          );
          out.push(rule('='));
          out.push('');
          out.push('SUMMARY');
          out.push(
            padEnd('Item', 7) +
              padEnd('Status', 15) +
              padEnd('OK', 5) +
              padEnd('Issue', 7) +
              padEnd('Skip', 6) +
              padEnd('Open', 6) +
              padEnd('Tier', 10) +
              padEnd('Min', 5) +
              'Date',
          );
          ITEMS.forEach(function (it) {
            var st = stats(itemChecks(it)),
              r = rec(it.id);
            out.push(
              padEnd(it.id, 7) +
                padEnd(statusWord(it), 15) +
                padEnd(st.ok, 5) +
                padEnd(st.issue, 7) +
                padEnd(st.skip, 6) +
                padEnd(st.open, 6) +
                padEnd(r.tier || '-', 10) +
                padEnd(r.minutes || '-', 5) +
                (r.date || '-'),
            );
          });
          out.push('');
          out.push(rule('='));
          out.push('ISSUES TO FIX  (every check marked Issue, with what was found)');
          out.push(rule('='));
          var anyIssue = false;
          ITEMS.forEach(function (it) {
            var r = rec(it.id);
            var issues = itemChecks(it).filter(function (c) {
              return check(c.id).v === 'issue';
            });
            if (!issues.length && !(r.notes && r.notes.trim())) return;
            anyIssue = true;
            out.push('');
            out.push(
              it.id +
                '  ' +
                it.title +
                (r.date
                  ? '   (checked ' +
                    r.date +
                    (r.tier ? ', ' + r.tier : '') +
                    (r.minutes ? ', ' + r.minutes + ' min' : '') +
                    ')'
                  : ''),
            );
            out.push('      ' + it.file);
            issues.forEach(function (c) {
              out.push(
                '  ✗ ' +
                  wrap(
                    '[' + groupTitle(it, c) + (c.line ? ' · line ' + c.line : '') + '] ' + c.label,
                    74,
                    '    ',
                  ),
              );
              var n = check(c.id).n;
              out.push(
                '      → ' + (n && n.trim() ? wrap(n, 70, '        ') : '(no note written)'),
              );
            });
            if (r.notes && r.notes.trim())
              out.push('  General notes: ' + wrap(r.notes, 62, '                 '));
          });
          if (!anyIssue) out.push('', '  None so far.');
          out.push('');
          out.push(rule('='));
          out.push('OTHER COMMENTS  (notes on checks marked OK or Skip)');
          out.push(rule('='));
          var anyOther = false;
          ITEMS.forEach(function (it) {
            var others = itemChecks(it).filter(function (c) {
              var k = check(c.id);
              return k.v !== 'issue' && k.n && k.n.trim();
            });
            if (!others.length) return;
            anyOther = true;
            out.push('', it.id + '  ' + it.title);
            others.forEach(function (c) {
              out.push(
                '  ' +
                  (check(c.id).v ? MARKS[check(c.id).v] : '[ ]') +
                  ' ' +
                  wrap('[' + groupTitle(it, c) + '] ' + c.label, 66, '    '),
              );
              out.push('      → ' + wrap(check(c.id).n, 70, '        '));
            });
          });
          if (!anyOther) out.push('', '  None.');
          if (!issuesOnly) {
            out.push('');
            out.push(rule('='));
            out.push(
              'FULL CHECKLIST  ([OK] correct · [ISSUE] see above · [SKIP] not applicable · [ ] not checked yet)',
            );
            out.push(rule('='));
            ITEMS.forEach(function (it) {
              out.push('', it.id + '  ' + it.title + '  —  ' + statusWord(it));
              it.groups.forEach(function (g) {
                out.push('  ' + g.title);
                g.checks.forEach(function (c) {
                  var k = check(c.id);
                  out.push(
                    '    ' +
                      (k.v ? MARKS[k.v] : '[ ]') +
                      ' ' +
                      wrap(c.label + (c.line ? ' (line ' + c.line + ')' : ''), 66, '          '),
                  );
                });
              });
            });
          }
          out.push('', rule('-'), 'End of report.');
          return out.join('\n') + '\n';
        }
        function download(name, text, type) {
          var blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = name;
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            URL.revokeObjectURL(a.href);
            a.remove();
          }, 1000);
        }
        function reportName(suffix) {
          return (
            'ltf-verification-' +
            MODULES.map(function (m) {
              return m.code;
            }).join('-') +
            '-' +
            today() +
            (suffix || '') +
            '.txt'
          );
        }
        var toastTimer;
        function toast(msg) {
          var t = $('toast');
          t.textContent = msg;
          t.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            t.classList.remove('show');
          }, 2200);
        }

        /* ---------------- wiring ---------------- */
        $('simVersion').value = state.simVersion || '';
        $('simVersion').addEventListener('input', function (e) {
          state.simVersion = e.target.value;
          save();
        });
        $('exportBtn').addEventListener('click', function () {
          download(reportName(), report(false));
          toast('Report saved to your Downloads folder.');
        });
        $('copyBtn').addEventListener('click', function () {
          var text = report(false);
          if (navigator.clipboard && navigator.clipboard.writeText)
            navigator.clipboard.writeText(text).then(
              function () {
                toast('Report copied.');
              },
              function () {
                download(reportName(), text);
              },
            );
          else download(reportName(), text);
        });
        $('menuBtn').addEventListener('click', function (e) {
          e.stopPropagation();
          $('menu').classList.toggle('open');
        });
        document.addEventListener('click', function () {
          $('menu').classList.remove('open');
        });
        $('issuesOnlyBtn').addEventListener('click', function () {
          download(reportName('-issues'), report(true));
          toast('Issues report saved.');
        });
        $('saveBtn').addEventListener('click', function () {
          download(
            'ltf-verifier-progress-' + today() + '.json',
            JSON.stringify(state, null, 2),
            'application/json',
          );
          toast('Progress file saved.');
        });
        $('loadBtn').addEventListener('click', function () {
          $('loadInput').click();
        });
        $('loadInput').addEventListener('change', function (e) {
          var f = e.target.files[0];
          if (!f) return;
          var reader = new FileReader();
          reader.onload = function () {
            try {
              var s = JSON.parse(reader.result);
              if (!s.checks || !s.items) throw new Error('bad');
              state = s;
              state.ui = state.ui || {};
              state.ui.hidden = state.ui.hidden || {};
              if (!state.ui.selected) state.ui.selected = ITEMS[0].id;
              save();
              $('simVersion').value = state.simVersion || '';
              refresh();
              toast('Progress loaded.');
            } catch (err) {
              toast('That file is not a verifier progress file.');
            }
          };
          reader.readAsText(f);
          e.target.value = '';
        });
        $('resetBtn').addEventListener('click', function () {
          if (
            !confirm(
              'Clear every tick and note? Save progress to a file first if you want to keep it.',
            )
          )
            return;
          state = blank();
          save();
          $('simVersion').value = state.simVersion;
          refresh();
        });
        window.addEventListener('beforeunload', function () {
          clearTimeout(saveTimer);
          try {
            localStorage.setItem(KEY, JSON.stringify(state));
          } catch (e) {
            /* nothing more to do while closing */
          }
        });
        document.addEventListener('keydown', function (e) {
          if (e.metaKey && e.key === 's') {
            e.preventDefault();
            download(reportName(), report(false));
            toast('Report saved.');
          }
        });
        /* ---------------- theme (Day / Night, like the site) ---------------- */
        var THEME_KEY = 'ltf-verifier:theme';
        function applyTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          $('themeBtn').textContent = theme === 'dark' ? 'Day' : 'Night';
          $('themeBtn').setAttribute(
            'aria-label',
            theme === 'dark' ? 'Switch to Day' : 'Switch to Night',
          );
        }
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem(THEME_KEY);
        } catch (e) {
          /* ignore */
        }
        applyTheme(
          savedTheme ||
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'),
        );
        $('themeBtn').addEventListener('click', function () {
          var next =
            document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch (e) {
            /* ignore */
          }
        });
        window.addEventListener('beforeunload', function () {
          clearTimeout(saveTimer);
          try {
            localStorage.setItem(KEY, JSON.stringify(state));
          } catch (e) {
            /* closing */
          }
        });
        refresh();
      })();
    </script>
  </body>
</html>
