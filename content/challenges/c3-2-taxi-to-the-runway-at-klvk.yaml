slug: c3-2-taxi-to-the-runway-at-klvk
code: C3.2
title: Taxi to the runway at KLVK
module: m3-ground-operations
lessons: [l3-2-taxiing-signs-and-markings]
priority: P0
type: procedure
difficulty: 2
estimatedMinutes: 15
published: false
lastVerifiedAt: null # set when verified in the sim (Section 54)
simVersion: null

goal: >
  Taxi from the main ramp (the northwest apron) to the run-up area for runway 25R using
  the airport diagram, with the taxi ribbon off.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KLVK
  startState: RAMP_RUNNING
  startDetails:
    parking: Parking 6 - Ramp GA Small (the northwest apron, by the FBO)
    runway: 25R # ⚠ verify — Sim check: real-world 7L/25R (AirNav 2026-10-13); confirm the sim lists it as 25R
  weatherPreset: WX_LIGHT_W
  timeLocal: '10:00'
  datePreset: late-spring
  loadPreset: LOAD_SOLO
  assistance: training
  aiTraffic: false
  atc: false
  crashDamage: false
  flightPlan: null

procedure:
  - Turn the sim's taxi ribbon off.
  - "Open the KLVK airport diagram (FAA Terminal Procedures, see Go deeper in Lesson 3.2). Plan your route from the northwest apron to the run-up area for runway 25R. On the FAA diagram it is taxiway Alfa east along the north side of runway 7L/25R, with no runway to cross. ⚠ verify — Sim check: desk-verified 2026-10-13 against the FAA diagram (AL-6075, taxiway A along the north side of 7L/25R); confirm the sim's parking spot and taxiway signs match, then write the exact sequence here."
  - Release the parking brake. Taxi at a brisk walking pace (10 kt or less, 5 kt or less in turns).
  - Hold the yoke for the wind (wind from 250° at 8 kt).
  - Stop in the run-up area, short of the hold short line for 25R. Set the parking brake.

criteria:
  - id: route
    label: Correct route, no wrong turns
    kind: tiered
    tiers:
      gold: No wrong turns
      silver: 1 wrong turn
      bronze: 2 wrong turns
    required: true
    weight: 3
    reviewLink: { lesson: l3-2-taxiing-signs-and-markings, section: the-livermore-airport-diagram }
  - id: speed
    label: Taxi speed
    kind: tiered
    tiers:
      gold: 10 kt GS or less, 5 kt or less in turns
      silver: 15 kt or less
      bronze: 20 kt or less
    required: true
    weight: 2
    reviewLink: { lesson: l3-2-taxiing-signs-and-markings, section: how-fast }
  - id: centerline
    label: Stayed on the centerline
    kind: tiered
    tiers:
      gold: Always
      silver: Minor deviations
      bronze: Crossed the taxiway edge line
    required: false
    weight: 1
  - id: hold-short
    label: Did not cross any hold short line
    kind: binary
    required: true
    weight: 3
    reviewLink: { lesson: l3-2-taxiing-signs-and-markings, section: markings }
  - id: wind-controls
    label: Held the correct control position for the wind
    kind: binary
    required: false
    weight: 1

randomEvents: []

commonMistakes:
  - Riding the brakes instead of reducing power.
  - Turning too fast.
  - Rolling past the hold short line.

tips:
  - Stop and look at the diagram whenever you're unsure. Stopping is always OK.

debriefQuestions:
  - id: where-am-i
    prompt: How did you know where you were on the airport?
