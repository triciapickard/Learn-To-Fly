    tiers:
      gold: Within ±10°
      silver: Within ±15°
      bronze: Within ±20°
    required: true
    weight: 2
  - id: airspeed
    label: Airspeed stable
    kind: tiered
    tiers:
      gold: Within ±10 kt
      silver: Within ±15 kt
      bronze: Within ±20 kt
    required: false
    weight: 1
  - id: hands-off
    label: Flew hands-off for 30 seconds after trimming, with altitude within ±100 ft
    kind: binary
    required: false
    weight: 2
  - id: lookout
    label: Looked outside for traffic at least every 30 seconds
    kind: binary
    required: false
    weight: 1

randomEvents: []

commonMistakes:
  - Chasing the vertical speed indicator instead of holding a pitch attitude.
  - Forgetting to set power after leveling off.
  - Staring at the PFD instead of looking outside.

tips:
  - If you are constantly pushing forward, trim nose down.
  - Make a small correction, then wait 3 seconds to see what it does.

debriefQuestions:
