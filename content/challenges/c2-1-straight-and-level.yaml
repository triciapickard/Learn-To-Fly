slug: c2-1-straight-and-level
code: C2.1
title: Straight and level
module: m2-fundamentals
lessons: [] # add l2-2-attitude-flying-and-trim when it is written (Phase 9)
priority: P0
type: manoeuvre
difficulty: 1
estimatedMinutes: 15
published: false
lastVerifiedAt: null # set when verified in the sim (Section 54)
simVersion: null

goal: >
  Hold altitude and heading for three minutes, with light hands and the airplane trimmed.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KLVK
  startState: AIR_START
  startDetails:
    position: 5 nm east of KLVK, over the valley toward the Altamont Pass
    altitudeFt: 3500
    headingDeg: 90
    speedKias: 100
    fallback: Start on the runway at KLVK, take off and climb east to 3,500 ft MSL. Start the timer when you are level at 3,500 ft on heading 090.
  weatherPreset: WX_CALM
  timeLocal: '10:00'
  datePreset: late-spring
  loadPreset: LOAD_SOLO
  assistance: training
  aiTraffic: false
  atc: false
  crashDamage: false
  flightPlan: null

procedure:
  - Set about 2,300 RPM. Put the horizon in the cruise position on the glare shield.
  - Trim until the airplane holds altitude with little or no pressure on the controls.
  - Pick a landmark on the horizon at heading 090, such as the Altamont Pass wind farms.
  - Hold 3,500 ft MSL and heading 090 for 3 minutes. Use the sim clock or a timer.
  - Make a gentle turn to heading 270, re-trim, and hold 3,500 ft and heading 270 for another 2 minutes.

