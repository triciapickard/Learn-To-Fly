slug: c3-3-run-up
code: C3.3
title: Run-up
module: m3-ground-operations
lessons: [l3-3-run-up-before-takeoff-and-after-landing]
priority: P0
type: procedure
difficulty: 2
estimatedMinutes: 10
published: false
lastVerifiedAt: null # set when verified in the sim (Section 54)
simVersion: null

goal: >
  Complete a full run-up and the before-takeoff checklist, and give a takeoff briefing out
  loud.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KLVK
  startState: RAMP_RUNNING
  startDetails:
    parking: Run-up area for runway 25R, or continue from C3.2 # ⚠ verify that the sim offers this spot
  weatherPreset: WX_LIGHT_W
  timeLocal: '10:00'
  datePreset: late-spring
  loadPreset: LOAD_SOLO
  assistance: training
  aiTraffic: false
  atc: false
  crashDamage: false
  flightPlan: null

procedure:
  - Stop in the run-up area, into the wind if you can, and set the parking brake.
  - Throttle to the checklist run-up RPM (about 1,800).
  - Magneto check — L, BOTH, R, BOTH. Note each RPM drop.
  - Engine instruments in the green, then throttle to idle and back to about 1,000 RPM.
  - Controls free and correct. Trim for takeoff. Flaps set. Fuel on BOTH. Mixture rich.
  - Transponder ALT, lights on, doors closed.
  - Say your takeoff briefing out loud, including what you'll do if the engine fails.

