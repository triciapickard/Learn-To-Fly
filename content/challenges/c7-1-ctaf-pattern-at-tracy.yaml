goal: >
  Arrive at Tracy from 10 nm out, make every CTAF call, fly the pattern and land.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KTCY
  startState: AIR_START
  startDetails:
    position: 10 nm west of KTCY, over the Altamont Pass
    altitudeFt: 3500
    headingDeg: 90
    speedKias: 100
    fallback: Start on the runway at KLVK, take off and fly east over the Altamont Pass at 3,500 ft MSL. Start when you're 10 nm from Tracy.
  weatherPreset: WX_LIGHT_W
  timeLocal: '10:00'
