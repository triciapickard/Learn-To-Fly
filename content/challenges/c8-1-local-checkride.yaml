randomEvents:
  - id: engine-failure
    label: Engine failure
    minSeconds: 1200
    maxSeconds: 1800
    message: Examiner — "Simulated engine failure." Finish the maneuver you're on if you're mid-maneuver, then set the mixture to idle cut-off and fly the ABCDE flow. Recover at 500 ft above the ground.
  - id: go-around
    label: Go-around
    minSeconds: 2100
    maxSeconds: 2700
    chance: 0.5
    message: Examiner — "On your approach to Livermore, go around once from short final, then land from the second approach."

commonMistakes:
  - Rushing the checklists at the start because the flight feels long.
  - Starting a maneuver without a clearing turn.
  - Forgetting the ATIS before calling the tower on the return.

tips:
  - Tick each step on the page as you finish it. The page records the time, which helps you debrief.

debriefQuestions:
  - id: examiner-fail
    prompt: Which step would an examiner have failed you on, and why?
  - id: practice-next
    prompt: What will you practice next?
