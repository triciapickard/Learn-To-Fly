slug: c8-1-local-checkride
code: C8.1
title: Local checkride
module: m8-capstone
lessons: [l8-2-preparing-for-your-checkride]
priority: P0
type: capstone
difficulty: 4
estimatedMinutes: 60
published: false
lastVerifiedAt: null # set when verified in the sim (Section 54)
simVersion: null

goal: >
  A "checkride" around Livermore — the core maneuvers, in order, in one continuous flight
  from a cold-and-dark start to shutdown.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KLVK
  startState: COLD_DARK
  startDetails:
    parking: Any ramp parking spot
    fallback: If the sim can't start cold and dark, start with the engine running and do the shutdown checklist first.
  weatherPreset: WX_LIGHT_W
  timeLocal: '10:00'
  datePreset: late-spring
  loadPreset: LOAD_SOLO
  assistance: training
  aiTraffic: true
  atc: true
  crashDamage: true
  flightPlan: null

procedure:
  - Start the timer. Cold-and-dark start, using the checklists.
  - Taxi, run-up and takeoff briefing.
  - Normal takeoff and departure to the practice area east of Livermore.
  - Steep turns — 360° left, then 360° right, at 45° of bank.
  - Slow flight, including a gentle turn, then recover.
  - Power-off stall and recovery.
  - Engine failure — when the page beeps, set the mixture to idle cut-off, fly the ABCDE flow and glide toward a field. At 500 ft above the ground, set the mixture rich, add power and climb away. If the beep comes during another maneuver, finish that maneuver first.
  - Return to Livermore with ATC and join the pattern as instructed.
  - Normal landing. If the page has told you to go around, go around once from short final and land from the second approach.
  - Taxi to parking and shut down.

