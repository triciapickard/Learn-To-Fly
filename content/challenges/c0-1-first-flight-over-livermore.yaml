    weight: 1
  - id: paused
    label: Used pause at least once to look around or read the brief
    kind: binary
    required: false
    weight: 1

randomEvents: []

commonMistakes:
  - Big stick movements. The airplane responds to small inputs; wait for it.
  - Forgetting to reduce power after leveling off, so the speed keeps increasing.

tips:
  - Hold the controls lightly, with your fingertips.
  - Look outside more than inside.

