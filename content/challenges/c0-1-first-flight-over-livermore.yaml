randomEvents: []

commonMistakes:
  - Big control inputs. The airplane needs a moment to respond, so make a small input and wait.
  - Leaving full power in after leveling off, so the speed keeps building and the airplane drifts back into a climb.

tips:
  - Hold the controls lightly, with your fingertips.
  - Look outside more than inside. Glance at the instruments, then look back out.
  - Pause whenever you want to think or re-read a step. You can't pause a real airplane, so use it freely in the sim.

