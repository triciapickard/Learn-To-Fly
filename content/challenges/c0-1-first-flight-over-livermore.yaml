slug: c0-1-first-flight-over-livermore
code: C0.1
title: First flight over Livermore
module: m0-getting-started
lessons: [l0-3-your-first-flight]
priority: P0
type: setup
difficulty: 1
estimatedMinutes: 20
published: true
lastVerifiedAt: 2026-09-28
simVersion: 'MSFS 2024 (1.8.16.0)'

goal: >
  Take off, fly a relaxed loop over the Livermore valley and feel how the Skyhawk
  responds. Reach 3,000 ft and turn once each way and you've passed. There's no score
  to chase today.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KLVK
  startState: RUNWAY
  startDetails:
    runway: 25R
  weatherPreset: WX_CALM
  timeLocal: '10:00'
  datePreset: late-spring
  loadPreset: LOAD_SOLO
  assistance: training
  aiTraffic: false
  atc: false
  crashDamage: false
  flightPlan: null

procedure:
  - With the sim paused, set the flaps to 10°.
  - Unpause and add full throttle smoothly. Keep the nose on the centerline with small rudder inputs (pedals, a twist of the stick, or the LT and RT triggers on a gamepad).
  - At 55 KIAS, gently raise the nose. Hold it a little above the horizon and climb at about 75 KIAS.
  - Once you're climbing steadily, a few hundred feet above the ground, raise the flaps to 0°.
  - Climb to 3,000 ft MSL. Lower the nose to level flight and reduce power to about 2,300 RPM.
  - Make a gentle left turn (about 15–20° of bank) toward Lake Del Valle, southeast of the airport. Then make a right turn toward Mt Diablo, the big mountain to the north.
  - Fly anywhere you like for 5–10 minutes. Try a small climb and a small descent.
  - End the flight from the pause menu, or fly back and try a landing at Livermore. It doesn't need to be pretty.

