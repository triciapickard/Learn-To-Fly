randomEvents: []

commonMistakes:
  - Confusing the avionics master with the master switch.
  - Moving the mixture out of idle cut-off and leaving it there. Nothing happens with the engine off, but put it back so your next engine start begins where the checklist expects it.

tips:
  - Zoom the camera toward each area of the panel.
  - On a gamepad, flaps and trim have buttons too (by default the D-pad for flaps, RB with the right stick for trim), but find the cockpit controls first.
  - Use the cockpit tooltips. They name every control.
  - Start the optional timer on the Fly tab when you begin, so you can score your time.

