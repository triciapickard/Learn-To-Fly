goal: >
  Find and operate the Skyhawk's main controls and instruments until you can
  reach each one without hunting for it. Tick each step on the Fly tab as you go.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KLVK
  startState: COLD_DARK
  startDetails:
    parking: Parking 6 - Ramp GA Small
  weatherPreset: WX_CALM
  timeLocal: '10:00'
  datePreset: late-spring
  loadPreset: LOAD_SOLO
  assistance: training # with cockpit tooltips on
  aiTraffic: false
  atc: false
  crashDamage: false
  flightPlan: null

procedure:
  - You start outside the airplane. Remove the three remove-before-flight covers (pitot tube, static port and engine) and the wheel chocks, then climb in. The 16 cockpit items start with the next step.
  - Master switch (BAT and ALT). Turn both halves on and watch the PFD start.
  - Avionics master (BUS 1 and BUS 2). Turn both on. The right-hand screen (MFD) shows OFF until you press the rightmost softkey (the up arrow) below it.
  - Fuel selector. Set it to BOTH.
  - Mixture. Find it, but leave it in idle cut-off for now.
  - Throttle. Find it and move it a little.
  - Ignition key switch (the tooltip calls it Magnetos). Find the five positions, OFF, R, L, BOTH and START, without starting the engine.
  - Flap switch. Lower and raise the flaps and watch the flap indicator.
  - Elevator trim. Move it and find the trim indicator.
  - Parking brake. Find it and check it is set.
  - PFD airspeed tape. Find the colored V-speed bands.
  - Altimeter setting (BARO). Set it to 29.92.
  - Heading bug. Move it with the HDG knob.
  - COM1. Tune 123.450 in standby and swap it to active.
  - Transponder. On the PFD, press the XPDR softkey. Find how to enter a code (CODE, then four digits from 0 to 7, such as 1200) and the STBY, ON and ALT modes.
  - EIS (the engine strip down the left edge of the MFD). Find FUEL QTY GAL and FFLOW GPH.
  - Standby instruments and the magnetic compass (at the top center of the windshield). Find them.
  - Put every switch you moved back to its cold-and-dark position.

