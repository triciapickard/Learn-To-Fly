goal: >
  Find and operate every essential control and instrument in the Skyhawk without
  searching. Tick each item on the Fly tab as you find it.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KLVK
  startState: COLD_DARK
  startDetails:
    parking: Main ramp # ⚠ verify the parking spot name in the sim
  weatherPreset: WX_CALM
  timeLocal: '10:00'
  datePreset: late-spring
  loadPreset: LOAD_SOLO
  assistance: training # with cockpit tooltips on
  aiTraffic: false
  atc: false
  crashDamage: false
  flightPlan: null

procedure:
  - Master switch (BAT and ALT) — turn it on.
  - Avionics master — turn it on and watch the screens start.
  - Fuel selector — set it to BOTH.
  - Mixture — find it, but don't move it to rich yet.
  - Throttle — find it and move it a little.
  - Ignition switch — find the OFF, R, L, BOTH and START positions (don't start the engine).
  - Flap switch — lower and raise the flaps and watch the flap indicator.
  - Elevator trim — move it and find the trim indicator.
  - Parking brake — find it and check it is set.
  - PFD airspeed tape — find the colored V-speed bands.
  - Altimeter setting (BARO) — set 29.92.
  - Heading bug — move it with the HDG knob.
  - COM1 — tune 123.45 in standby and swap it to active.
  - Transponder — find the code 1200 and the ALT mode.
  - EIS — find the fuel quantity and fuel flow.
  - Standby instruments and the magnetic compass — find them.
  - Return every switch you moved to its cold-and-dark position.

