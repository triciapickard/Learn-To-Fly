randomEvents: []

commonMistakes:
  - Confusing the avionics master with the master switch.
  - Moving the mixture out of idle cut-off. On some setups this starts fuel flow — harmless on the ground, but put it back.

tips:
  - Zoom the camera toward each area of the panel.
  - Use the cockpit tooltips; they name every control.
  - Start the timer on the Fly tab when you begin.

