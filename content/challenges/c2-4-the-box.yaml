randomEvents: []

commonMistakes:
  - Doing too many things at once. Finish one change, trim, then start the next.
  - Forgetting to trim, then fighting the airplane for the whole leg.

tips:
  - Plan the next leg while you are stable.
  - Pausing at the end of a leg is fine for Bronze or Silver. For Gold, fly it without pausing (tick "I paused" in the debrief if you did).

debriefQuestions:
  - id: paused
    prompt: Did you pause? Where, and why?
  - id: busiest-leg
    prompt: Which leg felt busiest?
