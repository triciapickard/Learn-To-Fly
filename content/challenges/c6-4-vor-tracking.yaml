estimatedMinutes: 25
published: false
lastVerifiedAt: null # set when verified in the sim (Section 54)
simVersion: null

goal: >
  Work out which radial of the Manteca VOR you're on, then intercept the 090 radial and
  track it outbound, correcting for the wind.

setup:
  aircraftVariant: c172-g1000
  airportIcao: KTCY
  startState: AIR_START
  startDetails:
    position: 10 nm south of the Manteca VOR (ECA), over the Central Valley # ⚠ verify ECA is in the sim; south keeps you clear of the Stockton Class C
    altitudeFt: 3500
    headingDeg: 360
    speedKias: 100
    fallback: Start on the runway at Tracy, take off and climb to 3,500 ft MSL. The Manteca VOR is about 12 nm east — start from wherever you are.
  weatherPreset: WX_LIGHT_W
  timeLocal: '10:00'
  datePreset: late-spring
  loadPreset: LOAD_SOLO
  assistance: training
  aiTraffic: false
  atc: false
  crashDamage: true
  flightPlan: null

procedure:
  - Tune the Manteca VOR (⚠ verify the frequency on the sectional) into NAV1 and identify it.
  - Press the CDI softkey until the needle is green (VOR1).
  - Turn the course knob until the needle centers with a FROM flag. That's the radial you're on.
  - Set 090 and turn to an intercept heading 30–45° toward the needle.
  - As the needle centers, turn onto the course. Track the 090 radial outbound for 10 nm, correcting for the wind.
  - Note the heading that kept the needle centered.

