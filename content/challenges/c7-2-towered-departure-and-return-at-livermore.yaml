    kind: tiered
    tiers:
      gold: All of them
      silver: 1 missed
      bronze: 2 missed
    required: true
    weight: 3
    reviewLink: { lesson: l7-3-towered-airports-and-sim-atc, section: read-backs }
  - id: followed
    label: Followed every ATC instruction
    kind: binary
    required: true
    weight: 3
  - id: frequency-changes
    label: Changed frequency promptly
    kind: binary
    required: false
    weight: 1
  - id: landing
    label: Pattern and landing (C4.3 Bronze or better)
    kind: binary
    required: true
    weight: 2

randomEvents: []

commonMistakes:
  - Calling ground before listening to the ATIS.
  - Crossing a hold short line without clearance.
  - Entering the Class D before the tower has answered with your call sign.

tips:
  - Before each call, say it once in your head.

debriefQuestions:
  - id: sim-vs-real
    prompt: Where did the sim's ATC differ from what you learned in Lesson 7.3?
