# Home-region airports (plan.md Section 11).
#
# Elevations, runways, traffic patterns, pattern altitudes, frequencies and airspace were
# checked on 2026-10-09 against the FAA Chart Supplement SW data effective 2026-10-01 (as
# published on AirNav), the FAA airport diagrams (01 Oct 2026 cycle) and the FAA Class
# Airspace dataset (NASR). Pattern altitudes are the published figures; where none is
# published, `patternNotes` says so and gives the standard 1,000 ft above the field.
#
# ⚠ Verify each runway name, frequency and pattern direction in the sim (Section 54.1:
# if the sim differs, tell learners to use the sim's value), then set verifiedAt and
# verifiedAgainst.
airports:
  - icao: KLVK
    name: Livermore Municipal
    city: Livermore, CA
    elevationFt: 400
    airspaceClass: D
    towered: true
    role: training
    runways:
      - designator: 7L/25R
        lengthFt: 5253
        widthFt: 100
        trafficPattern: varies
        patternAltitudeFt: 1400
      - designator: 7R/25L
        lengthFt: 2699
        widthFt: 75
        trafficPattern: varies
        patternAltitudeFt: 1400
    frequencies:
      - { type: ATIS, mhz: '119.65' }
      - { type: Ground, mhz: '121.6', notes: '0700–2100 local' }
      - { type: Tower, mhz: '118.1', notes: '0700–2100 local; CTAF when the tower is closed' }
      - { type: UNICOM, mhz: '122.95' }
      - { type: NorCal Approach, mhz: '123.85' }
    patternNotes: >-
      The pattern for runway 7L/25R is on the north side of the field (left traffic on 7L,
      right traffic on 25R) and the pattern for 7R/25L is on the south side (right traffic
      on 7R, left traffic on 25L). No pattern altitude is published, so the standard 1,000 ft
      above the field applies: about 1,400 ft MSL.
    notes:
      - 'Primary Learn-To-Fly training base: a wide, flat valley with parallel runways.'
      - Good practice area for maneuvers to the east, toward the Altamont Pass.
      - Class D from the surface to 2,900 ft MSL while the tower is open.
      - The FBO and terminal are on the northwest apron, north of runway 7L/25R. Taxiway A runs along the north side of 7L/25R to the runway 25R end, so taxiing from the northwest apron to 25R crosses no runway.
      - PAPI on runways 7L and 25R only. Do not mistake the parallel taxiway north of 25R/7L for the runway.
    links:
      skyvector: https://skyvector.com/airport/LVK/Livermore-Municipal-Airport
      airnav: https://www.airnav.com/airport/KLVK
    verifiedAt: null
    verifiedAgainst: []
    published: true
