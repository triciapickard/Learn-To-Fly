# The nine v1 modules (v1.md Section 13) and the thirteen v2 modules (v2.md Section 14).
# `lessons` and `challenges` list slugs in curriculum order; add each slug here when its
# file is written (v1 Phase 9, v2 Phases 22–23). v2 modules stay `published: false` until
# their content is verified (v2.md D2-17).
modules:
  - slug: m0-getting-started
    code: M0
    order: 0
    title: Getting started
    summary: Set up MSFS 2024 for training and take your first flight.
    description: >
      How Learn to Fly works, how to set up controls and assistance options so the sim
      teaches you instead of flying for you, and a first gentle flight over Livermore.
    icon: play
    lessons:
      - l0-1-welcome-how-learn-to-fly-works
      - l0-2-setting-up-msfs-2024-for-training
      - l0-3-your-first-flight
    challenges: [c0-1-first-flight-over-livermore]
    estimatedMinutes: 60
  - slug: m1-meet-the-skyhawk
    code: M1
    order: 1
    title: Meet the Skyhawk
    summary: Controls, the G1000 cockpit, engine, fuel, speeds and checklists.
    description: >
      Get to know the airplane before you fly it: the flight controls, the G1000 displays,
      the engine, fuel and electrical systems, the V-speeds and how professional pilots use
      checklists.
    icon: plane
    lessons:
      - l1-1-the-airframe-and-flight-controls
      - l1-2-the-cockpit-g1000-pfd-and-mfd
      - l1-3-engine-fuel-and-electrical-systems
      - l1-4-speeds-limits-and-checklists
    challenges: [c1-1-cockpit-scavenger-hunt]
    estimatedMinutes: 90
  - slug: m2-fundamentals
    code: M2
    order: 2
    title: Fundamentals of flight
    summary: Straight and level, climbs, descents and coordinated turns.
    description: >
      The four fundamentals every maneuver is built from. Learn how a wing works, fly by
      attitude and trim, and turn with the ball centered.
    icon: gauge
    lessons:
      - l2-1-four-forces-and-how-a-wing-works
      - l2-2-attitude-flying-and-trim
      - l2-3-climbs-and-descents
      - l2-4-turns-and-coordination
    challenges:
      - c2-1-straight-and-level
      - c2-2-climbs-and-descents
      - c2-3-turns-to-headings
      - c2-4-the-box
    estimatedMinutes: 180
  - slug: m3-ground-operations
    code: M3
    order: 3
    title: Ground operations
    summary: Preflight, engine start, taxiing and the run-up.
    description: >
      Everything between cold and dark and lining up on the runway: preflight, engine start,
      reading airport signs and markings, taxiing and the run-up.
    icon: clipboard-list
    lessons:
      - l3-1-preflight-and-engine-start
      - l3-2-taxiing-signs-and-markings
      - l3-3-run-up-before-takeoff-and-after-landing
    challenges:
      - c3-1-cold-and-dark-to-running
      - c3-2-taxi-to-the-runway-at-klvk
      - c3-3-run-up
      - c3-4-after-landing-and-shutdown
    estimatedMinutes: 120
  - slug: m4-takeoffs-patterns-landings
    code: M4
    order: 4
    title: Takeoffs, patterns and landings
    summary: Take off, fly the traffic pattern, land and go around.
    description: >
      Get into the air and back down again: normal takeoffs, the rectangular traffic
      pattern, stabilized approaches, landings and go-arounds.
    icon: plane-landing
    lessons:
      - l4-1-normal-takeoff-and-climb
      - l4-2-the-traffic-pattern
      - l4-3-normal-approach-and-landing
      - l4-4-go-arounds
    challenges:
      - c4-1-normal-takeoff-and-departure
      - c4-2-fly-the-pattern
      - c4-3-full-stop-landing
      - c4-4-go-around
      - c4-7-three-circuit-session
    estimatedMinutes: 270
  - slug: m5-slow-flight-stalls-emergencies
    code: M5
    order: 5
    title: Slow flight, stalls and emergencies
    summary: Handle the edges of the envelope and an engine failure.
    description: >
      Fly slowly and precisely, recognize and recover from stalls, understand load factor in
      steep turns and handle an engine failure calmly.
    icon: triangle-alert
    lessons:
      - l5-1-slow-flight
      - l5-2-stalls-power-off-and-power-on
      - l5-3-steep-turns-and-load-factor
      - l5-4-engine-failure-and-forced-landings
    challenges:
      - c5-1-slow-flight
      - c5-2-power-off-stall
      - c5-3-power-on-stall
      - c5-4-steep-turns
      - c5-5-engine-failure
    estimatedMinutes: 210
  - slug: m6-vfr-navigation
    code: M6
    order: 6
    title: VFR navigation
    summary: Charts, airspace, pilotage, dead reckoning, VOR and GPS.
    description: >
      Read a sectional chart, understand the airspace around the Bay Area and navigate with
      landmarks, calculations, a VOR and the G1000 GPS. Then plan a cross-country flight.
    icon: compass
    lessons:
      - l6-1-reading-a-sectional-chart
      - l6-2-airspace
      - l6-3-pilotage-and-dead-reckoning
      - l6-4-vor-navigation
      - l6-5-gps-navigation-with-the-g1000
      - l6-6-planning-a-cross-country-flight
    challenges:
      - c6-1-landmark-hunt
      - c6-2-pilotage-to-tracy
      - c6-3-dead-reckoning-to-half-moon-bay
      - c6-4-vor-tracking
      - c6-5-g1000-flight-plan
    estimatedMinutes: 300
  - slug: m7-radio-airport-operations
    code: M7
    order: 7
    title: Radio and airport operations
    summary: Radio calls at non-towered and towered airports.
    description: >
      Talk like a pilot: the phonetic alphabet, self-announcing at non-towered airports and
      working with the tower and the sim's ATC.
    icon: radio
    lessons:
      - l7-1-radio-basics-and-the-phonetic-alphabet
      - l7-2-non-towered-airports-ctaf
      - l7-3-towered-airports-and-sim-atc
    challenges:
      - c7-1-ctaf-pattern-at-tracy
      - c7-2-towered-departure-and-return-at-livermore
    estimatedMinutes: 120
  - slug: m8-capstone
    code: M8
    order: 8
    title: Capstone
    summary: Decision making, a local checkride and a cross-country flight.
    description: >
      Put it all together: make good go/no-go decisions, fly a local checkride and plan and
      fly a cross-country capstone flight.
    icon: award
    lessons:
      - l8-1-decision-making-and-personal-minimums
      - l8-2-preparing-for-your-checkride
    challenges:
      - c8-1-local-checkride
      - c8-2-cross-country-capstone
    estimatedMinutes: 150
  # ------------------------------------------------------------------------------------
  # v2 · Course 2 — Skyhawk Advanced VFR (v2.md Section 14.2). Drafts: published: false.
  - slug: m9-performance-weight-balance
    code: M9
    order: 9
    title: Performance, weight and balance
    summary: Density altitude, performance charts, weight and balance and leaning.
    description: >
      Judge what the airplane can do today: compute density altitude, read takeoff and
      landing charts, load the airplane within its envelope and lean the mixture for cruise
      and for high airports.
    icon: scale
    lessons:
      - l9-1-density-altitude-and-performance
      - l9-2-reading-performance-charts
      - l9-3-weight-and-balance
      - l9-4-leaning-the-mixture-and-fuel-management
    challenges: []
    estimatedMinutes: 180
    published: false
  - slug: m10-advanced-takeoffs-landings
    code: M10
    order: 10
    title: Advanced takeoffs and landings
    summary: Gusty crosswinds, slips, soft and short fields, and runway safety.
    description: >
      Land in harder conditions: gusts and wind shear, forward and side slips,
      soft-field and short-field technique over obstacles, wake turbulence and hot spots.
    icon: wind
    lessons:
      - l10-1-crosswinds-revisited-gusts-wind-shear-and-limits
      - l10-2-slips
      - l10-3-soft-field-takeoffs-and-landings
      - l10-4-short-field-mastery-and-obstacles
      - l10-5-runway-safety-wake-turbulence-and-hot-spots
      - l10-6-power-off-accuracy-landings
    challenges: []
    estimatedMinutes: 270
    published: false
  - slug: m11-weather
    code: M11
    order: 11
    title: Weather for pilots
    summary: Weather theory, forecasts, fog, storms, sim weather and the go/no-go call.
    description: >
      Read the sky and the forecast: air masses and fronts, TAFs and briefings, fog and the
      marine layer, thunderstorms and icing, how MSFS 2024 models weather, and how to make
      a go/no-go decision and escape from cloud if you get it wrong.
    icon: cloud-sun
    lessons:
      - l11-1-weather-theory-air-masses-fronts-and-stability
      - l11-2-forecasts-and-briefings
      - l11-3-clouds-fog-and-low-visibility
      - l11-4-thunderstorms-icing-and-turbulence
      - l11-5-weather-in-msfs-2024
      - l11-6-the-go-no-go-decision-and-vfr-into-imc
    challenges: []
    estimatedMinutes: 240
    published: false
  - slug: m12-night-flying
    code: M12
    order: 12
    title: Night flying
    summary: Night vision, lighting, night patterns and a night cross-country.
    description: >
      Fly after dark: how your eyes work at night, aircraft and airport lighting, night
      preflight and patterns, and a night cross-country with the emergencies that matter
      most when you cannot see the ground.
    icon: moon
    lessons:
      - l12-1-night-vision-and-illusions
      - l12-2-aircraft-and-airport-lighting
      - l12-3-night-operations-preflight-to-landing
      - l12-4-night-cross-country-and-night-emergencies
    challenges: []
    estimatedMinutes: 240
    published: false
  - slug: m13-mountain-flying
    code: M13
    order: 13
    title: Mountain flying
    summary: Mountain weather, route planning, high-elevation airports and escape routes.
    description: >
      Cross the Sierra Nevada safely: wind over ridges and mountain wave, planning a route
      along passes with escape options, operating at airports above 5,000 ft, and why you
      never enter a canyon you cannot turn around in.
    icon: mountain
    lessons:
      - l13-1-mountain-weather-and-airflow
      - l13-2-planning-a-mountain-route
      - l13-3-high-elevation-airport-operations
      - l13-4-canyon-turns-and-escape-routes
    challenges: []
    estimatedMinutes: 270
    published: false
  - slug: m14-failures-emergencies
    code: M14
    order: 14
    title: Systems failures and advanced emergencies
    summary: Electrical, instrument, engine and fire emergencies, and off-airport landings.
    description: >
      Handle failures other than a dead engine: a failed alternator, a frozen pitot
      tube or a dark PFD, a rough-running engine, fire and smoke with an emergency descent,
      and choosing a field or ditching when there is no airport.
    icon: zap-off
    lessons:
      - l14-1-electrical-failures
      - l14-2-instrument-and-avionics-failures
      - l14-3-partial-power-loss-and-fuel-problems
      - l14-4-fire-smoke-and-emergency-descent
      - l14-5-off-airport-landings-and-ditching
    challenges: []
    estimatedMinutes: 270
    published: false
  - slug: m15-advanced-airspace-atc
    code: M15
    order: 15
    title: Advanced airspace, ATC and online flying
    summary: Class B and C, flight following, light guns, readbacks and VATSIM.
    description: >
      Work with busy airspace and real controllers: Class B and Class C procedures, flight
      following with approach control, light gun signals and lost communications, precise
      readbacks, and your first flight on an online ATC network.
    icon: radio-tower
    lessons:
      - l15-1-class-b-and-class-c-operations
      - l15-2-flight-following-and-working-approach-control
      - l15-3-light-gun-signals-lost-comms-and-special-vfr
      - l15-4-readbacks-and-phraseology
      - l15-5-flying-on-vatsim
    challenges: []
    estimatedMinutes: 240
    published: false
  - slug: m16-advanced-vfr-capstone
    code: M16
    order: 16
    title: Advanced VFR capstone
    summary: Risk management for long flights and the Advanced VFR stage check.
    description: >
      Put Course 2 together: the 5P check and personal minimums for longer flights, then
      the Advanced VFR stage check and a Bay-to-Sierra cross-country.
    icon: award
    lessons:
      - l16-1-risk-management-for-longer-flights
      - l16-2-preparing-for-the-advanced-vfr-stage-check
    challenges: []
    estimatedMinutes: 210
    published: false
  # ------------------------------------------------------------------------------------
  # v2 · Course 3 — Skyhawk Instrument Foundations (v2.md Section 14.2).
  - slug: m17-attitude-instrument-flying
    code: M17
    order: 17
    title: Attitude instrument flying
    summary: The scan, basic instrument maneuvers, unusual attitudes and partial panel.
    description: >
      Fly the airplane by the instruments alone: the control-and-performance scan, basic
      maneuvers to instrument tolerances, recovering from unusual attitudes, flying on the
      standby instruments, and why your inner ear misleads you.
    icon: scan-eye
    lessons:
      - l17-1-the-instrument-scan
      - l17-2-basic-instrument-maneuvers-and-patterns
      - l17-3-unusual-attitude-recovery
      - l17-4-partial-panel-and-the-magnetic-compass
      - l17-5-spatial-disorientation
    challenges: []
    estimatedMinutes: 300
    published: false
  - slug: m18-ifr-system
    code: M18
    order: 18
    title: The IFR system
    summary: IFR rules, charts and plates, clearances, the G1000 for IFR, and enroute.
    description: >
      Understand how instrument flight works: fuel, alternates and currency rules, enroute
      charts and approach plates, copying clearances, programming the G1000 NXi and GFC 700,
      and flying enroute with the lost-communications rules.
    icon: file-text
    lessons:
      - l18-1-ifr-rules-minimums-currency-alternates-and-fuel
      - l18-2-ifr-charts-and-the-approach-plate
      - l18-3-clearances-and-departures
      - l18-4-the-g1000-nxi-and-gfc-700-for-ifr
      - l18-5-enroute-ifr-and-lost-communications
    challenges: []
    estimatedMinutes: 270
    published: false
  - slug: m19-holding
    code: M19
    order: 19
    title: Holding
    summary: Holding pattern entries, timing and wind, by hand and with the G1000.
    description: >
      Fly a holding pattern from an ATC instruction: visualize the hold, pick the entry,
      time the legs and correct for wind, then let the G1000 and autopilot do it while you
      monitor.
    icon: refresh-cw
    lessons:
      - l19-1-holding-patterns-entries-timing-and-wind
      - l19-2-holding-with-the-g1000-and-autopilot
    challenges: []
    estimatedMinutes: 150
    published: false
  - slug: m20-instrument-approaches
    code: M20
    order: 20
    title: Instrument approaches
    summary: Approach anatomy, RNAV (GPS), ILS, VOR, missed and circling approaches.
    description: >
      Get down through the cloud: the segments and minima of an approach, RNAV (GPS) to
      LPV and LNAV minimums, the ILS hand-flown and coupled, VOR and other non-precision
      approaches, and the missed approach when the runway is not there.
    icon: plane-landing
    lessons:
      - l20-1-anatomy-of-an-instrument-approach
      - l20-2-rnav-gps-approaches
      - l20-3-ils-approaches
      - l20-4-vor-and-other-non-precision-approaches
      - l20-5-missed-approaches
      - l20-6-circling-approaches-and-procedure-turns
    challenges: []
    estimatedMinutes: 420
    published: false
  - slug: m21-instrument-capstone
    code: M21
    order: 21
    title: Instrument capstone
    summary: Single-pilot IFR, automation management, IFR emergencies and the stage check.
    description: >
      Finish Course 3: manage workload and automation as a single pilot, handle an
      electrical failure, partial panel and lost communications in cloud, then fly the
      Instrument stage check and an IFR cross-country capstone.
    icon: award
    lessons:
      - l21-1-single-pilot-ifr-and-automation-management
      - l21-2-ifr-emergencies
    challenges: []
    estimatedMinutes: 240
    published: false
