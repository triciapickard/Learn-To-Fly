# W11 Airspace Cross-section data (plan.md Section 16.12).
#
# A simplified side view along a line from Half Moon Bay to San Francisco International,
# Oakland, Hayward, Livermore and Tracy. Distances are along that bent line (great-circle
# legs between the six airports), the shelf edges are rounded to the nearest half mile
# and small steps are merged: this teaches the shape of the airspace, not where its edges
# are. Never use it for navigation.
#
# Floors, ceilings and positions were checked on 2026-10-09 against the FAA Class Airspace
# dataset (NASR, the data the San Francisco TAC and sectional are drawn from), sampled
# every nautical mile along the line. The terrain silhouette is approximate.
slug: bay-area
