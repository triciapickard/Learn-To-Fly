requirements:
  B:
    entry: >-
      An ATC clearance ("cleared into the Class Bravo"), two-way radio, and a transponder
      with altitude reporting (Mode C) plus ADS-B Out. Student pilots also need a logbook
      endorsement.
    vfrMinimums: 3 statute miles visibility, clear of clouds.
  C:
    entry: >-
      Two-way radio contact established before entering (ATC replies with your call sign),
      and a transponder with altitude reporting plus ADS-B Out.
    vfrMinimums: 3 statute miles; 500 ft below, 1,000 ft above and 2,000 ft horizontally from clouds.
  D:
    entry: Two-way radio contact established with the tower before entering.
    vfrMinimums: 3 statute miles; 500 ft below, 1,000 ft above and 2,000 ft horizontally from clouds.
  E:
    entry: None for VFR flights.
    vfrMinimums: >-
      Below 10,000 ft MSL: 3 statute miles; 500 ft below, 1,000 ft above and 2,000 ft
      horizontally from clouds.
  G:
    entry: None.
    vfrMinimums: Below 1,200 ft above the ground by day, 1 statute mile and clear of clouds.
source: FAA Class Airspace data (NASR), as drawn on the San Francisco TAC, simplified. Checked 2026-10-09.
